<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auria — Painel da Qualidade</title>
<link rel="icon" href="logo_symbol.png" type="image/png">
<meta name="robots" content="noindex">
<script src="auria_busy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auria_pdfview.js"></script>
<script src="auria_word.js"></script>
<script src="auria_itcopia.js"></script>
<script src="auria_biblioteca.js"></script>
<!-- ===========================================================================
     Painel da Qualidade (mockup aprovado em 2026-10-18: mockups/painel_qualidade.html)
     Entrada do setor de Qualidade (role setor + setor_area qualidade); a gestão
     do grupo também abre. Telas: Para fazer · Biblioteca normativa · Conferência
     de FVS · Fichas das obras · Cópias controladas.
     Manutenção da biblioteca (publicar revisão, importar, solicitações) vem de
     auria_biblioteca.js — o mesmo código do padroes_grupo.html.
     Permissões são do banco (grupo_pode_editar); a página só esconde.
     =========================================================================== -->
<style>
  :root{
    --bg:#EEF2F7; --panel:#FFFFFF; --panel2:#F6F9FC; --line:#E2E8F0; --line2:#F1F5F9;
    --txt:#0F172A; --txt2:#334155; --mut:#64748B;
    --navy:#1E3A5F; --accent:#E8960A; --accentBg:#FEF6E7; --ok:#1E8449; --warn:#B7791F; --err:#A32D2D;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  body.dark{
    --bg:#0B1220; --panel:#141C2B; --panel2:#1B2536; --line:#26324A; --line2:#1E293B;
    --txt:#E8EEF6; --txt2:#C2CFDF; --mut:#8496AC;
    --navy:#7FB3D3; --accent:#F0A72A; --accentBg:#2A2212; --ok:#4ADE80; --warn:#E9B44C; --err:#F87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Arial;font-size:13.5px;line-height:1.45}
  /* Barra = a mesma do Painel do Analista (.cdh): marca + painel à esquerda,
     logo e nome do grupo no centro, usuário à direita. auria_logo_trim.js corta
     as margens brancas da logo do grupo (o recortador salva em quadrado). */
  .cdh{background:linear-gradient(90deg,#0B1220,#152036);color:#fff;padding:10px 18px;display:grid;min-height:66px;
       grid-template-columns:1fr auto 1fr;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .cdh-l{display:flex;align-items:center;gap:20px;justify-self:start}
  .cdh-l img{height:22px;width:auto;display:block}
  header .glogo{height:46px;min-width:46px;max-width:150px;flex-shrink:0;border-radius:8px;background:#fff;border:1.5px solid #E8960A;
         display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:3px 6px}
  header .glogo img{max-width:100%;max-height:100%;height:auto;object-fit:contain;display:block}
  header .glogo.ph{border:1.5px dashed #3A4A66;background:rgba(255,255,255,.06);font-family:var(--mono);
         font-weight:800;font-size:11px;letter-spacing:.04em;color:#8FA6C0;padding:0 10px}
  .cdh .tt{border-left:2px solid #E8960A;padding-left:12px}
  .cdh .tt b{display:block;font-size:11.5px;color:rgba(255,255,255,.78);letter-spacing:.16em;text-transform:uppercase;font-weight:600;line-height:1.3}
  .cdh .tt span{display:block;font-size:10.5px;color:#8FA6C0;margin-top:2px}
  .cdh-c{justify-self:center;display:flex;align-items:center;gap:12px}
  .cdh-c .ctxt{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
  .cdh-c b{font-size:17px;font-weight:800;line-height:1.15;letter-spacing:.01em}
  .cdh-c span{font-size:11px;color:#8FA6C0}
  .cdh-r{display:flex;align-items:center;gap:9px;justify-self:end}
  .cdh .who{text-align:right;font-size:11.5px;color:#9DB3CA;line-height:1.35;display:flex;flex-direction:column}
  .cdh .who b{color:#fff;font-size:12.5px}
  .hbtn{background:#1B2942;border:1px solid #2A3850;color:#C9D6E4;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
  .hbtn:hover{border-color:var(--accent)}

  .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 66px)}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}
  .nbusca{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--mut);background:var(--panel2);margin:0 2px 6px}
  .nbusca:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #FBE7C4}
  .nbusca input{border:none;background:none;outline:none;padding:8px 0;font:inherit;font-size:12.5px;color:var(--txt);flex:1;min-width:0}
  nav .grp{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:12px 10px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border-left:3px solid transparent;color:var(--txt2);font-weight:600;cursor:pointer;text-decoration:none}
  nav a:hover{background:var(--panel2)}
  nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--mut)}
  nav a.on{background:var(--accentBg);border-left-color:var(--accent);color:var(--navy)}
  nav a.on svg{color:var(--accent)}
  nav a .n{margin-left:auto;font:800 11px var(--mono);background:var(--line);color:var(--mut);border-radius:99px;padding:1px 7px}
  nav a .n.q{background:var(--accent);color:#231703}
  main{min-width:0}
  .tela{padding:20px 24px 60px}
  .load{padding:70px 20px;text-align:center;color:var(--mut)}

  h2{font-size:18px;color:var(--navy);margin:0}
  .sub{color:var(--mut);font-size:12.5px;margin:3px 0 0}
  .thd{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .thd > div:first-child{flex:1;min-width:240px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .card > .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .card > .hd b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
  .sp{flex:1}
  .cod{font-family:var(--mono);font-weight:700;color:var(--navy)}
  .chip{display:inline-block;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 8px;white-space:nowrap;vertical-align:1px}
  .c-ras{background:#FEF0D9;color:#8A5A04}.c-val{background:#FFEDD5;color:#C2410C}.c-rev{background:#FEE2E2;color:#B91C1C}
  .c-pub{background:#E6F4EC;color:#1E8449}.c-nav{background:#E8F0F8;color:#1E3A5F}.c-mut{background:#F1F5F9;color:#64748B}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  body.dark .btn:not(.sec){color:#0B1220}
  .btn.sec{background:var(--panel);color:var(--navy);border:1px solid var(--line)}
  .btn.sec:hover{border-color:var(--accent)}
  .btn.ac{background:var(--accent);color:#231703}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .hint{color:var(--mut);font-size:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  kbd{font:700 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--txt2);background:var(--panel)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  label.l{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin:10px 0 4px}
  input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--panel);color:var(--txt);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #FBE7C4}
  input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--mut)}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .chk{display:flex;align-items:center;gap:7px;font-weight:600;margin:6px 0}
  .chk input{width:auto}
  .msg{font-size:12px;margin-top:8px;min-height:16px}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
  .vazio{padding:28px 16px;text-align:center;color:var(--mut)}

  /* modal (o mesmo do padroes_grupo — auria_biblioteca.js usa #ov/#ovBox) */
  .ov{position:fixed;inset:0;background:rgba(11,18,32,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov.on{display:flex}
  .box{background:var(--panel);border-radius:14px;width:560px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 0 0 2px var(--accent),0 20px 60px rgba(0,0,0,.35)}
  .box .hd{padding:14px 18px;border-bottom:1px solid var(--line)}.box .hd b{color:var(--navy);font-size:15px}
  .box .bd{padding:6px 18px 12px}
  .box .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}

  /* ── Para fazer ── */
  .t1g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .fila .it{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2);border-left:3px solid transparent}
  .fila .it:last-child{border-bottom:none}
  .fila .it.pri{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accentBg),var(--panel) 40%)}
  .fila .num{font:800 24px var(--mono);color:var(--navy);min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
  .fila .pri .num{color:var(--accent)}
  .fila .num.zero{color:var(--line)}
  .fila .tx{flex:1;min-width:0}
  .fila .tx b{display:block;font-size:14px}
  .fila .tx span{font-size:12px;color:var(--mut)}
  .fila .okd{font-size:11.5px;font-weight:700;color:var(--ok)}
  .bar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .etp{display:grid;grid-template-columns:140px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12px;margin-top:9px}
  .etp .bar{height:7px}
  .etp .q{font:700 11.5px var(--mono);color:var(--mut);text-align:right}
  .leg{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
  .leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .mini div{background:var(--panel);padding:12px 14px}
  .mini b{display:block;font:800 20px var(--mono);color:var(--navy)}
  .mini span{font-size:11.5px;color:var(--mut)}
  .ativ{padding:6px 16px 12px}
  .ativ .e{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  .ativ .e:last-child{border:none}
  .ativ .e i{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--line)}
  .ativ .e i.a{background:var(--accent)} .ativ .e i.g{background:var(--ok)} .ativ .e i.n{background:var(--navy)}
  .ativ .e small{display:block;color:var(--mut);font-size:11px}

  /* ── Biblioteca ── */
  .bib{display:grid;grid-template-columns:150px minmax(0,1fr) 420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 66px - 118px);min-height:560px}
  .trilho{background:var(--panel2);border-right:1px solid var(--line);padding:10px 0;overflow:auto}
  .trilho .g{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--mut);padding:10px 14px 4px}
  .trilho a{display:flex;justify-content:space-between;padding:7px 14px;font:700 12px var(--mono);letter-spacing:.08em;color:var(--txt2);border-left:3px solid transparent;cursor:pointer;text-transform:uppercase}
  .trilho a span{color:var(--mut);font-weight:600}
  .trilho a:hover{background:var(--panel)}
  .trilho a.on{border-left-color:var(--accent);background:var(--panel);color:var(--navy)}
  .lst{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
  .lst .tb{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
  .lst .tb input{flex:1}
  .lst .sc{overflow:auto;flex:1}
  .tgl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .tgl button{padding:7px 10px;font-size:12px;font-weight:700;color:var(--mut);background:var(--panel);border:none;cursor:pointer;font-family:inherit}
  .tgl button.on{background:var(--navy);color:#fff}
  .doc{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);border-left:3px solid transparent;cursor:pointer}
  .doc:hover{background:var(--panel2)}
  .doc.sel{border-left-color:var(--accent);background:var(--accentBg)}
  .doc.obs{opacity:.55}
  .doc .t{font-weight:600;min-width:0}
  .doc .t small{display:block;color:var(--mut);font-weight:400;font-size:11.5px;margin-top:2px}
  .doc .t mark{background:#FDE7D3;color:#9A3412;font-weight:700}
  .doc .r{font:700 12px var(--mono);color:var(--navy);text-align:right}
  .doc .r small{display:block;font-weight:500;color:var(--mut);font-size:10px}
  .det{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
  .det .top{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .det .top .cod{font-size:20px}
  .det .top h3{margin:2px 0 6px;font-size:15px}
  .vig{display:flex;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .vig b{font:800 22px var(--mono);color:var(--navy);line-height:1}
  .vig small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;flex-wrap:wrap}
  .dtabs button{padding:9px 10px;font-size:12px;font-weight:700;color:var(--mut);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:inherit}
  .dtabs button.on{color:var(--navy);border-bottom-color:var(--accent)}
  .dbody{padding:12px 16px;font-size:12.5px}
  .lig{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
  .lig:hover{border-color:var(--accent)}
  .lig .cod{font-size:12px;min-width:88px}
  .lig .x{flex:1;min-width:0}
  .lig .x small{display:block;color:var(--mut);font-size:11px}
  .mono-t{font:700 10px var(--mono);letter-spacing:.12em;color:var(--mut);margin:14px 0 6px}

  /* ── Conferência ── */
  .conf{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1.2fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 66px - 118px);min-height:560px}
  .fq{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .fq .tb{padding:10px 12px;border-bottom:1px solid var(--line)}
  .fq .seg{display:flex;gap:4px;margin-top:8px}
  .fq .seg button{flex:1;font-size:11.5px;font-weight:700;padding:5px 0;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--panel);cursor:pointer;font-family:inherit}
  .fq .seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fq .ls{overflow:auto;flex:1}
  .fq .gi{font:700 10px var(--mono);letter-spacing:.1em;color:var(--mut);padding:9px 12px 4px;background:var(--panel2);border-bottom:1px solid var(--line2);display:flex;gap:6px;text-transform:uppercase}
  .fq .gi span{margin-left:auto}
  .fq .f{padding:8px 12px;border-bottom:1px solid var(--line2);border-left:3px solid transparent;font-size:12.5px;cursor:pointer}
  .fq .f:hover{background:var(--panel2)}
  .fq .f .cod{font-size:11.5px;display:block}
  .fq .f.sel{border-left-color:var(--accent);background:var(--accentBg)}
  .pdf{background:#525A66;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
  .pdf .tb{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#2B323D;color:#C9D6E4;font-size:12px}
  .pdf .tb .cod{color:#fff}
  .pdf .tb button{background:#1B2942;border:1px solid #2A3850;color:#C9D6E4;border-radius:7px;padding:3px 9px;font-weight:700;cursor:pointer;font-family:inherit}
  .pdf .tb button:hover{border-color:var(--accent)}
  .pdf .pc{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .pdf .pg{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);position:relative;flex:none}
  .pdf .pg canvas{display:block;width:100%;height:100%}
  .pdf .pg.ref{outline:3px solid var(--accent);outline-offset:2px}
  .minuta{margin:12px 0 0;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--card)}
  .minuta.devolvida{border-left-color:#C0392B}
  .minuta .mh{display:flex;align-items:center;gap:8px}.minuta .mh b{font-size:13px}.minuta .sp{flex:1}
  .minuta .mps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px}
  .minuta .mp{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:auto 1fr;column-gap:6px}
  .minuta .mp i{font-style:normal;grid-row:span 2;color:var(--mut)}.minuta .mp b{font-size:12px}.minuta .mp small{font-size:11px;color:var(--mut);grid-column:2}
  .minuta .mp.ok i{color:var(--ok)}.minuta .mp.on{border-color:var(--accent)}.minuta .mp.on i{color:var(--accent)}
  .minuta .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .cie{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  .cie .bar{height:8px}
  .pdf .pg .hl{position:absolute;background:rgba(232,150,10,.28);border-bottom:2px solid #E8960A;border-radius:2px;pointer-events:none;mix-blend-mode:multiply}
  .itc.foco{border-color:#E8960A;box-shadow:0 0 0 2px rgba(232,150,10,.25)}
  .pdf .pg .nr{position:absolute;top:-1px;left:-1px;font:700 10px var(--mono);background:#2B323D;color:#fff;padding:1px 6px;border-radius:0 0 5px 0}
  .pdf .pg.ref .nr{background:var(--accent);color:#231703}
  .pdf .pm{color:#C9D6E4;font-size:13px;margin-top:40px;text-align:center;padding:0 20px}
  .ed{display:flex;flex-direction:column;min-height:0;min-width:0}
  .ed .top{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
  .ed .top .cod{font-size:18px}
  .alerta{background:#FFF7ED;border:1px solid #FDBA74;border-left:3px solid var(--accent);border-radius:9px;padding:9px 12px;margin:10px 0 0;font-size:12.5px;color:#7C2D12}
  .alerta.rev{background:#FEF2F2;border-color:#FCA5A5;border-left-color:#B91C1C;color:#7F1D1D}
  .ed .its{overflow:auto;flex:1;padding:6px 18px 10px}
  .ed table td{padding:5px 4px;border-bottom:1px solid var(--line2)}
  .ed table th{padding:6px 4px}
  .ed textarea{padding:5px 7px;font-size:12.5px;resize:vertical;min-height:34px;line-height:1.35}

  .mx td{border:none;padding:0}

  .cl[data-id]{cursor:pointer}
  .cl.aberta{background:#93C5FD}.cl.em_verificacao{background:#1E3A5F}.cl.aguardando{background:#E8960A}.cl.reprovada{background:#C0392B}.cl.aprovada{background:#1E8449}
  .cl.foc{outline:2.5px solid var(--accent);outline-offset:1px}
  .fic{padding:14px 16px}
  .fic .cod{font-size:16px}
  .res{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:start}
  .res .n{font:700 11px var(--mono);color:var(--mut)}
  .hist{border-left:2px solid var(--line);margin:10px 0 0 4px;padding-left:12px;font-size:12px}
  .hist div{margin-bottom:7px;position:relative}
  .hist div::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--navy)}
  .hist div.a::before{background:var(--ok)} .hist div.r::before{background:#C0392B}

  @media (max-width:1100px){
    .t1g,.t4g{grid-template-columns:minmax(0,1fr)}
    .bib{grid-template-columns:120px minmax(0,1fr);height:auto} .bib .det{grid-column:1/-1;border-top:1px solid var(--line)}
    .conf{grid-template-columns:220px minmax(0,1fr);height:auto} .conf .pdf{display:none}
  }

  }

<script>
const sb = window.supabase.createClient(
  'https://sabzccokueowpromwxdg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const dt = d => d ? new Date(d).toLocaleDateString('pt-BR') : '';
const dth = d => d ? new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const rev2 = n => String(n == null ? 0 : n).padStart(2, '0');

let ME = null, GRUPO = null, PODE = { its:false, qualidade:false }, ITS = [], FVS = [], EMPS = [], TELA = 'fazer';
const TEMA_ROT = { seguranca:'Segurança', qualidade:'Qualidade', execucao:'Execução', meio_ambiente:'Meio ambiente', outro:'Outro' };
const ETAPA_ROT = { estrutura:'Estrutura', vedacao:'Vedação', revestimento:'Revestimento', instalacoes:'Instalações', impermeabilizacao:'Impermeabilização', acabamento:'Acabamento', fachada:'Fachada', outro:'Outro' };
const NIVEL_ROT = { pavimento:'Pavimento', unidade:'Unidade (apto/sala)', ambiente:'Ambiente' };
const SIT = { aberta:['Aberta','#93C5FD'], em_verificacao:['Em verificação','#1E3A5F'], aguardando:['Aguardando aprovação','#E8960A'], reprovada:['Reprovada','#C0392B'], aprovada:['Aprovada','#1E8449'] };

function tema(){ const d = document.body.classList.toggle('dark'); try { localStorage.setItem('auria_theme', d ? 'dark' : 'light'); } catch (e){} }
try { if (localStorage.getItem('auria_theme') === 'dark') document.body.classList.add('dark'); } catch (e){}
async function sair(){ try { await sb.auth.signOut(); } catch (e){} location.replace('./'); }
function ov(html){ $('ovBox').style.width = ''; $('ovBox').innerHTML = html; $('ov').classList.add('on'); }
function ovFechar(){ $('ov').classList.remove('on'); }
async function r2Url(action, path, contentType){
  const r = await sb.functions.invoke('cde-r2', { body:{ action, path, contentType } });
  if (r.error){ let m = r.error.message; try { const b = await r.error.context.json(); if (b && b.error) m = b.error; } catch (_){} throw new Error(m); }
  return r.data.url;
}
const itDe = id => ITS.find(i => i.id === id);
const vigDe = i => i && (i.revs || []).find(r => r.vigente);
const fvsAlerta = m => !!(m.validar_nota || m.revisar_it_rev);

// ── entrada ─────────────────────────────────────────────────────────────────
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ location.replace('./?next=' + encodeURIComponent('qualidade.html' + location.hash)); return; }
  const { data:p } = await sb.from('usuarios_auria').select('id,nome,email,role,empresa_id,setor_area').eq('id', session.user.id).maybeSingle();
  // Guarda: setor da Qualidade e gestão do grupo. Outro setor volta à consulta do CDE.
  if (!p){ location.replace('./'); return; }
  if (p.role === 'setor' && p.setor_area !== 'qualidade'){ location.replace('cde_setor.html'); return; }
  if (!['setor','gerente','super_admin'].includes(p.role)){ location.replace('./'); return; }
  ME = p; GRUPO = p.empresa_id;
  $('uNome').textContent = p.nome || p.email;
  $('uPapel').textContent = p.role === 'setor' ? 'Setor · Qualidade' : (p.role === 'gerente' ? 'Gestão do grupo' : 'Administrador');
  try { sb.rpc('auria_ping_acesso').then(() => {}, () => {}); } catch (_){}
  const [g, pi, pq, em] = await Promise.all([
    sb.from('empresas_auria').select('nome,logo_url').eq('id', GRUPO).maybeSingle(),
    sb.rpc('grupo_pode_editar', { p_grupo:GRUPO, p_secao:'its' }),
    sb.rpc('grupo_pode_editar', { p_grupo:GRUPO, p_secao:'qualidade' }),
    sb.from('empreendimentos_auria').select('id,nome').eq('empresa_id', GRUPO).order('nome')]);
  PODE.its = pi.data === true; PODE.qualidade = pq.data === true;
  EMPS = em.data || [];
  const gn = g.data ? g.data.nome : '';
  $('hGrupo').textContent = gn;
  // Logo do grupo: mesma regra do Painel do Analista (com logo = imagem; sem = iniciais tracejadas).
  const el = $('gLogo');
  if (g.data){ el.style.display = ''; el.title = gn;
    if (g.data.logo_url){ el.className = 'glogo'; el.innerHTML = '<img src="' + esc(g.data.logo_url) + '" alt="' + esc(gn) + '">'; }
    else { el.className = 'glogo ph'; el.textContent = String(gn || '?').replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 4).toUpperCase() || '?'; } }
  await Promise.all([carregarITs(), carregarFvs()]);
  $('load').style.display = 'none'; $('app').style.display = '';
  window.__ajudaCfg = { sb, papel:'setor', pagina:'Painel da Qualidade' }; if (window.AuriaAjuda) AuriaAjuda.init(window.__ajudaCfg);
  window.addEventListener('hashchange', rotear);
  rotear();
  contadores();
}
async function carregarFvs(){
  const { data } = await sb.from('fvs_modelo_auria').select('*').eq('grupo_id', GRUPO).eq('tipo', 'fvs').order('codigo');
  FVS = (data || []).sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { numeric:true }));
}
function rotear(){
  const t = (location.hash || '#fazer').slice(1).split('?')[0];
  TELA = ({ fazer:1, biblioteca:1, conferencia:1, fichas:1, copias:1 })[t] ? t : 'fazer';
  document.querySelectorAll('#nav a[data-t]').forEach(a => a.classList.toggle('on', a.dataset.t === TELA));
  ({ fazer:telaFazer, biblioteca:telaBiblioteca, conferencia:telaConferencia, fichas:telaFichas, copias:telaCopias })[TELA]();
}
function ir(t){ if (('#' + t) === location.hash) rotear(); else location.hash = t; }

// Contadores do menu e da fila — consultas leves, todas de uma vez.
let CONT = {};
async function contadores(){
  const ids = EMPS.map(e => e.id).concat(['00000000-0000-0000-0000-000000000000']);
  const semana = new Date(Date.now() - 7 * 864e5).toISOString(), mes = new Date(Date.now() - 30 * 864e5).toISOString();
  const revVig = ITS.filter(i => i.ativo).map(i => (vigDe(i) || {}).id).filter(Boolean);
  const [sol, cop, copObs, fic, ficAud, semTxt, leit] = await Promise.all([
    sb.from('grupo_it_solicitacao_auria').select('id', { count:'exact', head:true }).eq('grupo_id', GRUPO).in('situacao', ['aberta','em_analise']),
    sb.from('grupo_it_copia_auria').select('id', { count:'exact', head:true }).eq('grupo_id', GRUPO).is('obsoleta_em', null),
    sb.from('grupo_it_copia_auria').select('id', { count:'exact', head:true }).eq('grupo_id', GRUPO).not('obsoleta_em', 'is', null).is('recolhida_em', null).then(r => r.error ? sb.from('grupo_it_copia_auria').select('id', { count:'exact', head:true }).eq('grupo_id', GRUPO).not('obsoleta_em', 'is', null) : r),
    sb.from('fvs_inspecao_auria').select('id', { count:'exact', head:true }).in('empreendimento_id', ids).eq('tipo', 'fvs').in('situacao', ['aberta','em_verificacao','aguardando','reprovada']),
    sb.from('fvs_inspecao_auria').select('id', { count:'exact', head:true }).in('empreendimento_id', ids).eq('tipo', 'fvs').eq('situacao', 'aprovada').gte('aprovado_em', semana),
    revVig.length ? sb.from('grupo_it_revisao_auria').select('id,it_id,arquivo_path').in('id', revVig).or('texto_busca.is.null,texto_busca.eq.') : Promise.resolve({ data:[] }),
    revVig.length ? sb.from('grupo_it_visualizacao_auria').select('id', { count:'exact', head:true }).in('revisao_id', ITS.flatMap(i => (i.revs || []).map(r => r.id))).gte('em', mes) : Promise.resolve({ count:0 })]);
  const hoje30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  CONT = {
    sol: sol.count || 0, cop: cop.count || 0, copObs: copObs.count || 0, fic: fic.count || 0, ficAud: ficAud.count || 0,
    semTxt: semTxt.data || [], leit: leit.count || 0,
    venc: ITS.filter(i => i.ativo && i.validade && i.validade <= hoje30),
    ras: FVS.filter(m => m.ativo && m.rascunho).length, alerta: FVS.filter(m => m.ativo && fvsAlerta(m)).length,
    minVer: MINUTAS.filter(m => m.situacao === 'verificacao' && m.elaborado_por !== ME.id).length,
    minApr: MINUTAS.filter(m => m.situacao === 'aprovacao' && m.elaborado_por !== ME.id).length,
    minDev: MINUTAS.filter(m => m.situacao === 'devolvida' && m.elaborado_por === ME.id).length,
    ciePend: (await cienciaCarregar(true)).filter(x => !x.ciente_em).length
  };
  const n = (id, v, q) => { const el = $(id); el.textContent = v ? v : ''; el.style.display = v ? '' : 'none'; el.classList.toggle('q', !!q); };
  const fila = CONT.minVer + CONT.minApr + CONT.minDev + CONT.ras + CONT.alerta + CONT.sol + CONT.semTxt.length + CONT.copObs + CONT.ficAud + CONT.venc.length;
  n('nFazer', fila, true); n('nBib', ITS.filter(i => i.ativo).length); n('nFvs', CONT.ras + FVS.filter(m => m.ativo && !m.rascunho && m.revisar_it_rev).length, true);
  n('nFic', CONT.fic); n('nCop', CONT.cop); n('nSol', CONT.sol, true);
  if (TELA === 'fazer') telaFazer();
}

// ── Para fazer ──────────────────────────────────────────────────────────────
function telaFazer(){
  const C = CONT, carregando = C.ras === undefined;
  const ativos = FVS.filter(m => m.ativo), pub = ativos.filter(m => !m.rascunho).length;
  const linha = (num, tit, txt, acao, pri) => '<div class="it' + (pri && num ? ' pri' : '') + '"><div class="num' + (num ? '' : ' zero') + '">' + (carregando ? '…' : num) + '</div><div class="tx"><b>' + tit + '</b><span>' + txt + '</span></div>'
    + (num ? acao : '<span class="okd">em dia</span>') + '</div>';
  const etapas = {}; ativos.forEach(m => { const k = ['acabamento','fachada','outro'].includes(m.etapa) ? 'acab' : m.etapa; (etapas[k] = etapas[k] || []).push(m); });
  const ROT = Object.assign({}, ETAPA_ROT, { acab:'Acabamento / fachada' });
  const barra = l => { const t = l.length || 1, p = l.filter(m => !m.rascunho).length, a = l.filter(m => m.rascunho && fvsAlerta(m)).length, r = l.length - p - a;
    return '<div class="bar"><i style="width:' + (p / t * 100) + '%;background:var(--ok)"></i><i style="width:' + (a / t * 100) + '%;background:var(--accent)"></i><i style="width:' + (r / t * 100) + '%;background:#FDE7C0"></i></div>'; };
  const tipos = {}; ITS.filter(i => i.ativo).forEach(i => tipos[i.tipo || 'IT'] = (tipos[i.tipo || 'IT'] || 0) + 1);
  // atividade: revisões publicadas, modelos alterados e cópias — o que já está carregado
  const ev = [];
  ITS.forEach(i => (i.revs || []).forEach(r => ev.push({ em:r.publicado_em, c:'n', t:'<span class="cod">' + esc(i.codigo) + '</span> rev. ' + esc(r.revisao) + ' publicada', q:r.publicado_nome })));
  ativos.filter(m => m.atualizado_em).forEach(m => ev.push({ em:m.atualizado_em, c:m.rascunho ? 'a' : 'g', t:'<span class="cod">' + esc(m.codigo) + '</span> ' + (m.rascunho ? 'alterada (rascunho)' : 'publicada para as obras'), q:m.atualizado_nome }));
  ev.sort((a, b) => new Date(b.em) - new Date(a.em));
  // agrupa a carga em lote (muitas revisões no mesmo dia pela mesma pessoa) numa linha só
  const atv = []; ev.forEach(e => { const u = atv[atv.length - 1]; if (u && u.lote && dt(u.em) === dt(e.em) && u.q === e.q && e.c === 'n') u.n++; else atv.push(Object.assign({}, e, { lote:e.c === 'n', n:1 })); });
  $('corpo').innerHTML = '<section class="tela"><div class="thd"><div><h2>Para fazer</h2><p class="sub">O que depende da Qualidade hoje, do mais urgente para o menos. Cada linha abre a tela já filtrada.</p></div></div>'
    + '<div class="t1g"><div>'
    + '<div class="card fila"><div class="hd"><b>Fila de trabalho</b></div>'
    + linha((C.minVer || 0) + (C.minApr || 0), 'Revisões de documento para verificar ou aprovar', 'Elaboradas por outra pessoa da Qualidade. Ao aprovar, a revisão passa a valer para as obras.', '<button class="btn ac" onclick="BB.f=\'apr\';BB.sel=null;ir(\'biblioteca\')">Revisar agora</button>', true)
    + (C.minDev ? linha(C.minDev, 'Revisões suas devolvidas para correção', 'Veja o motivo no documento e envie a revisão corrigida.', '<button class="btn sec" onclick="BB.f=\'apr\';BB.sel=null;ir(\'biblioteca\')">Ver</button>', true) : '')
    + linha(C.ras, 'Modelos de FVS em rascunho — a obra ainda não vê', 'Extraídos das ITs e do sistema anterior. Conferir com a IT vigente e publicar.', '<button class="btn ac" onclick="CF.seg=\'ras\';ir(\'conferencia\')">Conferir agora</button>', true)
    + linha(C.alerta, 'Com alerta de validação', 'Tolerância divergente da IT, item duplicado, numeração trocada, critério faltando, IT revisada.', '<button class="btn sec" onclick="CF.seg=\'alerta\';ir(\'conferencia\')">Ver alertas</button>')
    + linha(C.sol, 'Solicitações de revisão abertas', 'Pedidos de obra ou setor para revisar uma norma.', '<button class="btn sec" onclick="abrirSolicitacoes()">Responder</button>', true)
    + linha((C.semTxt || []).length, 'Documento sem texto pesquisável', 'Não aparece na busca por conteúdo. O texto é lido uma vez só.', '<button class="btn sec" id="btIdx" onclick="indexarFaltantes()">Indexar</button>')

// Lê o texto do original (só quem mantém a biblioteca baixa o original) e indexa — uma vez.
async function indexarFaltantes(){
  const b = $('btIdx'); if (b){ b.disabled = true; b.textContent = 'Lendo…'; }
  let ok = 0, vazio = 0;
  for (const r of CONT.semTxt || []){
    try {
      const blob = await (await fetch(await r2Url('download', r.arquivo_path))).blob();
      const t = await AuriaIT.textoArquivo(new File([blob], r.arquivo_path.split('/').pop(), { type:blob.type }));
      await sb.rpc('it_indexar', { p_revisao:r.id, p_texto:t || ' ' });
      if ((t || '').trim()) ok++; else vazio++;
    } catch (e){ console.warn('indexar', e); }
  }
  if (vazio) alert(vazio + ' documento(s) sem texto legível (PDF escaneado). Eles não voltam para a fila.');
  contadores();
}

async function telaBiblioteca(soLista){

    grupo:[ 'Grupo', i => i.ativo && (i.familia || 'grupo') === 'grupo' ], victa:[ 'Victa', i => i.ativo && i.familia === 'victa' ] };
  const tipos = [...new Set(ITS.map(i => i.tipo || 'IT'))].sort((a, b) => ITS.filter(i => (i.tipo || 'IT') === b).length - ITS.filter(i => (i.tipo || 'IT') === a).length);
  tipos.forEach(t => F['t:' + t] = [ t, i => i.ativo && (i.tipo || 'IT') === t ]);

  } else BB.trechos = null;
  const lista = ITS.filter(i => F[BB.f][1](i) && (BB.trechos ? BB.trechos[i.id] !== undefined : (!ql || (i.codigo + ' ' + i.titulo + ' ' + (i.palavras || '')).toLowerCase().includes(ql))))
    .sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { numeric:true }));
  if (!BB.sel || !lista.find(i => i.id === BB.sel)) BB.sel = lista.length ? lista[0].id : null;
  const trecho = t => esc(t).replace(/«/g, '<mark>').replace(/»/g, '</mark>');
  const linhas = lista.length ? lista.map(i => { const v = vigDe(i);
      return '<div class="doc' + (i.id === BB.sel ? ' sel' : '') + (i.ativo ? '' : ' obs') + '" onclick="BB.sel=\'' + i.id + '\';telaBiblioteca()"><span class="cod">' + esc(i.codigo) + '</span><div class="t">' + esc(i.titulo)

        + (i.validade && i.validade <= hoje30 && i.ativo ? ' <span class="chip c-rev">validade ' + dt(i.validade + 'T12:00') + '</span>' : '')
        + (BB.trechos && BB.trechos[i.id] ? '<small>…' + trecho(BB.trechos[i.id]) + '…</small>' : '') + '</div>'
        + '<div class="r">' + (v ? esc(v.revisao) + '<small>' + new Date(v.publicado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + '</small>' : '—') + '</div></div>'; }).join('')
    : '<div class="vazio">' + (BB.trechos ? 'Nada encontrado dentro dos documentos.' : 'Nenhum documento neste filtro.') + '</div>';
  if (soLista && $('bibLs')){ $('bibLs').innerHTML = linhas; $('bibN').textContent = cabLista(lista.length, q); bibDetalhe(); return; }
  const tr = (k) => '<a class="' + (BB.f === k ? 'on' : '') + '" onclick="BB.f=\'' + k + '\';BB.sel=null;telaBiblioteca()">' + esc(F[k][0]) + '<span>' + ITS.filter(F[k][1]).length + '</span></a>';
  $('corpo').innerHTML = '<section class="tela"><div class="thd"><div><h2>Biblioteca normativa</h2><p class="sub">Lista mestra do grupo. Só a revisão vigente chega às obras; toda abertura sai carimbada (cópia não controlada).</p></div>'
    + '<button class="btn sec" onclick="listaMestra()">Lista mestra</button>'
    + (PODE.its ? '<button class="btn sec" onclick="itImportar()">Importar pasta</button><button class="btn" onclick="itForm()">＋ Documento</button>' : '') + '</div>'
    + '<div class="bib"><div class="trilho"><div class="g">TIPO</div>' + tr('todos') + tipos.map(t => tr('t:' + t)).join('')
    + '<div class="g" style="margin-top:8px">FAMÍLIA</div>' + tr('grupo') + tr('victa')

// Lista mestra: o que vale hoje, para imprimir/salvar em PDF pelo navegador.
function listaMestra(){
  const l = ITS.filter(i => i.ativo).sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { numeric:true }));

    + '<h1>Lista mestra de documentos — ' + esc($('hGrupo').textContent) + '</h1><p>' + l.length + ' documentos vigentes · emitida em ' + new Date().toLocaleString('pt-BR') + ' por ' + esc(ME.nome || ME.email) + '</p>'
    + '<table><tr><th>Código</th><th>Título</th><th>Família</th><th>Rev.</th><th>Publicada</th></tr>' + l.map(i => { const v = vigDe(i); return '<tr><td class="c">' + esc(i.codigo) + '</td><td>' + esc(i.titulo) + '</td><td>' + FAM_N[i.familia || 'grupo'] + '</td><td class="c">' + esc(v ? v.revisao : '—') + '</td><td>' + (v ? dt(v.publicado_em) : '') + '</td></tr>'; }).join('')
    + '</table><script>setTimeout(()=>print(),300)<\/script></body></html>');

function chipFvs(m){
  if (!m.ativo) return '<span class="chip c-mut">inativo</span>';
  if (m.revisar_it_rev) return '<span class="chip c-rev">revisar · IT rev. ' + esc(m.revisar_it_rev) + '</span>';
  if (m.validar_nota) return '<span class="chip c-val">validar</span>';

// ── F0: item da FVS → acende o trecho correspondente na IT ──────────────────
// Lê o texto do PDF (pdf.js), acha a sequência de linhas que mais cobre as
// palavras do item (+ critério/método) e marca esses retângulos. Procura
// primeiro nas páginas de referência do modelo; se não achar, no PDF todo.
const _pvTxt = {};   // cache: revId:n → itens de texto
function _pvNorm(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
const _PV_VAZIAS = new Set('para com sem que dos das nos nas uma por pelo pela entre sobre deve devem estar esta este caso conforme todo toda todos todas apos antes ser ter'.split(' '));
function _pvTokens(t){ return [...new Set(_pvNorm(t).split(' ').filter(w => w.length > 2 && !_PV_VAZIAS.has(w)))]; }
async function _pvTexto(n){
  const k = PV.revId + ':' + n; if (_pvTxt[k]) return _pvTxt[k];
  const pg = await PV.doc.getPage(n), tc = await pg.getTextContent();
  return (_pvTxt[k] = tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s:it.str, w:new Set(_pvNorm(it.str).split(' ')), x:it.transform[4], y:it.transform[5], wd:it.width, h:it.height || Math.abs(it.transform[3]) })));
}
async function pvAcender(i){
  document.querySelectorAll('#cfItens .itc').forEach((c, j) => c.classList.toggle('foco', j === i));
  if (!PV.doc) return;
  cfLerItens(); const t = _CF_IT[i]; if (!t) return;
  const alvo = _pvTokens(t.item), extra = _pvTokens([t.criterio, t.metodo, t.tolerancia].join(' '));
  if (!alvo.length && !extra.length) return;
  const peso = new Map(); extra.forEach(w => peso.set(w, 1)); alvo.forEach(w => peso.set(w, 3));   // o "o que verificar" pesa mais
  const total = [...peso.values()].reduce((a, b) => a + b, 0);
  const ordem = PV.paginas.concat([...Array(PV.doc.numPages).keys()].map(k => k + 1).filter(n => !PV.paginas.includes(n)));
  let best = null;
  for (const n of ordem){
    const its = await _pvTexto(n);
    for (let a = 0; a < its.length; a++){
      const vistos = new Set(); let sc = 0;
      for (let b = a; b < Math.min(its.length, a + 8); b++){
        its[b].w.forEach(w => { if (peso.has(w) && !vistos.has(w)){ vistos.add(w); sc += peso.get(w); } });
        const nota = sc / total - (b - a) * 0.015;   // janela curta vence a longa com a mesma cobertura
        if (!best || nota > best.nota) best = { nota, n, a, b };
      }
    }
    if (best && best.nota >= 0.6 && PV.paginas.includes(n)) break;   // achou bem na página de referência
  }

  if (!best || best.nota < 0.3){ PV.hl = null; pvHlDesenhar(false); if (tb) tb.textContent = 'trecho não encontrado'; return; }
  const its = await _pvTexto(best.n);
  PV.hl = { n:best.n, r:its.slice(best.a, best.b + 1).filter(it => [...it.w].some(w => peso.has(w)) || best.b - best.a < 3) };
  pvHlDesenhar(true);
}
async function pvHlDesenhar(rolar){
  const pc = $('pdfC'); if (!pc) return;

  if (!PV.hl || !PV.doc) return;
  const div = pc.querySelector('.pg[data-n="' + PV.hl.n + '"]'); if (!div) return;
  const vp = (await PV.doc.getPage(PV.hl.n)).getViewport({ scale:PV.escala });
  let topo = Infinity;
  PV.hl.r.forEach(it => {
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle([it.x, it.y - it.h * 0.25, it.x + it.wd, it.y + it.h]);
    const e = document.createElement('div'); e.className = 'hl';
    const l = Math.min(x1, x2), tp = Math.min(y1, y2);

    div.appendChild(e); topo = Math.min(topo, tp);

async function pvPagina(div, job){

  const todas = data || [];
  if (!FI.emp){ const c = {}; todas.forEach(f => c[f.empreendimento_id] = (c[f.empreendimento_id] || 0) + 1); FI.emp = (Object.keys(c).sort((a, b) => c[b] - c[a])[0]) || (EMPS[0] || {}).id || ''; }
  const p = FI.emp ? await sb.from('cde_pavimento_auria').select('id,codigo,nome,ordem,tipo').eq('empreendimento_id', FI.emp).eq('ativo', true).order('ordem', { ascending:false }) : { data:[] };
  PAVS = p.data || [];
  const etapaDe = f => ((FVS.find(m => m.id === f.modelo_id) || {}).etapa) || '';
  const daObra = todas.filter(f => f.empreendimento_id === FI.emp && (!FI.etapa || etapaDe(f) === FI.etapa));
  FICHAS = daObra;
  const nSit = k => daObra.filter(f => f.situacao === k).length;
  const lista = daObra.filter(f => !FI.sit || f.situacao === FI.sit);
  const cols = [...new Set(lista.map(f => f.modelo_codigo))].sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric:true }));
  const servDe = c => { const f = lista.find(x => x.modelo_codigo === c); return f ? f.servico : ''; };
  const pavsUsados = PAVS.filter(pv => lista.some(f => f.pavimento_id === pv.id) || PAVS.length <= 30);
  const semPav = lista.filter(f => !f.pavimento_id || !PAVS.find(pv => pv.id === f.pavimento_id));
  const pior = l => ['reprovada','aguardando','em_verificacao','aberta','aprovada'].find(s => l.some(f => f.situacao === s));
  const cel = (pv, c) => { const l = lista.filter(f => f.pavimento_id === pv.id && f.modelo_codigo === c);
    if (!l.length) return '<td><span class="cl"></span></td>';
    const s = pior(l), f = l.find(x => x.situacao === s);
    return '<td><button class="cl ' + s + (f.id === FI.sel ? ' foc' : '') + '" data-id="' + f.id + '" title="' + esc(c + ' · ' + (pv.codigo || pv.nome) + ' · ' + SIT[s][0] + (l.length > 1 ? ' (' + l.length + ' fichas)' : '')) + '" onclick="fichaSel(\'' + f.id + '\')">' + (l.length > 1 ? l.length : '') + '</button></td>'; };
  $('corpo').innerHTML = '<section class="tela"><div class="thd"><div><h2>Fichas das obras</h2><p class="sub">Cada quadrado é uma FVS num pavimento — a cor é a pior situação ali. Clique para ver itens, fotos e histórico; aprovada pode ser contestada.</p></div></div>'
    + (error ? '<div class="alerta rev">' + esc(error.message) + '</div>' : '')
    + '<div class="row" style="margin-bottom:14px"><select style="width:auto;min-width:240px" onchange="FI.emp=this.value;FI.sel=null;telaFichas()">' + EMPS.map(e => '<option value="' + e.id + '"' + (e.id === FI.emp ? ' selected' : '') + '>' + esc(e.nome) + '</option>').join('') + '</select>'
    + '<select style="width:auto" onchange="FI.etapa=this.value;telaFichas()"><option value="">Todas as etapas</option>' + Object.keys(ETAPA_ROT).map(k => '<option value="' + k + '"' + (k === FI.etapa ? ' selected' : '') + '>' + ETAPA_ROT[k] + '</option>').join('') + '</select></div>'
    + '<div class="kp">' + ['aberta','em_verificacao','aguardando','reprovada','aprovada'].map(k => '<button class="' + (FI.sit === k ? 'on' : '') + '" style="border-top-color:' + SIT[k][1] + '" onclick="FI.sit=FI.sit===\'' + k + '\'?\'\':\'' + k + '\';telaFichas()"><b style="color:' + (k === 'aberta' || k === 'em_verificacao' ? 'var(--txt)' : SIT[k][1]) + '">' + nSit(k) + '</b><span>' + SIT[k][0].toLowerCase() + '</span></button>').join('') + '</div>'
    + '<div class="t4g"><div class="card">'
    + (cols.length && pavsUsados.length ? '<div class="mx"><table><tr><th></th>' + cols.map(c => '<th class="v" title="' + esc(servDe(c)) + '">' + esc(c) + ' · ' + esc((servDe(c) || '').slice(0, 16)) + '</th>').join('') + '</tr>'
        + pavsUsados.map(pv => '<tr><td class="pv">' + esc(pv.codigo || pv.nome) + '</td>' + cols.map(c => cel(pv, c)).join('') + '</tr>').join('') + '</table>'
        + '<div class="leg" style="margin-top:12px">' + Object.keys(SIT).map(k => '<span><i style="background:' + SIT[k][1] + '"></i>' + SIT[k][0].toLowerCase() + '</span>').join('') + '</div></div>'
      : '<div class="vazio">' + (daObra.length ? 'Nenhuma ficha neste filtro.' : 'Nenhuma ficha aberta ainda nesta obra. Elas aparecem aqui quando a obra abrir a primeira FVS no App Obra.') + '</div>')
    + (semPav.length ? '<div style="border-top:1px solid var(--line)"><table><tr><th>Ficha</th><th>Serviço</th><th>Local</th><th>Situação</th></tr>' + semPav.map(f => '<tr style="cursor:pointer" onclick="fichaSel(\'' + f.id + '\')"><td class="cod">' + esc(f.codigo) + '</td><td>' + esc(f.servico) + '</td><td>' + esc(f.local_txt || '—') + '</td><td><span class="chip" style="background:' + SIT[f.situacao][1] + ';color:#fff">' + SIT[f.situacao][0] + '</span></td></tr>').join('') + '</table></div>' : '')
    + '</div><div class="card" id="ficDet"><div class="vazio">Selecione uma ficha.</div></div></div></section>';
  if (FI.sel && FICHAS.find(f => f.id === FI.sel)) fichaSel(FI.sel);
}
async function fichaSel(id){
  FI.sel = id;
  document.querySelectorAll('.cl.foc').forEach(c => c.classList.remove('foc'));
  const b = document.querySelector('.cl[data-id="' + id + '"]'); if (b) b.classList.add('foc');
  const f = FICHAS.find(x => x.id === id), el = $('ficDet'); if (!f || !el) return;
  const RES = { c:['C','var(--ok)','Conforme'], nc:['NC','#C0392B','Não conforme'], na:['NA','var(--mut)','Não se aplica'] };
  const pv = PAVS.find(p => p.id === f.pavimento_id);
  el.innerHTML = '<div class="fic"><span class="cod">' + esc(f.codigo) + '</span> <span class="chip" style="background:' + SIT[f.situacao][1] + ';color:#fff">' + SIT[f.situacao][0] + '</span>'
    + '<div style="font-weight:700;margin-top:3px">' + esc(f.servico) + ' · ' + esc([pv && (pv.codigo || pv.nome), f.local_txt].filter(Boolean).join(' › ')) + '</div>'
    + '<div class="hint">' + esc(f.modelo_codigo) + ' rev. ' + rev2(f.modelo_revisao) + ' · rodada ' + (f.rodada || 1) + '</div>'
    + (f.situacao === 'reprovada' && f.reprovado_motivo ? '<div class="alerta rev">' + esc(f.reprovado_motivo) + ' — ' + esc(f.reprovado_nome || '') + '</div>' : '')
    + '<div style="margin-top:10px">' + (f.itens || []).map((t, i) => '<div class="res"><span class="n">' + (i + 1) + '</span><span>' + esc(t.item) + (t.obs ? '<div class="hint">' + esc(t.obs) + '</div>' : '')
        + ((t.fotos || []).length ? '<div class="row" style="margin-top:4px">' + t.fotos.map(p => '<button class="btn sec sm" onclick="fichaFoto(\'' + esc(p.path) + '\')">Foto</button>').join('') + '</div>' : '') + '</span>'
        + (t.resultado ? '<b style="color:' + RES[t.resultado][1] + '" title="' + RES[t.resultado][2] + '">' + RES[t.resultado][0] + '</b>' : '<span class="hint">—</span>') + '</div>').join('') + '</div>'
    + '<div class="hist" id="ficHist"><div>Aberta · ' + dth(f.aberta_em) + ' · ' + esc(f.aberta_nome || '') + '</div></div>'
    + (f.situacao === 'aprovada' && PODE.qualidade ? '<div class="mono-t">CONTESTAR</div><textarea id="ctMot" rows="2" placeholder="O que foi encontrado (volta a reprovada e a obra refaz a inspeção)"></textarea><div class="row" style="margin-top:8px"><span class="msg" id="ctMsg" style="flex:1;margin:0"></span><button class="btn" id="ctOk" onclick="fichaContestar(\'' + id + '\')">Contestar</button></div>' : '')
    + '</div>';
  const EV = { enviada:'Enviada para aprovação', aprovada_1:'1ª aprovação', aprovada:'Aprovada', reprovada:'Reprovada', contestada:'Contestada pela Qualidade', reinspecao:'Reinspeção' };
  const { data:evs } = await sb.from('fvs_evento_auria').select('*').eq('inspecao_id', id).order('em', { ascending:false });
  const h = $('ficHist'); if (!h || FI.sel !== id) return;
  h.innerHTML = (evs || []).map(e => '<div class="' + (/aprovada/.test(e.tipo) ? 'a' : /reprovada|contestada/.test(e.tipo) ? 'r' : '') + '">' + esc(EV[e.tipo] || e.tipo) + ' · ' + dth(e.em) + ' · ' + esc(e.por_nome || '') + (e.observacao ? ' — ' + esc(e.observacao) : '') + '</div>').join('')
    + '<div>Aberta · ' + dth(f.aberta_em) + ' · ' + esc(f.aberta_nome || '') + '</div>';
}
async function fichaFoto(path){ try { window.open(await r2Url('download', path), '_blank'); } catch (e){ alert(e.message || e); } }
async function fichaContestar(id){
  const mot = ($('ctMot').value || '').trim(), m = $('ctMsg');
  if (mot.length < 5){ m.className = 'msg err'; m.textContent = 'Informe o motivo (mínimo 5 caracteres).'; return; }
  $('ctOk').disabled = true;
  const { error } = await sb.rpc('fvs_contestar', { p_id:id, p_motivo:mot });
  if (error){ $('ctOk').disabled = false; m.className = 'msg err'; m.textContent = error.message; return; }
  telaFichas(); contadores();
}

// ── Cópias controladas ──────────────────────────────────────────────────────
const CP = { so:'' };
async function telaCopias(){
  $('corpo').innerHTML = '<section class="tela"><div class="load">Carregando cópias…</div></section>';
  const { data, error } = await sb.from('grupo_it_copia_auria').select('id,numero,it_id,revisao_id,quantidade,emitido_em,obsoleta_em,avisado_em,recolhida_em,recolhida_destino,recolhida_nome,empreendimentos_auria(nome)').eq('grupo_id', GRUPO).order('emitido_em', { ascending:false });
  const l = (data || []).filter(c => !CP.so || (CP.so === 'obs' ? c.obsoleta_em && !c.recolhida_em : CP.so === 'rec' ? c.recolhida_em : !c.obsoleta_em));
  const revN = {}; ITS.forEach(i => (i.revs || []).forEach(r => revN[r.id] = r.revisao));
  $('corpo').innerHTML = '<section class="tela"><div class="thd"><div><h2>Cópias controladas</h2><p class="sub">Cada cópia tem número, obra, responsável e quantidade. Quando sai revisão nova, ela fica obsoleta e o responsável recebe e-mail.</p></div>'
    + '<div class="tgl">' + [['','Todas'], ['vig','Vigentes'], ['obs','A recolher'], ['rec','Recolhidas']].map(([k, t]) => '<button class="' + (CP.so === k ? 'on' : '') + '" onclick="CP.so=\'' + k + '\';telaCopias()">' + t + '</button>').join('') + '</div></div>'
    + (error ? '<div class="alerta rev">' + esc(error.message) + '</div>' : '')
    + '<div class="card">' + (l.length ? '<table><tr><th>Nº</th><th>Documento</th><th>Rev.</th><th>Obra</th><th>Emitida</th><th>Situação</th></tr>' + l.map(c => { const i = itDe(c.it_id) || { codigo:'?', titulo:'' };
        return '<tr' + (c.obsoleta_em ? ' style="opacity:.7"' : '') + '><td class="cod">' + c.numero + '</td><td><a style="cursor:pointer" onclick="BB.sel=\'' + c.it_id + '\';BB.aba=\'copias\';BB.f=\'todos\';ir(\'biblioteca\')"><span class="cod">' + esc(i.codigo) + '</span> ' + esc(i.titulo) + '</a></td>'
          + '<td class="cod">' + esc(revN[c.revisao_id] || '') + '</td><td>' + esc(c.empreendimentos_auria ? c.empreendimentos_auria.nome : '—') + '<div class="hint">' + c.quantidade + ' cópia(s)</div></td><td>' + dt(c.emitido_em) + '</td>'
          + '<td>' + copiaSit(c) + '</td></tr>'; }).join('') + '</table>'
      : '<div class="vazio">Nenhuma cópia controlada' + (CP.so ? ' neste filtro' : ' emitida ainda — emita pela Biblioteca, no botão “Cópia controlada”') + '.</div>') + '</div></section>';
}

// Situação da cópia controlada: vigente → obsoleta (a recolher) → recolhida/destruída.
function copiaSit(c){
  if (!c.obsoleta_em) return '<span class="chip c-pub">vigente</span>';
  if (c.recolhida_em) return '<span class="chip c-mut">' + (c.recolhida_destino === 'destruida' ? 'destruída' : 'recolhida') + '</span><div class="hint">' + dt(c.recolhida_em) + ' · ' + esc(c.recolhida_nome || '') + '</div>';
  return '<span class="chip c-rev">obsoleta · a recolher</span><div class="hint">desde ' + dt(c.obsoleta_em) + (c.avisado_em ? ' · avisado' : '') + '</div>'
    + (PODE.its ? '<button class="btn sec sm" style="margin-top:4px" onclick="copiaRecolher(\'' + c.id + '\',\'' + c.numero + '\')">Registrar recolhimento</button>' : '');
}
function copiaRecolhida(){ contadores(); if (TELA === 'copias') telaCopias(); else bibDetalhe(); }
// Ciência (F1): uma consulta por carga de tela, reaproveitada pela fila e pelo detalhe.
let _CIE = null, _CIEem = 0;
async function cienciaCarregar(forcar){
  if (!PODE.its) return [];
  if (!forcar && _CIE && Date.now() - _CIEem < 30000) return _CIE;
  const { data, error } = await sb.rpc('it_ciencia_painel', { p_grupo:GRUPO });
  _CIE = error ? [] : (data || []); _CIEem = Date.now(); return _CIE;
}

// ── busca do menu: FVS vai para os modelos; o resto, para a biblioteca ─────────
$('gBusca').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const q = ev.target.value.trim(); if (!q) return;
  if (/^fvs/i.test(q)){ CF.q = q; CF.seg = 'todas'; CF.sel = null; ir('conferencia'); }
  else { BB.q = q; BB.f = 'todos'; BB.sel = null; BB.cont = !ITS.some(i => (i.codigo + ' ' + i.titulo).toLowerCase().includes(q.toLowerCase())); ir('biblioteca'); }
  ev.target.blur();
});

boot().catch(e => { $('load').textContent = 'Erro ao carregar: ' + (e.message || e); });
</script>
