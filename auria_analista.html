<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Auria — Painel do Analista</title>
<link rel="icon" type="image/png" href="logo_symbol.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#EEF2F7;color:#1A2F4A;height:100vh;overflow:hidden}
/* Login */
#loginWrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A,#1E3A5F 60%,#1D4ED8)}
.login-box{background:#fff;border-radius:18px;padding:40px 38px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-box img{height:54px;display:block;margin:0 auto 10px}
.login-badge{text-align:center;font-size:10px;letter-spacing:1.5px;background:#0F172A;color:#fff;border-radius:5px;padding:4px 0;font-weight:700;margin-bottom:18px}
.login-box h2{font-size:18px;margin-bottom:4px}
.login-box .sub{font-size:13px;color:#64748B;margin-bottom:20px}
.login-box label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.login-box input{width:100%;padding:11px 13px;border:1.5px solid #E2E8F0;border-radius:9px;margin-bottom:14px;font-size:14px;outline:none}
.login-box input:focus{border-color:#3B82F6}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,#1D4ED8,#1E3A5F);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.login-err{background:#FEF2F2;color:#EF4444;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
/* App */
#app{display:none;height:100vh;grid-template-columns:240px 1fr;grid-template-rows:1fr}
.sidebar{background:#1A2F4A;display:flex;flex-direction:column}
.sb-head{padding:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #243f5e}
.sb-head .logo{width:30px;height:30px;object-fit:contain}
.sb-head h1{font-size:16px;font-weight:700;color:#fff}
.sb-head .role{font-size:10px;color:#7FB3D3;text-transform:uppercase;letter-spacing:.5px}
.nav{padding:14px 10px;flex:1}
.nav-sec{font-size:10px;color:#5A7A9A;text-transform:uppercase;letter-spacing:.8px;padding:10px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;cursor:pointer;font-size:14px;color:#C4D2E0;margin-bottom:3px}
.nav-item:hover{background:#223a57}
.nav-item.active{background:#1D4ED8;color:#fff;font-weight:600}
.sb-user{padding:14px 18px;border-top:1px solid #243f5e;font-size:12px;color:#9FB4CC}
.sb-user b{display:block;font-size:13px;color:#fff}
.sb-user a{color:#7FB3D3;font-size:12px;cursor:pointer;display:inline-block;margin-top:8px;text-decoration:none}
.main{overflow-y:auto;background:#EEF2F7}
.topbar{background:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:10}
.topbar h2{font-size:18px;color:#1A2F4A}.topbar .date{font-size:12px;color:#94A3B8}
.content{padding:24px 26px}
/* Cards empreendimentos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.emp-card{background:#fff;border:1px solid #E6EBF1;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 3px rgba(16,42,67,.06)}
.emp-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(16,42,67,.14)}
.emp-logo{height:96px;background:#F1F5FA;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #EEF2F6}
.emp-logo img{max-height:74px;max-width:80%;object-fit:contain}
.emp-logo .ph{font-size:36px;opacity:.3}
.emp-body{padding:14px 16px}
.emp-body h3{font-size:15px;margin-bottom:4px;color:#1A2F4A}
.emp-body .loc{font-size:12px;color:#64748B}
.emp-body .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;background:#EAF1F9;color:#1D4ED8;border-radius:20px;padding:3px 10px;font-weight:600}
.empty{text-align:center;color:#94A3B8;padding:60px 20px}
.empty .emoji{font-size:42px;opacity:.5;margin-bottom:10px}
.empty h3{color:#475569;margin-bottom:4px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #E6EBF1;border-left-width:4px;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(16,42,67,.05)}
.kpi .v{font-size:26px;font-weight:800}.kpi .l{font-size:11px;color:#64748B;margin-top:2px}
/* tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid #E2E8F0}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;color:#64748B;border-bottom:2px solid transparent}
.tab.active{color:#1A2F4A;border-bottom-color:#1D4ED8;font-weight:600}
.back{color:#1D4ED8;cursor:pointer;font-size:13px;margin-bottom:14px;display:inline-block;font-weight:600}
/* table */
.tbl-card{background:#fff;border:1px solid #E6EBF1;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,42,67,.05)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{text-align:left;padding:11px 14px;color:#64748B;background:#F8FAFC;border-bottom:1px solid #E6EBF1;font-weight:600;white-space:nowrap}
tbody td{padding:10px 14px;border-bottom:1px solid #F1F5F9;color:#33475B}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr:hover td{background:#F5F9FE}
.pill{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700}
.st-aberto{background:#FDECEA;color:#C0392B}
.st-resolvido{background:#E7F8EF;color:#1E8449}
.st-analise{background:#FEF5E7;color:#B9770E}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.atr{color:#C0392B;font-weight:600}
/* agenda */
.ag-day{background:#fff;border:1px solid #E6EBF1;border-radius:10px;padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,42,67,.05)}
.ag-day .d{font-size:13px;font-weight:700;color:#1A2F4A;margin-bottom:8px}
.ag-item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-top:1px solid #F1F5F9;color:#33475B}
.ag-item:first-of-type{border-top:none}
.ag-item .sub{color:#94A3B8}
/* kanban */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:#F1F5FA;border:1px solid #E6EBF1;border-radius:12px;min-width:240px;width:240px;flex-shrink:0}
.col h4{padding:11px 14px;font-size:12px;color:#fff;border-radius:12px 12px 0 0;display:flex;justify-content:space-between}
.c0{background:#5D6D7E}.c1{background:#2471A3}.c2{background:#7D3C98}.c3{background:#B9770E}.c4{background:#1E8449}
.col .body{padding:8px;min-height:60px}
.kc{background:#fff;border:1px solid #E6EBF1;border-radius:9px;padding:10px;margin-bottom:8px;border-left:3px solid #2471A3;box-shadow:0 1px 2px rgba(16,42,67,.05)}
.kc .t{font-size:13px;font-weight:600;margin-bottom:5px;color:#1A2F4A}
.kc .m{font-size:11px;color:#64748B}
.loading{color:#94A3B8;padding:30px;text-align:center}
/* modal detalhe apontamento */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal-ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:660px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal-h{padding:18px 22px;border-bottom:1px solid #E6EBF1;position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-h h3{font-size:16px;margin-bottom:6px;color:#1A2F4A}
.modal-h .meta{font-size:12px;color:#64748B;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.modal-x{background:transparent;border:none;color:#94A3B8;font-size:24px;cursor:pointer;line-height:1}
.modal-b{padding:18px 22px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#94A3B8;margin:18px 0 8px;font-weight:700}
.desc{font-size:13px;color:#33475B;line-height:1.55;white-space:pre-wrap}
.prints{display:flex;gap:10px;flex-wrap:wrap}
.prints a{display:block;border:1px solid #E6EBF1;border-radius:8px;overflow:hidden}
.prints img{height:110px;width:auto;display:block;object-fit:cover}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub .bh{font-size:10px;opacity:.75;margin-bottom:3px}
.bub.proj{align-self:flex-start;background:#EEF2F7;color:#1A2F4A;border-bottom-left-radius:3px}
.bub.anal{align-self:flex-end;background:#1D4ED8;color:#fff;border-bottom-right-radius:3px}
.bub.sug{align-self:flex-start;background:#FEF5E7;color:#7a5300;border:1px solid #E8960A;border-bottom-left-radius:3px}
.no-msg{color:#94A3B8;font-size:13px;font-style:italic;padding:6px 0}
.prints img{cursor:pointer;transition:transform .1s}
.prints img:hover{transform:scale(1.03)}
/* lightbox de print */
.lightbox{display:none;position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:400;flex-direction:column}
.lightbox.on{display:flex}
.lb-bar{padding:14px 20px}
.lb-back{background:rgba(255,255,255,.14);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.lb-back:hover{background:rgba(255,255,255,.26)}
.lb-img{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px 24px;overflow:auto}
.lb-img img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.55)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <img src="logo_full.png" alt="Auria">
    <div class="login-badge">PAINEL DO ANALISTA</div>
    <h2>Entrar na sua conta</h2>
    <div class="sub">Acesso para analistas de projetos</div>
    <div class="login-err" id="loginErr"></div>
    <label>E-mail</label>
    <input type="email" id="loginEmail" placeholder="voce@empresa.com">
    <label>Senha</label>
    <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sb-head">
      <img src="logo_symbol.png" class="logo" alt="Auria">
      <div><h1>Auria</h1><div class="role">Analista</div></div>
    </div>
    <nav class="nav">
      <div class="nav-sec">Trabalho</div>
      <div class="nav-item active" id="nav-emp" onclick="goPage('emp')">🏢 Meus Empreendimentos</div>
      <div class="nav-sec">Pessoal (todos os empreendimentos)</div>
      <div class="nav-item" id="nav-agenda" onclick="goPage('agenda')">📅 Agenda</div>
      <div class="nav-item" id="nav-kanban" onclick="goPage('kanban')">📋 Kanban</div>
    </nav>
    <div class="sb-user">
      <b id="uName">—</b><span id="uEmail">—</span>
      <a onclick="doLogout()">← Sair</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar"><h2 id="pageTitle">Meus Empreendimentos</h2><div class="date" id="hoje"></div></div>
    <div class="content" id="content"><div class="loading">Carregando…</div></div>
  </div>
</div>

<!-- Modal de detalhe do apontamento -->
<div class="modal-ov" id="aptModal" onclick="if(event.target===this)closeApt()">
  <div class="modal" id="aptModalBox"></div>
</div>

<!-- Visualizador de print (lightbox) -->
<div class="lightbox" id="imgLightbox">
  <div class="lb-bar"><button class="lb-back" onclick="fecharPrint()">← Voltar</button></div>
  <div class="lb-img" onclick="if(event.target===this)fecharPrint()"><img id="lbImg" src="" alt="print"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://sabzccokueowpromwxdg.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let USER=null, EMPS=[], PAGE='emp', APT_LIST=[], PRINTS=[];

function showErr(m){const e=document.getElementById('loginErr');e.textContent=m;e.style.display='block';}
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtBR(s){if(!s)return '';if(s.includes('/'))return s;const p=s.split('-');return p.length===3?p[2].slice(0,2)+'/'+p[1]+'/'+p[0]:s;}
function parseData(s){if(!s)return null;if(s.includes('/')){const p=s.split('/');return new Date(+p[2],+p[1]-1,+p[0]);}const p=s.split('-');return new Date(+p[0],+p[1]-1,+(p[2]||'1').slice(0,2));}
const stCls=s=>s==='Resolvido'?'st-resolvido':s==='Em análise'?'st-analise':'st-aberto';
const prioCor=p=>(p||'').includes('Severa')?'#E74C3C':(p||'').includes('Importante')?'#E67E22':'#F1C40F';

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  document.getElementById('loginErr').style.display='none';
  if(!email||!pass){showErr('Preencha e-mail e senha');return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showErr('E-mail ou senha incorretos.');return;}
  await afterLogin(data.user);
}

async function afterLogin(user){
  const {data:profile}=await sb.from('usuarios_auria').select('*').eq('id',user.id).single();
  if(!profile || !['analista','super_admin'].includes(profile.role)){
    showErr('Esta conta não tem acesso de analista.');
    await sb.auth.signOut(); return;
  }
  USER={...user,...profile};
  document.getElementById('uName').textContent=profile.nome||user.email;
  document.getElementById('uEmail').textContent=user.email;
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('hoje').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  await loadEmpreendimentos();
  goPage('emp');
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function loadEmpreendimentos(){
  EMPS=[];
  if(USER.role==='super_admin'){
    const {data}=await sb.from('empreendimentos_auria').select('*').is('deleted_at',null);
    EMPS=data||[];
  }else{
    const {data}=await sb.from('analista_empreendimento_auria')
      .select('ativo, empreendimentos_auria(*)')
      .eq('analista_id',USER.id).eq('ativo',true);
    EMPS=(data||[]).map(r=>r.empreendimentos_auria).filter(Boolean);
  }
}

function goPage(p){
  PAGE=p;
  ['emp','agenda','kanban'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',x===p));
  document.getElementById('pageTitle').textContent={emp:'Meus Empreendimentos',agenda:'Agenda',kanban:'Kanban'}[p];
  if(p==='emp')renderHome();
  else if(p==='agenda')renderAgenda();
  else if(p==='kanban')renderKanban();
}

function renderHome(){
  const c=document.getElementById('content');
  if(!EMPS.length){c.innerHTML='<div class="empty"><div class="emoji">🏗️</div><h3>Nenhum empreendimento atribuído</h3><p>Peça ao gestor para liberar seu acesso na Distribuição.</p></div>';return;}
  c.innerHTML='<div class="grid">'+EMPS.map(e=>{
    const logo=e.logo_url?`<img src="${esc(e.logo_url)}">`:'<div class="ph">🏢</div>';
    const loc=[e.cidade,e.estado].filter(Boolean).join(' / ');
    return `<div class="emp-card" onclick="openEmp('${e.id}')">
      <div class="emp-logo">${logo}</div>
      <div class="emp-body"><h3>${esc(e.nome)}</h3>
        <div class="loc">${esc(loc)||'—'}</div>
        <div class="tags"><span class="tag">${esc(e.tipo_empreendimento||'Projeto')}</span>${e.n_pavimentos?`<span class="tag">${e.n_pavimentos} pav.</span>`:''}</div>
      </div></div>`;
  }).join('')+'</div>';
}

async function openEmp(id){
  const emp=EMPS.find(e=>String(e.id)===String(id)); if(!emp)return;
  document.getElementById('pageTitle').textContent=emp.nome;
  const c=document.getElementById('content');
  c.innerHTML=`<span class="back" onclick="goPage('emp')">← Voltar aos empreendimentos</span>
    <div class="tabs">
      <div class="tab active" id="t-apt" onclick="empTab('apt')">📊 Apontamentos</div>
      <div class="tab" id="t-cro" onclick="empTab('cro')">🗓 Cronograma</div>
    </div>
    <div id="empView"><div class="loading">Carregando…</div></div>`;
  c.dataset.emp=emp.nome;
  empTab('apt');
}
function empTab(t){
  document.getElementById('t-apt').classList.toggle('active',t==='apt');
  document.getElementById('t-cro').classList.toggle('active',t==='cro');
  const emp=document.getElementById('content').dataset.emp;
  if(t==='apt')loadApontamentos(emp); else loadCronograma(emp);
}

async function loadApontamentos(empNome){
  const v=document.getElementById('empView'); v.innerHTML='<div class="loading">Carregando apontamentos…</div>';
  const {data,error}=await sb.from('apontamentos').select('*').eq('empreendimento',empNome);
  if(error){v.innerHTML='<div class="empty">Erro ao carregar apontamentos.</div>';return;}
  const iss=data||[];
  const aberto=iss.filter(i=>i.status==='Em aberto').length;
  const resolv=iss.filter(i=>i.status==='Resolvido').length;
  const atras=iss.filter(i=>i.atrasado).length;
  const analise=iss.filter(i=>i.status==='Em análise').length;
  const kp=(l,val,col)=>`<div class="kpi" style="border-left-color:${col}"><div class="v" style="color:${col}">${val}</div><div class="l">${l}</div></div>`;
  let html='<div class="kpis">'+kp('Total',iss.length,'#2980B9')+kp('Em aberto',aberto,'#E74C3C')+kp('Atrasados',atras,'#E67E22')+kp('Em análise',analise,'#F39C12')+kp('Resolvidos',resolv,'#27AE60')+'</div>';
  if(!iss.length){html+='<div class="empty"><div class="emoji">📋</div><p>Nenhum apontamento sincronizado para este empreendimento.</p></div>';v.innerHTML=html;return;}
  iss.sort((a,b)=>(b.atrasado?1:0)-(a.atrasado?1:0));
  APT_LIST=iss;
  html+='<div class="tbl-card"><table><thead><tr><th>ID</th><th>Título</th><th>Disciplina</th><th>Prioridade</th><th>Status</th><th>Prazo</th></tr></thead><tbody>';
  iss.forEach((i,idx)=>{
    html+=`<tr class="clickable" onclick="verApt(${idx})"><td>${esc(i.id)}</td><td>${esc(i.titulo||'—')}</td><td>${esc(i.disciplina||'—')}</td>
      <td><span class="dot" style="background:${prioCor(i.prioridade)}"></span>${esc((i.prioridade||'').replace(/^[^\w]+/,''))||'—'}</td>
      <td><span class="pill ${stCls(i.status)}">${esc(i.status||'—')}</span></td>
      <td class="${i.atrasado?'atr':''}">${fmtBR(i.prazo_min)||'—'}${i.atrasado?' ⚠':''}</td></tr>`;
  });
  html+='</tbody></table></div>';
  v.innerHTML=html;
}

async function loadCronograma(empNome){
  const v=document.getElementById('empView'); v.innerHTML='<div class="loading">Carregando cronograma…</div>';
  let data=null;
  try{ const r=await sb.from('cronogramas').select('*').eq('empreendimento',empNome).maybeSingle(); data=r.data; }catch(e){ data=null; }
  const tarefas=(data&&data.tarefas)?data.tarefas:[];
  if(!tarefas.length){
    v.innerHTML='<div class="empty"><div class="emoji">🗓</div><h3>Cronograma ainda não publicado na nuvem</h3><p>Importe o cronograma (MS Project) no app desktop e sincronize.<br>A visualização online aparecerá aqui.</p></div>';
    return;
  }
  let html='<div class="tbl-card"><table><thead><tr><th>WBS</th><th>Tarefa</th><th>Início</th><th>Fim</th><th>Avanço</th><th>Tipo</th></tr></thead><tbody>';
  tarefas.forEach(t=>{
    const tipo=t.marco?'Marco':(t.resumo?'Fase':'Tarefa');
    const ind=(t.nivel||0)*14;
    html+=`<tr><td>${esc(t.wbs||'')}</td><td><span style="padding-left:${ind}px;${t.resumo?'font-weight:700':''};${t.marco?'color:#B9770E':''}">${esc(t.nome)}</span></td>
      <td>${fmtBR(t.inicio)}</td><td>${fmtBR(t.fim)}</td><td>${t.marco?'—':(t.pct||0)+'%'}</td><td>${tipo}</td></tr>`;
  });
  html+='</tbody></table></div>';
  v.innerHTML=html;
}

async function renderAgenda(){
  const c=document.getElementById('content'); c.innerHTML='<div class="loading">Montando agenda…</div>';
  const nomes=EMPS.map(e=>e.nome);
  let apt=[],tar=[];
  if(nomes.length){ const r=await sb.from('apontamentos').select('id,titulo,empreendimento,prazo_min,status,atrasado').in('empreendimento',nomes); apt=r.data||[]; }
  const rt=await sb.from('tarefas').select('*').eq('analista_id',USER.id); tar=rt.data||[];
  const byDate={};
  apt.forEach(i=>{ if(i.prazo_min && i.status!=='Resolvido'){ const k=fmtBR(i.prazo_min); (byDate[k]=byDate[k]||[]).push({tipo:'apontamento',titulo:i.titulo,sub:i.empreendimento,atr:i.atrasado}); }});
  tar.forEach(t=>{ if(t.prazo && t.status!=='Concluído'){ const k=fmtBR(t.prazo); (byDate[k]=byDate[k]||[]).push({tipo:'tarefa',titulo:t.titulo,sub:(t.empreendimento||'Kanban')}); }});
  const keys=Object.keys(byDate).sort((a,b)=>parseData(a)-parseData(b));
  if(!keys.length){c.innerHTML='<div class="empty"><div class="emoji">📅</div><h3>Nenhum prazo pendente</h3><p>Prazos de apontamentos e tarefas de todos os seus empreendimentos aparecem aqui.</p></div>';return;}
  const hoje=new Date();hoje.setHours(0,0,0,0);
  let html='';
  keys.forEach(k=>{
    const venc=parseData(k)<hoje;
    html+=`<div class="ag-day"><div class="d">${k}${venc?' <span class="atr">(vencido)</span>':''}</div>`;
    byDate[k].forEach(it=>{
      html+=`<div class="ag-item">${it.tipo==='apontamento'?'📌':'📋'} <b>${esc(it.titulo||'—')}</b> <span class="sub">· ${esc(it.sub||'')}</span>${it.atr?' <span class="atr">⚠ atrasado</span>':''}</div>`;
    });
    html+='</div>';
  });
  c.innerHTML=html;
}

async function renderKanban(){
  const c=document.getElementById('content'); c.innerHTML='<div class="loading">Carregando Kanban…</div>';
  const {data}=await sb.from('tarefas').select('*').eq('analista_id',USER.id).order('criado_em',{ascending:false});
  const tar=data||[];
  const COLS=[['A fazer','c0'],['Em andamento','c1'],['Em revisão','c2'],['Pendente','c3'],['Concluído','c4']];
  if(!tar.length){c.innerHTML='<div class="empty"><div class="emoji">📋</div><h3>Sem tarefas</h3><p>Suas tarefas de todos os empreendimentos aparecem aqui.</p></div>';return;}
  let html='<div class="board">';
  COLS.forEach(([st,cls])=>{
    const cards=tar.filter(t=>(t.status||'A fazer')===st);
    html+=`<div class="col"><h4 class="${cls}"><span>${st}</span><span>${cards.length}</span></h4><div class="body">`;
    cards.forEach(t=>{ html+=`<div class="kc"><div class="t">${esc(t.titulo||'Tarefa')}</div><div class="m">${esc(t.empreendimento||'')}${t.prazo?' · 📅 '+fmtBR(t.prazo):''}</div></div>`; });
    html+='</div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

function verApt(idx){
  const i=APT_LIST[idx]; if(!i)return;
  const msgs=Array.isArray(i.mensagens)?i.mensagens:[];
  let chat;
  if(msgs.length){
    chat='<div class="chat">'+msgs.map(m=>{
      const lado=(m.de==='projetista')?'proj':(m.tipo==='sugestao_prazo'?'sug':'anal');
      const quem=esc(m.nome||m.email||(m.de==='projetista'?'Projetista':'Analista'));
      let extra='';
      if(m.tipo==='sugestao_prazo'&&m.prazo_sugerido) extra=`<div style="margin-top:5px;font-weight:700">📅 Prazo sugerido: ${esc(m.prazo_sugerido)}</div>`;
      return `<div class="bub ${lado}"><div class="bh">[${esc(m.data||'')}] ${quem}</div>${esc(m.texto||'')}${extra}</div>`;
    }).join('')+'</div>';
  }else{ chat='<div class="no-msg">Nenhuma mensagem trocada com o projetista ainda.</div>'; }
  // Prints / anexos
  const imgs=Array.isArray(i.imagens_json)?i.imagens_json:[];
  PRINTS=imgs;
  let prints='';
  if(imgs.length){
    prints='<div class="sec-t">Prints / Anexos</div><div class="prints">'+imgs.map((u,k)=>`<img src="${esc(u)}" alt="print" onclick="abrirPrint(${k})">`).join('')+'</div>';
  }
  const prazo=i.atrasado?`<span class="atr">${fmtBR(i.prazo_min)||'—'} ⚠</span>`:(fmtBR(i.prazo_min)||'—');
  document.getElementById('aptModalBox').innerHTML=`
    <div class="modal-h">
      <div>
        <h3>${esc(i.id)} — ${esc(i.titulo||'Sem título')}</h3>
        <div class="meta">
          <span class="pill ${stCls(i.status)}">${esc(i.status||'')}</span>
          <span><span class="dot" style="background:${prioCor(i.prioridade)}"></span>${esc((i.prioridade||'').replace(/^[^\w]+/,''))||'—'}</span>
          <span>· ${esc(i.disciplina||'—')}</span>
          <span>· Prazo: ${prazo}</span>
        </div>
      </div>
      <button class="modal-x" onclick="closeApt()">×</button>
    </div>
    <div class="modal-b">
      ${i.descricao?`<div class="sec-t">Descrição</div><div class="desc">${esc(i.descricao)}</div>`:''}
      ${prints}
      <div class="sec-t">Conversa com o projetista</div>
      ${chat}
    </div>`;
  document.getElementById('aptModal').classList.add('on');
}
function closeApt(){document.getElementById('aptModal').classList.remove('on');}
function abrirPrint(idx){const u=PRINTS[idx];if(!u)return;document.getElementById('lbImg').src=u;document.getElementById('imgLightbox').classList.add('on');}
function fecharPrint(){document.getElementById('imgLightbox').classList.remove('on');}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.getElementById('imgLightbox').classList.contains('on')) fecharPrint();
  else closeApt();
});

(async()=>{ const {data}=await sb.auth.getSession(); if(data&&data.session){ await afterLogin(data.session.user); } })();
</script>
