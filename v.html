<style>

  #top .info{ min-width:0; }
  #top .cod{ font-size:14px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #msg .big{ font-size:40px; }
  #msg .spin{ width:68px; height:68px; object-fit:contain; animation:auGira 1s linear infinite; }

  #msg.hide{ display:none; }
  #card{ position:absolute; left:50%; bottom:66px; transform:translateX(-50%); z-index:25; width:min(92vw,380px); background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.5); display:none; }
  #card .ch{ display:flex; align-items:center; gap:8px; padding:9px 11px; border-bottom:1px solid var(--line); }

  #card .cdesc{ color:var(--mut); white-space:pre-wrap; }

  @media (max-width:520px){ #top img{ height:28px; } #top .cod{ font-size:13px; } }

<script>

const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE';

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function msg(html){ const m=$('msg'); m.classList.remove('hide'); m.innerHTML=html; }

const CORPRIO = { 'Alta':'#ef4444','Média':'#f59e0b','Media':'#f59e0b','Baixa':'#22c55e' };
function corPrio(p){ return CORPRIO[p] || '#38bdf8'; }
function pinSvg(num,cor){ return '<svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 37C15 37 28 22 28 13.5A13 13 0 1 0 2 13.5C2 22 15 37 15 37Z" fill="'+cor+'" stroke="#fff" stroke-width="1.5"/><text x="15" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">'+esc(num)+'</text></svg>'; }

// ════════════════════════════════════════════════════════════════════════════
//  Renderizador de PDF — PORTADO do CDE (cde_obra.html): bitmap base numa única
//  rasterização adaptativa + detalhe em LADRILHOS quantizados no zoom; pan/zoom
//  são só transform CSS (sem re-render = sem piscar/sumir). Sem o modo de
//  comparação nem o cache em IndexedDB (o QR não precisa). Mesma nitidez/fluidez.
// ════════════════════════════════════════════════════════════════════════════
const BASE_FOLGA = 7, DET_SS = 1.5, TILE_PX = 512, TILE_MAX = 90;
const V = { doc:null, page:null, pageNum:1, nPages:1, zoom:1, panX:0, panY:0,
            _renderJob:0, _renderTask:null, _detTimer:null, _rafId:null, _panPend:null, _fitted:false, _baseTimer:null };
const B = { scale:1, pw:0, ph:0, valido:false };
const T = { mapa:new Map(), nivel:null, escala:1, tam:0 };
let BBOX = null, APTS = [], DADOS = null;
const stage = $('stage'), cvBase = $('pdfCv'), tilesEl = $('tiles'), pinsEl = $('pins');

async function computeContentBBoxPx(page){
  const ALVO_PX=900, vp0=page.getViewport({scale:1});
  const s=ALVO_PX/Math.max(vp0.width,vp0.height), vp=page.getViewport({scale:s});
  const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.ceil(vp.width)); cv.height=Math.max(1,Math.ceil(vp.height));
  const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  try{ await page.render({canvasContext:ctx,viewport:vp,background:'#fff'}).promise; }catch(e){ return null; }
  let img; try{ img=ctx.getImageData(0,0,cv.width,cv.height).data; }catch(e){ return null; }
  const W=cv.width,H=cv.height,TH=248; let minX=W,minY=H,maxX=-1,maxY=-1;
  for(let y=0;y<H;y++){ const rb=y*W*4; for(let x=0;x<W;x++){ const i=rb+x*4;
    if(img[i]<TH||img[i+1]<TH||img[i+2]<TH){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } } }
  if(maxX<0) return null;
  let left=minX/s,top=minY/s,w=(maxX-minX+1)/s,h=(maxY-minY+1)/s;
  const pad=Math.max(w,h)*0.02; left=Math.max(0,left-pad); top=Math.max(0,top-pad);
  w=Math.min(vp0.width-left,w+2*pad); h=Math.min(vp0.height-top,h+2*pad);
  return { left, top, w, h };
}
function dims(){ const vp=V.page.getViewport({scale:1}); return { pw:vp.width, ph:vp.height }; }
function cancelarRender(){ if(V._renderTask){ try{ V._renderTask.cancel(); }catch(_){} V._renderTask=null; } }
// No CELULAR o canvas tem limite bem menor de ÁREA/LADO — um bitmap grande demais
// renderiza só em pedaços ou sai branco. Reduzimos MAXPIX/lado/folga e capamos o
// dpr. Os TILES de detalhe (512px cada) continuam refinando ao ampliar.
const _MOVEL = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) < 820;
function baseScaleAlvo(){
  const {pw,ph}=dims(), cw=stage.clientWidth||1200, ch=stage.clientHeight||800, b=BBOX;
  const dpr=Math.min(window.devicePixelRatio||1, _MOVEL?2:3);
  const fitZoom=Math.min(cw/(b?b.w:pw), ch/(b?b.h:ph))*0.96;
  if(_MOVEL){
    // Mobile: base LEVE (carrega rápido; é a camada FLUIDA do zoom por CSS). A
    // nitidez de leitura vem da camada de DETALHE (detMobile), que renderiza só o
    // pedaço visível na resolução exata do zoom → cotas/textos pequenos legíveis.
    const teto=Math.min(Math.sqrt(9e6/(pw*ph)), 4096/pw, 4096/ph);
    const s=Math.min(fitZoom*dpr*2.5, teto);
    return { s: Math.max(s, Math.min(fitZoom*dpr, teto)), pw, ph };
  }
  const teto=Math.min(Math.sqrt(42e6/(pw*ph)), 16000/pw, 16000/ph);
  let s=Math.min(fitZoom*dpr*BASE_FOLGA, teto); s=Math.max(s, Math.min(fitZoom*dpr, teto));
  return { s, pw, ph };
}
// ── Camada de DETALHE (mobile): renderiza APENAS o pedaço visível na resolução
//  do zoom atual, num canvas do tamanho da tela (constante, rápido). Aparece
//  quando o movimento para; some enquanto arrasta/pinça (aí a base leve dá a
//  fluidez). É o que deixa os textos pequenos legíveis em qualquer zoom.
const DET_RDPR = Math.min(window.devicePixelRatio||1, 2);
const DET = { zoom:1, panX:0, panY:0, valido:false };   // vista da última renderização (cache)
// O detalhe ACOMPANHA o pan/zoom por CSS: enquanto não re-renderiza, o que já foi
// rasterizado continua nítido, só transladado/escalado — nada de voltar pro base
// borrado ao arrastar. Fórmula: pixel do detCv (renderizado p/ DET) → posição na
// vista atual. Só as bordas recém-reveladas ficam no base (soft) até o re-render.
function _detSeguir(){
  const cv=$('detCv'); if(!cv || !DET.valido || cv.style.display==='none') return;
  const k=V.zoom/DET.zoom, tx=k*DET.panX - V.panX, ty=k*DET.panY - V.panY;
  cv.style.transformOrigin='0 0';
  cv.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
}
async function detMobile(){
  if(!V.page || !B.valido || $('bim').style.display==='block') return;
  const cw=stage.clientWidth, ch=stage.clientHeight; if(cw<=0||ch<=0) return;
  const zoom0=V.zoom, panX0=V.panX, panY0=V.panY;   // congela a vista deste render
  const s=zoom0*DET_RDPR, W=Math.round(cw*DET_RDPR), H=Math.round(ch*DET_RDPR);
  const job=++V._renderJob; cancelarRender();
  // renderiza FORA da tela e troca de uma vez (sem piscar); o detCv atual segue
  // visível (transladado) até a troca.
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const vp=V.page.getViewport({ scale:s, offsetX:-panX0*DET_RDPR, offsetY:-panY0*DET_RDPR });
  const task=V.page.render({ canvasContext:off.getContext('2d'), viewport:vp });
  V._renderTask=task;
  try{ await task.promise; }catch(e){ if(!/cancel/i.test(String(e&&e.name||e))) console.warn('det:',e); return; }
  V._renderTask=null; if(job!==V._renderJob) return;
  const cv=$('detCv'); cv.width=W; cv.height=H; cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.getContext('2d').drawImage(off,0,0);
  DET.zoom=zoom0; DET.panX=panX0; DET.panY=panY0; DET.valido=true;
  cv.style.transform='none'; _detSeguir();   // alinha caso a vista tenha mudado durante o render
  cv.style.display='block';
}
// Ao mexer: o detalhe ACOMPANHA (segue nítido) e re-renderiza só quando parar.
function detAgendarMobile(){ _detSeguir(); clearTimeout(V._detTimer); V._detTimer=setTimeout(detMobile, 200); }
async function rasterizar(job, s, rx, ry, W, H, cv){
  cv.width=W; cv.height=H; const ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.save(); ctx.translate(-rx*s,-ry*s);
  const task=V.page.render({ canvasContext:ctx, viewport:V.page.getViewport({scale:s}), background:'#fff' });
  V._renderTask=task; try{ await task.promise; }catch(e){ if(!/cancel/i.test(String(e&&e.name||e))) console.warn('render:',e); }
  V._renderTask=null; ctx.restore(); return job===V._renderJob;
}
async function renderBase(scaleForcado){
  if(!V.page) return; const job=++V._renderJob; cancelarRender();
  try{
    const b=baseScaleAlvo(), pw=b.pw, ph=b.ph, s=(scaleForcado!=null?scaleForcado:b.s);
    const W=Math.max(1,Math.round(pw*s)), H=Math.max(1,Math.round(ph*s));
    const direto=!B.valido, cvA=direto?cvBase:document.createElement('canvas');
    const ok=await rasterizar(job,s,0,0,W,H,cvA); if(!ok||job!==V._renderJob) return;
    if(!direto){ cvBase.width=W; cvBase.height=H; cvBase.getContext('2d').drawImage(cvA,0,0); }
    cvBase.style.width=W+'px'; cvBase.style.height=H+'px';
    B.scale=s; B.pw=pw; B.ph=ph; B.valido=true; tilesLimpar(); updateCss();
  }catch(e){ if(!/cancel/i.test(String(e&&e.name||e))) console.error('base:',e); }
}
async function ajustarBBox(){ const page=V.page; try{ const bb=await computeContentBBoxPx(page); if(V.page===page) BBOX=bb; }catch(e){ BBOX=null; } }
function updateCss(){
  if(!B.valido) return;
  const k=V.zoom/B.scale, tr='translate('+(-V.panX)+'px,'+(-V.panY)+'px) scale('+k+')';
  cvBase.style.transform=tr;
  renderPins();
  if(_MOVEL) detAgendarMobile(); else { tilesPosicionar(); detAgendar(); }
}
// ── Detalhe em ladrilhos ──
function detEscalaAlvo(){ return V.zoom*(window.devicePixelRatio||1)*DET_SS; }
function detNivel(){ const a=detEscalaAlvo(); if(!(a>0)) return null; return Math.ceil(Math.log2(a)*2)/2; }
function detPrecisa(){ if(!B.valido||!V.page) return false; const r=detEscalaAlvo()/B.scale; return r>1.05||r<0.65; }
function tilesLimpar(){ T.mapa.forEach(t=>{ if(t.el&&t.el.parentNode) t.el.remove(); }); T.mapa.clear(); T.nivel=null; }
function tilesPosicionar(){ if(!B.valido) return; const k=V.zoom/B.scale; tilesEl.style.transform='translate('+(-V.panX)+'px,'+(-V.panY)+'px) scale('+k+')'; }
function tilesVisibilidade(nivel){ T.mapa.forEach(t=>{ t.el.style.display=(t.nivel===nivel)?'block':'none'; }); }
function detAgendar(){ if(_MOVEL) return; clearTimeout(V._detTimer); if(!detPrecisa()){ tilesVisibilidade(null); return; } const n=detNivel(); if(n!==T.nivel) tilesVisibilidade(n); V._detTimer=setTimeout(tilesGarantir,200); }
async function tilesGarantir(){
  if(!detPrecisa()||!B.valido) return; const cw=stage.clientWidth, ch=stage.clientHeight; if(cw<=0||ch<=0) return;
  const nivel=detNivel(); if(nivel==null) return; const s=Math.pow(2,nivel), tam=TILE_PX/s;
  T.nivel=nivel; T.escala=s; T.tam=tam; tilesVisibilidade(nivel);
  const z=V.zoom, x0=V.panX/z-tam/2, y0=V.panY/z-tam/2, x1=(V.panX+cw)/z+tam/2, y1=(V.panY+ch)/z+tam/2;
  const i0=Math.max(0,Math.floor(x0/tam)), i1=Math.floor(Math.min(B.pw,x1)/tam);
  const j0=Math.max(0,Math.floor(y0/tam)), j1=Math.floor(Math.min(B.ph,y1)/tam);
  const job=++V._renderJob; cancelarRender();
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    if(job!==V._renderJob) return;
    const chave=V.pageNum+'|'+nivel+'|'+i+'|'+j, achado=T.mapa.get(chave);
    if(achado){ T.mapa.delete(chave); T.mapa.set(chave,achado); continue; }
    const px=i*tam, py=j*tam, w=Math.min(tam,B.pw-px), h=Math.min(tam,B.ph-py); if(w<=0||h<=0) continue;
    const W=Math.max(1,Math.round(w*s)), H=Math.max(1,Math.round(h*s)), cvA=document.createElement('canvas');
    const ok=await rasterizar(job,s,px,py,W,H,cvA); if(!ok||job!==V._renderJob) return;
    cvA.style.left=(px*B.scale)+'px'; cvA.style.top=(py*B.scale)+'px'; cvA.style.width=(w*B.scale)+'px'; cvA.style.height=(h*B.scale)+'px';
    tilesEl.appendChild(cvA); T.mapa.set(chave,{ nivel, el:cvA }); tilesPodar();
  }
}
function tilesPodar(){ while(T.mapa.size>TILE_MAX){ const c=T.mapa.keys().next().value, t=T.mapa.get(c); if(t&&t.el) t.el.remove(); T.mapa.delete(c); } }
function revisarBase(){ if(!V.page||!B.valido) return; if(stage.clientWidth<=0||stage.clientHeight<=0) return; const {s}=baseScaleAlvo(); if(s>B.scale*1.25) renderBase(); }
function fitPage(){
  if(!V.page) return; const d=dims(), b=BBOX, left=b?b.left:0, top=b?b.top:0, pw=b?b.w:d.pw, ph=b?b.h:d.ph;
  const cw=stage.clientWidth, ch=stage.clientHeight; if(cw<=0||ch<=0) return; V._fitted=true;
  V.zoom=Math.min(cw/pw,ch/ph)*0.96; const contentW=pw*V.zoom, contentH=ph*V.zoom;
  V.panX=left*V.zoom-(cw-contentW)/2; V.panY=top*V.zoom-(ch-contentH)/2; updateCss();
}
function zoomAt(f, cx, cy){ const nv=Math.min(20,Math.max(0.05,V.zoom*f)), k=nv/V.zoom; V.panX=(V.panX+cx)*k-cx; V.panY=(V.panY+cy)*k-cy; V.zoom=nv; updateCss(); }
function renderPins(){
  pinsEl.innerHTML=''; if(!APTS.length||!V.page) return; const {pw,ph}=dims();
  APTS.forEach(a=>{ if(a.status==='Resolvido'||a.status==='Reprovado') return;
    (a.pontos_json||[]).forEach(pt=>{ if(!pt||pt.nx==null||pt.ny==null) return; if((pt.pg||1)!==V.pageNum) return;
      const x=pt.nx*pw*V.zoom-V.panX, y=pt.ny*ph*V.zoom-V.panY;
      if(x<-30||y<-40||x>stage.clientWidth+30||y>stage.clientHeight+10) return;
      const el=document.createElement('div'); el.className='pin'; el.style.left=x+'px'; el.style.top=y+'px';
      el.innerHTML=pinSvg(a.id_num,corPrio(a.prioridade)); el.onclick=(ev)=>{ ev.stopPropagation(); abrirCard(a); };
      pinsEl.appendChild(el);
    });
  });
}
function abrirCard(a){
  const cor=corPrio(a.prioridade);
  $('card').innerHTML='<div class="ch"><span class="cnum" style="color:'+cor+'">#'+esc(a.id_num)+'</span><span style="font-weight:700">'+esc(a.titulo||'Apontamento')+'</span><button class="cx" onclick="document.getElementById(\'card\').style.display=\'none\'">✕</button></div>'
    +'<div class="cb"><span class="cbadge" style="background:'+cor+';color:#fff">'+esc(a.prioridade||'—')+'</span><span class="cbadge" style="background:#334155;color:#fff">'+esc(a.status||'—')+'</span>'
    +(a.tipo?'<span class="cbadge" style="background:#1e3a5f;color:#fff">'+esc(a.tipo)+'</span>':'')+'<div class="cdesc">'+esc(a.descricao||'')+'</div></div>';
  $('card').style.display='block';
}

// ── Abrir PDF + gestos ──
async function abrirPdf(url, tem3D){
  try{
    V.doc=await pdfjsLib.getDocument({url}).promise; V.nPages=V.doc.numPages; V.pageNum=1;
    V.page=await V.doc.getPage(V.pageNum); B.valido=false; V._fitted=false; DET.valido=false; $('detCv').style.display='none';
    await ajustarBBox(); fitPage();
    await renderBase(); hideMsg(); montarTools(tem3D); gestos();
    if(_MOVEL) detMobile();
  }catch(e){ msg('<div class="big">⚠</div><div>Falha ao abrir o PDF.<br><small>'+esc((e&&e.message)||e)+'</small></div>'); }
}
async function irPagina(delta){
  const n=V.pageNum+delta; if(n<1||n>V.nPages) return; V.pageNum=n; $('card').style.display='none';
  V.page=await V.doc.getPage(V.pageNum); B.valido=false; V._fitted=false; DET.valido=false; $('detCv').style.display='none';
  await ajustarBBox(); fitPage();
  await renderBase(); if(_MOVEL) detMobile();
  atualizaPg();
}
function atualizaPg(){ const el=document.querySelector('#tools .pg'); if(el) el.textContent=V.nPages>1?(V.pageNum+' / '+V.nPages):''; }
let _GESTOS=false;
function gestos(){
  if(_GESTOS) return; _GESTOS=true;
  stage.addEventListener('wheel', e=>{ if($('bim').style.display==='block') return; e.preventDefault();
    const r=stage.getBoundingClientRect(); zoomAt(e.deltaY<0?1.15:1/1.15, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  stage.addEventListener('pointerdown', e=>{ if($('bim').style.display==='block'||V._pinch) return;
    if(e.target.closest && e.target.closest('.pin')) return;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    V._pan={ id:e.pointerId, x:e.clientX, y:e.clientY, px:V.panX, py:V.panY }; stage.classList.add('grab'); });
  stage.addEventListener('pointermove', e=>{ const d=V._pan; if(!d||e.pointerId!==d.id||V._pinch) return;
    V._panPend={ x:d.px-(e.clientX-d.x), y:d.py-(e.clientY-d.y) };
    if(V._rafId) return; V._rafId=requestAnimationFrame(()=>{ V._rafId=null; if(!V._panPend) return; V.panX=V._panPend.x; V.panY=V._panPend.y; updateCss(); }); });
  const end=e=>{ const d=V._pan; if(!d||(e&&e.pointerId!==d.id)) return; V._pan=null; stage.classList.remove('grab');
    if(V._rafId){ cancelAnimationFrame(V._rafId); V._rafId=null; } if(V._panPend){ V.panX=V._panPend.x; V.panY=V._panPend.y; V._panPend=null; updateCss(); } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  // pinça (2 dedos) — cancela o pan de 1 dedo enquanto amplia
  let pinch=null;
  stage.addEventListener('touchstart', e=>{ if(e.touches.length>=2){ V._pinch=true; V._pan=null; pinch=null; stage.classList.remove('grab'); } }, {passive:true});
  stage.addEventListener('touchmove', e=>{ if(e.touches.length!==2) return; e.preventDefault();
    const a=e.touches[0], b=e.touches[1], dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const r=stage.getBoundingClientRect(), cx=(a.clientX+b.clientX)/2-r.left, cy=(a.clientY+b.clientY)/2-r.top;
    if(pinch) zoomAt(dist/pinch, cx, cy); pinch=dist; }, {passive:false});
  stage.addEventListener('touchend', e=>{ if(e.touches.length<2){ pinch=null; V._pinch=false; } });
  if(window.ResizeObserver){ new ResizeObserver(()=>{ if(!V.page||$('bim').style.display==='block') return;
    if(stage.clientWidth<=0||stage.clientHeight<=0) return; if(!V._fitted){ fitPage(); return; }
    clearTimeout(V._baseTimer); V._baseTimer=setTimeout(revisarBase,250); updateCss(); }).observe(stage); }
}
function montarTools(tem3D){
  const t=$('tools'); t.style.display='flex';
  let h='<button onclick="zoomAt(1/1.25, stage.clientWidth/2, stage.clientHeight/2)">−</button>'
      +'<button onclick="zoomAt(1.25, stage.clientWidth/2, stage.clientHeight/2)">+</button>'
      +'<button onclick="fitPage()" title="Enquadrar">⤢</button>';
  if(V.nPages>1) h+='<div class="sep"></div><button onclick="irPagina(-1)">◀</button><div class="pg">'+V.pageNum+' / '+V.nPages+'</div><button onclick="irPagina(1)">▶</button>';
  if(tem3D) h+='<div class="sep"></div><button id="b2d" class="on" onclick="verModo(\'2d\')">2D</button><button id="b3d" onclick="verModo(\'3d\')">3D</button>';
  t.innerHTML=h;
}
async function verModo(m){
  const b2=$('b2d'), b3=$('b3d');
  if(m==='3d'){ cvBase.style.display='none'; $('detCv').style.display='none'; tilesEl.style.display='none'; pinsEl.style.display='none'; $('bim').style.display='block';
    if(b2) b2.classList.remove('on'); if(b3) b3.classList.add('on'); $('card').style.display='none';
    if(!V._3dReady){ V._3dReady=true; await abrir3D(DADOS.released.frag, true); } }
  else{ $('bim').style.display='none'; cvBase.style.display=''; tilesEl.style.display=''; pinsEl.style.display='';
    if(b3) b3.classList.remove('on'); if(b2) b2.classList.add('on'); if(_MOVEL) detMobile(); }
}

// ── 3D (reusa bim3d.js) — orbit/pan/zoom ──
let B3=null, F3D=null;
async function abrir3D(fragUrl, jaAberto){
  try{
    if(!jaAberto) carregando('Carregando modelo 3D…');
    if(!B3) B3=await import('./bim3d.js');
    if(!F3D) F3D=await B3.criar($('bim'), { fundo:0x20262f, on:{} });
    const nome=(DADOS&&DADOS.doc&&DADOS.doc.codigo)||'modelo';
    await B3.carregar(F3D, [{ nome, id:'qr', arquivoId:'qr', url:()=>fragUrl }], t=>{ if(!jaAberto) carregando(t); });
    $('bim').style.display='block';
    if(!jaAberto){ hideMsg(); cvBase.style.display='none'; tilesEl.style.display='none'; pinsEl.style.display='none'; $('tools').style.display='flex'; }
  }catch(e){ if(!jaAberto) msg('<div class="big">⚠</div><div>Falha ao abrir o 3D.<br><small>'+esc((e&&e.message)||e)+'</small></div>'); }
}

// ── Boot ──
function token(){ const u=new URLSearchParams(location.search); return (u.get('p')||u.get('token')||'').trim(); }
async function boot(){
  const t=token(); if(!t){ msg('<div class="big">🔗</div><div>Link inválido — sem código da prancha.</div>'); return; }
  let r;
  try{
    const resp=await fetch(SB_URL+'/functions/v1/qr-view', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON }, body:JSON.stringify({ token:t }) });
    r=await resp.json(); if(!resp.ok||r.error) throw new Error(r&&r.error||('HTTP '+resp.status));
  }catch(e){ msg('<div class="big">⚠</div><div>Não foi possível abrir a prancha.<br><small>'+esc((e&&e.message)||e)+'</small></div>'); return; }
  DADOS=r; $('tCod').textContent=r.doc.codigo||'—'; $('tSub').textContent=[r.doc.empreendimento,r.doc.disciplina].filter(Boolean).join(' · ');
  document.title='Auria — '+(r.doc.codigo||'prancha');
  if(!r.released){ msg('<div class="big">🔒</div><div><b>Nenhuma revisão liberada</b> para a obra ainda.<br>Contatar a coordenação de projeto.</div>'); return; }
  $('tRev').style.display=''; $('tRev').textContent='rev '+(r.released.revisao||'');
  if(r.hasNewerUnreleased) $('banner').style.display='block';
  APTS=r.apontamentos||[];
  if(r.released.pdf) await abrirPdf(r.released.pdf, !!r.released.frag);
  else if(r.released.frag) await abrir3D(r.released.frag);
  else msg('<div class="big">📄</div><div>Revisão liberada sem arquivo visualizável.</div>');
}
stage.addEventListener('pointerdown', ()=>{ if($('card').style.display==='block') $('card').style.display='none'; });
boot();
</script>
