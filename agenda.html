<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agenda do Analista</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#EEF2F7;color:#1E293B;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:linear-gradient(135deg,#4A90E2,#357ABD);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}.nav-btn:hover{background:rgba(255,255,255,.38)}
.day-lbl{font-size:14px;font-weight:700;min-width:180px;text-align:center}.spacer{flex:1}.analyst-tag{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px;font-size:12px}
.main{display:flex;flex:1;overflow:hidden}.day-view{flex:1;padding:18px 22px;overflow-y:auto}
.section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;margin:14px 0 8px}
.keep-box{background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:6px}
.keep-inp-row{display:flex;gap:8px;align-items:center}
.keep-inp{flex:1;border:1.5px solid #E2E8F0;border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;outline:none;color:#1E293B;background:#F8FAFC}
.keep-inp:focus{border-color:#4A90E2;background:#fff}
.keep-hora{width:82px;border:1.5px solid #E2E8F0;border-radius:8px;padding:5px 6px;font-size:12px;font-family:inherit;outline:none;color:#1E293B;background:#F8FAFC;flex-shrink:0}.keep-hora:focus{border-color:#4A90E2;background:#fff}
.keep-add{background:#4A90E2;color:#fff;border:none;border-radius:8px;width:30px;height:30px;font-size:20px;cursor:pointer;flex-shrink:0}.keep-add:hover{background:#357ABD}
.keep-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.keep-item{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px}.keep-item:hover{background:#F8FAFC}
.keep-cb{width:15px;height:15px;accent-color:#4A90E2;cursor:pointer;flex-shrink:0}
.keep-txt{flex:1;font-size:13px;color:#1E293B;cursor:pointer;user-select:none}
.keep-txt.done{text-decoration:line-through;color:#94A3B8}
.hora-tag{font-size:11px;font-weight:700;color:#4A90E2;background:#DBEAFE;border-radius:4px;padding:1px 5px;margin-right:2px}
.keep-del{background:none;border:none;color:#CBD5E1;font-size:15px;cursor:pointer;padding:0 2px;line-height:1}.keep-del:hover{color:#EF4444}
.emp-hdr{font-size:12px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:5px 12px;border-radius:6px;margin:10px 0 5px}
.disc-hdr{font-size:11px;font-weight:600;color:#15803D;padding:2px 8px;border-radius:4px;margin:5px 0 4px;display:inline-block;background:#F0FDF4}
.card{background:#fff;border-radius:10px;padding:10px 14px 8px;margin-bottom:7px;border-left:4px solid #CBD5E1;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.card.s-severa{border-left-color:#EF4444}.card.s-importante{border-left-color:#F97316}.card.s-observacao{border-left-color:#EAB308}.card.s-kanban{border-left-color:#4A90E2}
.card-id{font-size:11px;font-weight:800;color:#64748B}.card-prio{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;background:#F1F5F9;color:#64748B}
.card-title{font-size:13px;font-weight:700;color:#1E293B;line-height:1.3;margin:3px 0}
.card-sub{font-size:11px;color:#64748B;margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94A3B8;gap:10px;padding:48px 20px}.empty-txt{font-size:14px}
.cal-panel{width:268px;min-width:268px;background:#fff;border-left:1px solid #DDE4EE;padding:16px 14px;overflow-y:auto}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-month{font-size:13px;font-weight:700}.cal-nav{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 8px;border-radius:6px;color:#64748B}.cal-nav:hover{background:#F1F5F9}
.cal-sep{height:1px;background:#EEF2F7;margin:4px 0 8px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dn{text-align:center;font-size:10px;font-weight:700;color:#94A3B8;padding:4px 0}
.cal-d{text-align:center;padding:6px 2px;font-size:12px;border-radius:6px;cursor:pointer;position:relative;user-select:none}.cal-d:hover{background:#DBEAFE}
.cal-d.is-today{background:#4A90E2;color:#fff;font-weight:800}.cal-d.is-sel{background:#DBEAFE;color:#1D4ED8;font-weight:700}.cal-d.other-m{color:#CBD5E1}
.cal-d.has-ev::after{content:'';width:4px;height:4px;background:#4A90E2;border-radius:50%;position:absolute;bottom:2px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="hdr"><span style="font-size:15px;font-weight:700">Agenda do Analista</span>
<button class="nav-btn" onclick="mudarDia(-1)">&#9664;</button>
<span class="day-lbl" id="lblDia"></span>
<button class="nav-btn" onclick="mudarDia(1)">&#9654;</button>
<button class="nav-btn" onclick="irHoje()" style="font-size:11px;padding:5px 10px">Hoje</button>
<span class="spacer"></span><span class="analyst-tag" id="lblAnalista"></span></div>
<div class="main"><div class="day-view" id="dayView"><div class="empty"><div class="empty-txt">Carregando…</div></div></div>
<div class="cal-panel"><div class="cal-hdr"><button class="cal-nav" onclick="mudarMes(-1)">&#9664;</button><span class="cal-month" id="lblMes"></span><button class="cal-nav" onclick="mudarMes(1)">&#9654;</button></div><div class="cal-sep"></div><div class="cal-grid" id="calGrid"></div></div></div>
<script>
const SUPA_URL='https://sabzccokueowpromwxdg.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
var USER=null, EMP_NOMES=[], APT_DAY={}, TAR_DAY={};
var DIAS=['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
var DIASC=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
var MESES=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MESES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var diaAtual=new Date();diaAtual.setHours(0,0,0,0);
var calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);
var diasEvs=[];
function pad(n){return n<10?'0'+n:String(n);}
function fmtISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtBR(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// parse prazo (BR dd/mm/aaaa ou ISO) -> iso YYYY-MM-DD
function prazoISO(s){ if(!s)return null; s=String(s); var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(s); if(m)return m[3]+'-'+m[2]+'-'+m[1]; m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m)return m[1]+'-'+m[2]+'-'+m[3]; return null; }
function prioClass(p){ p=(p||'').toLowerCase(); if(p.indexOf('sever')>=0)return{c:'severa',l:'Severa'}; if(p.indexOf('import')>=0)return{c:'importante',l:'Importante'}; if(p.indexOf('observ')>=0)return{c:'observacao',l:'Observação'}; return{c:'nenhuma',l:''}; }

// ── Notas pessoais (localStorage por dia, como no desktop) ──────────────────
function notasKey(d){ return 'auria_agenda_notas_'+(USER?USER.id:'x')+'_'+d; }
function notasGet(d,cb){ try{ cb(JSON.parse(localStorage.getItem(notasKey(d))||'[]')); }catch(e){ cb([]); } }
function notasPost(d,arr,cb){ try{ localStorage.setItem(notasKey(d),JSON.stringify(arr)); }catch(e){} if(cb)cb(); }
function renderNotasArr(a){var el=document.getElementById('keepList');if(!el)return;if(!a||!a.length){el.innerHTML='';return;}var noTime=[],hasTime=[];for(var i=0;i<a.length;i++){if(a[i].hora)hasTime.push(a[i]);else noTime.push(a[i]);}hasTime.sort(function(x,y){return x.hora<y.hora?-1:x.hora>y.hora?1:0;});var sorted=noTime.concat(hasTime);var html='';for(var i=0;i<sorted.length;i++){var n=sorted[i];html+='<div class="keep-item"><input type="checkbox" class="keep-cb"'+(n.concluida?' checked':'')+' onchange="notaToggle('+n.id+')"><span class="keep-txt'+(n.concluida?' done':'')+'" onclick="notaToggle('+n.id+')">'+(n.hora?'<span class="hora-tag">'+esc(n.hora)+'</span> ':'')+esc(n.texto)+'</span><button class="keep-del" onclick="notaDel('+n.id+')">&#215;</button></div>';}el.innerHTML=html;}
function notaAdd(){var inp=document.getElementById('notaInp');var hora=document.getElementById('notaHora');var txt=(inp?(inp.value||''):'').trim();if(!txt)return;var d=fmtISO(diaAtual);notasGet(d,function(a){a.push({id:Date.now(),texto:txt,hora:(hora?(hora.value||''):''),concluida:false});notasPost(d,a,function(){if(inp)inp.value='';if(hora)hora.value='';renderNotasArr(a);carregarMes();});});}
function notaToggle(id){var d=fmtISO(diaAtual);notasGet(d,function(a){for(var i=0;i<a.length;i++){if(a[i].id===id){a[i].concluida=!a[i].concluida;break;}}notasPost(d,a,function(){renderNotasArr(a);});});}
function notaDel(id){var d=fmtISO(diaAtual);notasGet(d,function(a){a=a.filter(function(x){return x.id!==id;});notasPost(d,a,function(){renderNotasArr(a);carregarMes();});});}

function irHoje(){diaAtual=new Date();diaAtual.setHours(0,0,0,0);calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);carregarDia();carregarMes();}
function mudarDia(n){diaAtual=new Date(diaAtual);diaAtual.setDate(diaAtual.getDate()+n);if(diaAtual.getMonth()!==calBase.getMonth()||diaAtual.getFullYear()!==calBase.getFullYear()){calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);carregarMes();}else{renderCal();}carregarDia();}
function mudarMes(n){calBase=new Date(calBase.getFullYear(),calBase.getMonth()+n,1);carregarMes();}
function selDia(a,m,d){diaAtual=new Date(a,m,d);diaAtual.setHours(0,0,0,0);renderCal();carregarDia();}

function carregarDia(){
  var d=fmtISO(diaAtual);
  document.getElementById('lblDia').textContent=DIASC[diaAtual.getDay()]+' '+diaAtual.getDate()+' '+MESES3[diaAtual.getMonth()]+' '+diaAtual.getFullYear();
  notasGet(d,function(nt){ renderDia({issues:APT_DAY[d]||[]}, TAR_DAY[d]||[], nt); });
}
function renderDia(dados,kanban,notas){
  var iss=dados.issues||[];
  var agora=new Date();agora.setHours(0,0,0,0);
  var isHoje=diaAtual.getTime()===agora.getTime();
  var total=iss.length+(kanban?kanban.length:0);
  var html='<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #DDE4EE"><div style="font-size:22px;font-weight:800">'+DIAS[diaAtual.getDay()]+'</div><div style="font-size:13px;color:#64748B;margin-top:3px">'+fmtBR(diaAtual)+'</div>';
  if(total)html+='<span style="display:inline-block;background:#DBEAFE;color:#1D4ED8;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700;margin-top:6px">'+total+' item'+(total!==1?'s':'')+'</span>';
  html+='</div>';
  html+='<div class="section-lbl">Minhas Tarefas</div><div class="keep-box"><div class="keep-inp-row"><input id="notaHora" type="time" class="keep-hora"><input id="notaInp" class="keep-inp" placeholder="Adicionar tarefa..."><button class="keep-add" onclick="notaAdd()">+</button></div><div class="keep-list" id="keepList"></div></div>';
  if(iss.length){
    html+='<div class="section-lbl">Prazos de Apontamentos</div>';
    var empG={},empOrd=[];
    for(var i=0;i<iss.length;i++){var iv0=iss[i];var en0=iv0.empreendimento||'Projeto';if(!empG[en0]){empG[en0]={};empOrd.push(en0);}var dn0=iv0.disciplina||'Geral';if(!empG[en0][dn0])empG[en0][dn0]=[];empG[en0][dn0].push(iv0);}
    for(var e=0;e<empOrd.length;e++){
      var en=empOrd[e];var dg=empG[en];var dklist=Object.keys(dg);
      html+='<div class="emp-hdr">'+esc(en)+'</div>';
      for(var di=0;di<dklist.length;di++){
        var dn=dklist[di];var dc=dg[dn];
        if(dklist.length>1)html+='<div class="disc-hdr">'+esc(dn)+'</div>';
        for(var j=0;j<dc.length;j++){var iv=dc[j];var cls=iv.prioridade_class||'nenhuma';html+='<div class="card s-'+cls+'" onclick="abrirApt('+"'"+esc(iv.id)+"'"+',\''+esc(iv.empreendimento||'')+'\')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span class="card-id">'+esc(iv.id)+'</span>'+(iv.prioridade_label?'<span class="card-prio">'+esc(iv.prioridade_label)+'</span>':'')+'</div><div class="card-title">'+esc(iv.titulo||'Sem titulo')+'</div><div class="card-sub">'+esc(iv.disciplina||'')+(iv.prazo?' &bull; Prazo: '+esc(iv.prazo):'')+(iv.status?' &bull; '+esc(iv.status):'')+'</div></div>';}
      }
    }
  }
  if(kanban&&kanban.length){
    html+='<div class="section-lbl">Tarefas Kanban</div>';
    for(var k=0;k<kanban.length;k++){var tk=kanban[k];html+='<div class="card s-kanban"><div class="card-title">'+esc(tk.titulo||'Tarefa')+'</div><div class="card-sub">'+(tk.status?esc(tk.status):'')+(tk.prioridade?' &bull; '+esc(tk.prioridade):'')+'</div></div>';}
  }
  if(!iss.length&&(!kanban||!kanban.length)){html+='<div class="empty"><div class="empty-txt">'+(isHoje?'Nenhum prazo para hoje':'Nenhum apontamento neste dia')+'</div></div>';}
  document.getElementById('dayView').innerHTML=html;
  var inp=document.getElementById('notaInp');
  if(inp)inp.addEventListener('keydown',function(e){if(e.keyCode===13)notaAdd();});
  renderNotasArr(notas||[]);
}
// Clicar num apontamento avisa a estação (pai) para abrir a conversa/detalhe.
function abrirApt(id,emp){ try{ var alvo=(window.opener&&!window.opener.closed)?window.opener:((window.parent&&window.parent!==window)?window.parent:null); if(alvo) alvo.postMessage({tipo:'auria_abrir_apt',id:id,emp:emp},'*'); }catch(e){} }

function carregarMes(){
  var ano=calBase.getFullYear(),mes=calBase.getMonth();
  diasEvs=[];
  var pref=ano+'-'+pad(mes+1)+'-';
  var set={};
  Object.keys(APT_DAY).forEach(function(k){ if(k.indexOf(pref)===0 && APT_DAY[k].length) set[+k.slice(8,10)]=1; });
  Object.keys(TAR_DAY).forEach(function(k){ if(k.indexOf(pref)===0 && TAR_DAY[k].length) set[+k.slice(8,10)]=1; });
  // notas locais do mês
  for(var d=1;d<=31;d++){ var key=notasKey(pref+pad(d)); try{ var n=JSON.parse(localStorage.getItem(key)||'[]'); if(n.length) set[d]=1; }catch(e){} }
  diasEvs=Object.keys(set).map(Number);
  renderCal();
}
function renderCal(){var ano=calBase.getFullYear(),mes=calBase.getMonth();document.getElementById('lblMes').textContent=MESES[mes]+' '+ano;var grid=document.getElementById('calGrid');var html='';for(var i=0;i<7;i++)html+='<div class="cal-dn">'+DIASC[i][0]+'</div>';var agora=new Date();agora.setHours(0,0,0,0);var prim=new Date(ano,mes,1).getDay();var ult=new Date(ano,mes+1,0).getDate();var ultAnt=new Date(ano,mes,0).getDate();for(var i=prim-1;i>=0;i--){var d2=ultAnt-i;html+='<div class="cal-d other-m" onclick="selDia('+ano+','+(mes-1)+','+d2+')">'+d2+'</div>';}for(var d=1;d<=ult;d++){var dt=new Date(ano,mes,d);var cls='cal-d';if(dt.getTime()===agora.getTime())cls+=' is-today';if(dt.getTime()===diaAtual.getTime())cls+=' is-sel';if(diasEvs.indexOf(d)>=0)cls+=' has-ev';html+='<div class="'+cls+'" onclick="selDia('+ano+','+mes+','+d+')">'+d+'</div>';}var resto=(7-((prim+ult)%7))%7;for(var d3=1;d3<=resto;d3++)html+='<div class="cal-d other-m" onclick="selDia('+ano+','+(mes+1)+','+d3+')">'+d3+'</div>';grid.innerHTML=html;}

async function carregarDados(){
  // empreendimentos do analista
  try{
    if(USER.role==='super_admin'){ const {data}=await sb.from('empreendimentos_auria').select('nome').is('deleted_at',null); EMP_NOMES=(data||[]).map(e=>e.nome); }
    else{ const {data}=await sb.from('analista_empreendimento_auria').select('empreendimentos_auria(nome)').eq('analista_id',USER.id).eq('ativo',true); EMP_NOMES=(data||[]).map(r=>r.empreendimentos_auria&&r.empreendimentos_auria.nome).filter(Boolean); }
  }catch(e){ EMP_NOMES=[]; }
  APT_DAY={}; TAR_DAY={};
  if(EMP_NOMES.length){
    try{ const r=await sb.from('apontamentos').select('id,titulo,empreendimento,disciplina,prazo_min,status,prioridade,atrasado').in('empreendimento',EMP_NOMES);
      (r.data||[]).forEach(function(a){ if(a.status==='Resolvido')return; var iso=prazoISO(a.prazo_min); if(!iso)return; var pc=prioClass(a.prioridade);
        (APT_DAY[iso]=APT_DAY[iso]||[]).push({id:a.id,titulo:a.titulo,empreendimento:a.empreendimento,disciplina:a.disciplina,prazo:(function(){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];})(),status:a.status,prioridade_class:pc.c,prioridade_label:pc.l}); });
    }catch(e){}
  }
  try{ const rt=await sb.from('tarefas').select('*').eq('analista_id',USER.id);
    (rt.data||[]).forEach(function(t){ if(t.status==='Concluído')return; var iso=prazoISO(t.prazo); if(!iso)return; (TAR_DAY[iso]=TAR_DAY[iso]||[]).push({titulo:t.titulo,status:t.status,prioridade:t.prioridade}); });
  }catch(e){}
}
async function carregar(){
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){ document.getElementById('dayView').innerHTML='<div class="empty"><div class="empty-txt">Sessão expirada. Recarregue.</div></div>'; return; }
  USER=data.session.user;
  try{ const {data:p}=await sb.from('usuarios_auria').select('nome,role').eq('id',USER.id).single(); if(p){ USER.role=p.role; document.getElementById('lblAnalista').textContent=p.nome||USER.email; } }catch(e){}
  await carregarDados();
  // dia inicial: ?date=YYYY-MM-DD (vindo da estação) ou hoje
  var qd=new URLSearchParams(location.search).get('date');
  if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd)){ var p=qd.split('-'); diaAtual=new Date(+p[0],+p[1]-1,+p[2]); diaAtual.setHours(0,0,0,0); calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1); }
  carregarDia(); carregarMes();
}
document.addEventListener('DOMContentLoaded',carregar);
</script></body></html>
