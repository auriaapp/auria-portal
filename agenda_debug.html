<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#EEF2F7;color:#1E293B;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:linear-gradient(135deg,#4A90E2 0%,#357ABD 100%);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(67,130,210,.35);flex-shrink:0}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:.02em}
.nav-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s}
.nav-btn:hover{background:rgba(255,255,255,.38)}
.day-lbl{font-size:14px;font-weight:700;min-width:180px;text-align:center}
.spacer{flex:1}
.analyst-tag{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px;font-size:12px}
.main{display:flex;flex:1;overflow:hidden}
.day-view{flex:1;padding:18px 22px;overflow-y:auto}
.day-hero{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #DDE4EE}
.day-weekday{font-size:22px;font-weight:800;color:#1E293B;line-height:1.1}
.day-date-full{font-size:13px;color:#64748B;margin-top:3px}
.count-badge{display:inline-block;background:#DBEAFE;color:#1D4ED8;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700;margin-top:6px;margin-right:4px}
.section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;margin:16px 0 8px}
.keep-box{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:4px}
.keep-inp-row{display:flex;gap:8px;align-items:center}
.keep-inp{flex:1;border:1.5px solid #E2E8F0;border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;outline:none;color:#1E293B;background:#F8FAFC;transition:border .15s}
.keep-inp:focus{border-color:#4A90E2;background:#fff}
.keep-add{background:#4A90E2;color:#fff;border:none;border-radius:8px;width:32px;height:32px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.keep-add:hover{background:#357ABD}
.keep-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.keep-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;transition:background .1s}
.keep-item:hover{background:#F8FAFC}
.keep-cb{width:16px;height:16px;accent-color:#4A90E2;cursor:pointer;flex-shrink:0}
.keep-txt{flex:1;font-size:13px;color:#1E293B;cursor:pointer;user-select:none}
.keep-txt.done{text-decoration:line-through;color:#94A3B8}
.keep-del{background:none;border:none;color:#CBD5E1;font-size:16px;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s}
.keep-del:hover{color:#EF4444}
.grupo-hdr{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding-bottom:6px;border-bottom:1px solid #DDE4EE}
.g-emp{font-size:12px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:2px 10px;border-radius:8px}
.g-disc{font-size:12px;font-weight:700;color:#15803D;background:#F0FDF4;padding:2px 10px;border-radius:8px}
.g-count{font-size:11px;color:#94A3B8;margin-left:auto}
.card{background:#fff;border-radius:10px;padding:10px 14px 8px;margin-bottom:8px;border-left:4px solid #CBD5E1;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px)}
.card.s-severa{border-left-color:#EF4444}.card.s-importante{border-left-color:#F97316}
.card.s-observacao{border-left-color:#EAB308}.card.s-nenhuma{border-left-color:#94A3B8}
.card-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-code{font-size:11px;font-weight:800;color:#64748B;letter-spacing:.05em}
.prio-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.pb-severa{background:#FEE2E2;color:#DC2626}.pb-importante{background:#FFEDD5;color:#EA580C}
.pb-observacao{background:#FEF9C3;color:#CA8A04}.pb-nenhuma{background:#F1F5F9;color:#64748B}
.card-title{font-size:13px;font-weight:700;color:#1E293B;line-height:1.3;margin-bottom:3px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.tag-emp{font-size:11px;font-weight:600;color:#1D4ED8;background:#EFF6FF;padding:2px 8px;border-radius:6px}
.tag-disc{font-size:11px;font-weight:600;color:#15803D;background:#F0FDF4;padding:2px 8px;border-radius:6px}
.tag-prazo{font-size:11px;font-weight:600;color:#C2410C;background:#FFF7ED;padding:2px 8px;border-radius:6px}
.card-status{font-size:11px;color:#94A3B8;margin-top:4px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94A3B8;gap:10px;padding:48px 20px}
.empty-ico{font-size:44px}.empty-txt{font-size:14px}
.cal-panel{width:268px;min-width:268px;background:#fff;border-left:1px solid #DDE4EE;padding:16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between}
.cal-month{font-size:13px;font-weight:700;color:#1E293B}
.cal-nav{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 8px;border-radius:6px;color:#64748B;line-height:1}
.cal-nav:hover{background:#F1F5F9}
.cal-sep{height:1px;background:#EEF2F7;margin:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dn{text-align:center;font-size:10px;font-weight:700;color:#94A3B8;padding:4px 0}
.cal-d{text-align:center;padding:6px 2px;font-size:12px;border-radius:6px;cursor:pointer;position:relative;transition:background .1s;user-select:none}
.cal-d:hover{background:#DBEAFE}
.cal-d.is-today{background:#4A90E2;color:#fff;font-weight:800}
.cal-d.is-sel{background:#DBEAFE;color:#1D4ED8;font-weight:700;border:1px solid #93C5FD}
.cal-d.is-today.is-sel{background:#4A90E2;color:#fff;border-color:transparent}
.cal-d.has-ev::after{content:'';width:4px;height:4px;background:#4A90E2;border-radius:50%;position:absolute;bottom:2px;left:50%;transform:translateX(-50%)}
.cal-d.is-today::after,.cal-d.is-today.has-ev::after{background:rgba(255,255,255,.7)}
.cal-d.other-m{color:#CBD5E1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:10px}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-title">📅 Agenda do Analista</span>
  <button class="nav-btn" onclick="mudarDia(-1)">◀</button>
  <span class="day-lbl" id="lblDia"></span>
  <button class="nav-btn" onclick="mudarDia(1)">▶</button>
  <button class="nav-btn" onclick="irHoje()" style="font-size:11px;padding:5px 10px">Hoje</button>
  <span class="spacer"></span>
  <span class="analyst-tag" id="lblAnalista"></span>
</div>
<div class="main">
  <div class="day-view" id="dayView">
    <div class="empty"><div class="empty-ico">⌛</div></div>
  </div>
  <div class="cal-panel">
    <div class="cal-hdr">
      <button class="cal-nav" onclick="mudarMes(-1)">◀</button>
      <span class="cal-month" id="lblMes"></span>
      <button class="cal-nav" onclick="mudarMes(1)">▶</button>
    </div>
    <div class="cal-sep"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>
<script>
var DSF=['Domingo','Segunda-feira','Ter\u00e7a-feira','Quarta-feira','Quinta-feira','Sexta-feira','S\u00e1bado'];
var DSC=['Dom','Seg','Ter','Qua','Qui','Sex','S\u00e1b'];
var MESES=['Janeiro','Fevereiro','Mar\u00e7o','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MESES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var diaAtual=new Date();diaAtual.setHours(0,0,0,0);
var calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);
var diasEvs=new Set();
function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtBR(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function irHoje(){diaAtual=new Date();diaAtual.setHours(0,0,0,0);calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);carregarDia();carregarMes();}
function mudarDia(n){diaAtual=new Date(diaAtual);diaAtual.setDate(diaAtual.getDate()+n);if(diaAtual.getMonth()!==calBase.getMonth()||diaAtual.getFullYear()!==calBase.getFullYear()){calBase=new Date(diaAtual.getFullYear(),diaAtual.getMonth(),1);carregarMes();}else{renderCal();}carregarDia();}
function mudarMes(n){calBase=new Date(calBase.getFullYear(),calBase.getMonth()+n,1);carregarMes();}
function selecionarDia(a,m,d){diaAtual=new Date(a,m,d);diaAtual.setHours(0,0,0,0);renderCal();carregarDia();}
function notaKey(){return'ag_notas_'+fmtISO(diaAtual);}
function notasLoad(){try{return JSON.parse(localStorage.getItem(notaKey())||'[]');}catch(e){return[];}}
function notasSave(a){localStorage.setItem(notaKey(),JSON.stringify(a));}
function notaAdd(){var inp=document.getElementById('notaInp');var txt=(inp.value||'').trim();if(!txt)return;var a=notasLoad();a.push({id:Date.now(),texto:txt,concluida:false});notasSave(a);inp.value='';renderNotas(a);}
function notaToggle(id){var a=notasLoad();var n=a.find(function(x){return x.id===id;});if(n)n.concluida=!n.concluida;notasSave(a);renderNotas(a);}
function notaDel(id){var a=notasLoad().filter(function(x){return x.id!==id;});notasSave(a);renderNotas(a);}
function renderNotas(a){var el=document.getElementById('keepList');if(!el)return;if(!a||!a.length){el.innerHTML='';return;}el.innerHTML=a.map(function(n){return'<div class="keep-item"><input type="checkbox" class="keep-cb" '+(n.concluida?'checked':'')+' onchange="notaToggle('+n.id+')"><span class="keep-txt'+(n.concluida?' done':'')+'" onclick="notaToggle('+n.id+')">'+esc(n.texto)+'</span><button class="keep-del" onclick="notaDel('+n.id+')">×</button></div>';}).join('');}
function sCls(s){if(!s)return'afazer';s=s.toLowerCase();if(s.indexOf('andamento')>=0)return'andamento';if(s.indexOf('revis')>=0)return'revisao';if(s.indexOf('pendente')>=0)return'pendente';if(s.indexOf('conclu')>=0)return'concluido';return'afazer';}
function carregarDia(){var d=fmtISO(diaAtual);document.getElementById('lblDia').textContent=DSC[diaAtual.getDay()]+' '+diaAtual.getDate()+' '+MESES3[diaAtual.getMonth()].toUpperCase()+' '+diaAtual.getFullYear();document.getElementById('dayView').innerHTML='<div class="empty"><div class="empty-ico">⌛</div></div>';fetch('/api/agenda/data?data='+d).then(function(r){return r.json();}).then(function(dados){renderDia(dados);}).catch(function(e){document.getElementById('dayView').innerHTML='<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-txt">Erro ao carregar</div></div>';});}
function renderDia(dados){var iss=dados.issues||[];var hoje=new Date();hoje.setHours(0,0,0,0);var isHoje=diaAtual.getTime()===hoje.getTime();var notas=notasLoad();var html='<div class="day-hero"><div class="day-weekday">'+DSF[diaAtual.getDay()]+'</div><div class="day-date-full">'+fmtBR(diaAtual)+'</div>';if(iss.length)html+='<span class="count-badge">'+iss.length+' apontamento'+(iss.length>1?'s':'')+'</span>';html+='</div>';html+='<div class="section-lbl">Minhas Tarefas</div><div class="keep-box"><div class="keep-inp-row"><input id="notaInp" class="keep-inp" placeholder="Adicionar tarefa..." onkeydown="if(event.key===\'Enter\')notaAdd()"><button class="keep-add" onclick="notaAdd()">+</button></div><div class="keep-list" id="keepList"></div></div>';if(iss.length){html+='<div class="section-lbl">Prazos de Apontamentos</div>';for(var i=0;i<iss.length;i++){var iv=iss[i];var cls=iv.prioridade_class||'nenhuma';html+='<div class="card s-'+cls+'">'+'<div class="card-row1"><span class="card-code">'+esc(iv.id)+'</span>'+(iv.prioridade_label?'<span class="prio-badge pb-'+cls+'">'+esc(iv.prioridade_label)+'</span>':'')+'</div>'+'<div class="card-title">'+esc(iv.titulo||'Sem t\u00edtulo')+'</div>'+'<div class="card-tags">'+(iv.empreendimento?'<span class="tag-emp">&#127970; '+esc(iv.empreendimento)+'</span>':'')+(iv.disciplina?'<span class="tag-disc">&#128167; '+esc(iv.disciplina)+'</span>':'')+(iv.prazo?'<span class="tag-prazo">&#9203; '+esc(iv.prazo)+'</span>':'')+'</div>'+(iv.status?'<div class="card-status">'+esc(iv.status)+'</div>':'')+'</div>';}}if(!iss.length){html+='<div class="empty" style="padding-top:24px"><div class="empty-txt">'+(isHoje?'Nenhum prazo hoje':'Nenhum apontamento neste dia')+'</div></div>';}document.getElementById('dayView').innerHTML=html;renderNotas(notas);}
function carregarMes(){var ano=calBase.getFullYear(),mes=calBase.getMonth()+1;fetch('/api/agenda/mes?ano='+ano+'&mes='+mes).then(function(r){return r.json();}).then(function(data){diasEvs=new Set(data.dias||[]);renderCal();}).catch(function(){diasEvs=new Set();renderCal();});}
function renderCal(){var ano=calBase.getFullYear(),mes=calBase.getMonth();document.getElementById('lblMes').textContent=MESES[mes]+' '+ano;var grid=document.getElementById('calGrid');var html='';for(var i=0;i<7;i++)html+='<div class="cal-dn">'+DSC[i][0]+'</div>';var hoje=new Date();hoje.setHours(0,0,0,0);var prim=new Date(ano,mes,1).getDay();var ult=new Date(ano,mes+1,0).getDate();var ultAnt=new Date(ano,mes,0).getDate();for(var i=prim-1;i>=0;i--){var d2=ultAnt-i;html+='<div class="cal-d other-m" onclick="selecionarDia('+ano+','+(mes-1)+','+d2+')">'+d2+'</div>';}for(var d=1;d<=ult;d++){var dt=new Date(ano,mes,d);var isH=dt.getTime()===hoje.getTime();var isS=dt.getTime()===diaAtual.getTime();var isE=diasEvs.has(d);var c='cal-d';if(isH)c+=' is-today';if(isS)c+=' is-sel';if(isE)c+=' has-ev';html+='<div class="'+c+'" onclick="selecionarDia('+ano+','+mes+','+d+')">'+d+'</div>';}var resto=(7-((prim+ult)%7))%7;for(var d3=1;d3<=resto;d3++)html+='<div class="cal-d other-m" onclick="selecionarDia('+ano+','+(mes+1)+','+d3+')">'+d3+'</div>';grid.innerHTML=html;}
document.addEventListener('DOMContentLoaded',function(){carregarDia();carregarMes();fetch('/api/agenda/info').then(function(r){return r.json();}).then(function(info){if(info&&info.analista)document.getElementById('lblAnalista').textContent=info.analista;}).catch(function(){});});
</script>
</body>
</html>
