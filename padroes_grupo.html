<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auria — Padrões do Grupo</title>
<link rel="icon" href="logo_symbol.png" type="image/png">
<meta name="robots" content="noindex">
<script src="auria_busy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ===========================================================================
     Padrões do Grupo (backlog 179/187)
     Regras que valem para TODAS as obras do grupo, editadas por quem é dono do
     tema: setor de área Segurança (seção Segurança) e Qualidade (seção Qualidade
     e Biblioteca de ITs). A gestão do grupo edita tudo e define a área dos setores.
     A obra só LÊ (App Obra). As permissões são do banco (grupo_pode_editar);
     a página só esconde o que a pessoa não pode mudar.
     =========================================================================== -->
<style>
  :root{
    --bg:#EEF2F7; --panel:#FFFFFF; --panel2:#F6F9FC; --line:#E2E8F0;
    --txt:#0F172A; --txt2:#334155; --mut:#64748B;
    --navy:#1E3A5F; --accent:#E8960A; --ok:#1E8449; --warn:#B7791F; --err:#A32D2D;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Arial;font-size:13.5px}
  header{background:linear-gradient(90deg,#0B1220,#152036);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
  header img{height:22px}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
  header h1 span{display:block;font-size:11.5px;font-weight:500;color:#9DB3CA}
  .sp{flex:1}
  .who{text-align:right;font-size:11.5px;color:#9DB3CA;line-height:1.35}.who b{color:#fff;display:block;font-size:12.5px}
  .hbtn{background:#1B2942;border:1px solid #2A3850;color:#C9D6E4;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 14px;font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit;font-size:13px}
  .tab.on{color:var(--navy);border-bottom-color:var(--navy)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:14px;color:var(--navy)}
  td.cod{white-space:nowrap}
  .ins-it{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}.ins-it input[type=text]{width:100%;box-sizing:border-box}.ins-it .row input[type=text]{flex:1}.ins-it [data-f=dica]{margin-top:6px}
  .fm-it{width:100%}.fm-it input[type=text]{width:100%;box-sizing:border-box}.fm-it td{padding:3px 4px}.fm-it .btn.sec{padding:3px 8px;margin-left:2px}
  .card p.h{margin:0 0 12px;color:var(--mut);font-size:12.5px;line-height:1.5}
  label.l{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin:10px 0 4px}
  input[type=text],input[type=number],input[type=search],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:var(--txt);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #FBE7C4}
  input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--mut)}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:7px;font-weight:600;margin:6px 0}
  .chk input{width:auto}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-size:12px;margin-top:8px;min-height:16px}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
  .quem{font-size:11.5px;color:var(--mut);margin-top:6px}
  .ro{display:none;background:#FEF6E7;border:1px solid #F0B25B;color:#7A4E05;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
  .lista-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#DCEBFA;color:#1D4ED8;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
  .tag button{background:none;border:none;color:#1D4ED8;cursor:pointer;font-size:13px;padding:0}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 6px;border-bottom:1px solid #F1F5F9;vertical-align:top}
  .cod{font-family:var(--mono);font-weight:700;color:var(--navy)}
  .chip{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px}
  .t-seguranca{background:#FEF0D9;color:#8A5A04}.t-qualidade{background:#E8F0F8;color:var(--navy)}.t-execucao{background:#E6F4EC;color:var(--ok)}.t-meio_ambiente{background:#E6F4EC;color:#14532D}.t-outro{background:#F1F5F9;color:var(--mut)}
  .ov{position:fixed;inset:0;background:rgba(11,18,32,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov.on{display:flex}
  .box{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 0 0 2px var(--accent),0 20px 60px rgba(0,0,0,.35)}
  .box .hd{padding:14px 18px;border-bottom:1px solid var(--line)}.box .hd b{color:var(--navy);font-size:15px}
  .box .bd{padding:6px 18px 12px}
  .box .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
  .hint{color:var(--mut);font-size:12px}
  @media (max-width:720px){ .g3,.g2{grid-template-columns:minmax(0,1fr)} header h1 span{display:none} }
</style>
</head>
<body>
<header>
  <img src="logo_auria_branco.png" alt="Auria">
  <h1>Padrões do Grupo<span id="hGrupo"></span></h1>
  <span class="sp"></span>
  <div class="who"><b id="uNome"></b><span id="uPapel"></span></div>
  <button class="hbtn" onclick="history.length>1?history.back():location.replace('./')">← Voltar</button>
</header>

<div class="wrap">
  <div id="load" class="hint">Carregando…</div>
  <div id="app" style="display:none">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="seguranca" onclick="aba('seguranca')">Segurança do Trabalho</button>
      <button class="tab" data-t="qualidade" onclick="aba('qualidade')">Qualidade</button>
      <button class="tab" data-t="its" onclick="aba('its')">Biblioteca de ITs</button>
      <button class="tab" data-t="pessoas" onclick="aba('pessoas')" id="tabPessoas" style="display:none">Responsáveis</button>
    </div>
    <div id="corpo"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>

<script>
const sb = window.supabase.createClient(
  'https://sabzccokueowpromwxdg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let ME = null, GRUPO = null, ABA = 'seguranca', PODE = { seguranca:false, qualidade:false, its:false }, PADRAO = { seguranca:null, qualidade:null }, ITS = [];
const AREA_ROT = { seguranca:'Segurança', qualidade:'Qualidade', suprimentos:'Suprimentos', orcamento:'Orçamento', planejamento:'Planejamento', outro:'Outro' };
const TEMA_ROT = { seguranca:'Segurança', qualidade:'Qualidade', execucao:'Execução', meio_ambiente:'Meio ambiente', outro:'Outro' };

// Padrão de fábrica da Segurança (o que vale enquanto o grupo não salvar o seu)
const SEG_PADRAO = {
  bandeja: { ativa:true, a_partir:2, a_cada:3, obs:'' },
  inspecao_dias: { guarda_corpo:7, guarda_corpo_escada:7, bandeja:7, linha_vida:7, tela:7, fechamento:7, outro:7 },
  epis: ['Capacete','Cinto paraquedista','Talabarte duplo','Óculos','Protetor auricular','Luva','Máscara / respirador','Botina','Vestimenta antichama','Colete refletivo'],
  tipos_extra: [],
  alerta_vencida: { tecnico:true, eng_chefe:true }
};
const PT_ROT = { altura:'Trabalho em altura (NR-35)', quente:'Trabalho a quente', confinado:'Espaço confinado (NR-33)', eletrico:'Serviço elétrico (NR-10)', icamento:'Içamento de cargas', escavacao:'Escavação', outro:'Outro serviço de risco' };
const DICA_ROT = { 'risco:queda':'Zona: queda de altura', 'risco:escavacao':'Zona: escavação', 'risco:eletrico':'Zona: risco elétrico', 'risco:icamento':'Zona: içamento / grua',
  'risco:material_suspenso':'Zona: material suspenso', 'risco:maquinas':'Zona: máquinas', 'risco:confinado':'Zona: espaço confinado', 'risco:incendio':'Zona: incêndio',
  'pt:altura':'PT: altura', 'pt:quente':'PT: a quente', 'pt:confinado':'PT: espaço confinado', 'pt:eletrico':'PT: elétrico', 'pt:icamento':'PT: içamento', 'pt:escavacao':'PT: escavação',
  'prot:guarda_corpo':'Proteção: guarda-corpo', 'prot:bandeja':'Proteção: bandeja', 'prot:tela':'Proteção: tela / rede', 'prot:fechamento':'Proteção: fechamento de abertura', 'prot:linha_vida':'Proteção: linha de vida',
  'oc:quase_acidente':'Ocorrência: quase-acidente', 'oc:condicao_insegura':'Ocorrência: condição insegura', 'oc:acidente':'Ocorrência: acidente' };
const PROT_ROT = { guarda_corpo:'Guarda-corpo periférico', guarda_corpo_escada:'Guarda-corpo de escada', bandeja:'Bandeja de proteção', linha_vida:'Linha de vida', tela:'Tela / rede', fechamento:'Fechamento de abertura / shaft / poço', outro:'Outras proteções' };

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ location.replace('./'); return; }
  const { data:p } = await sb.from('usuarios_auria').select('id,nome,email,role,empresa_id,setor_area').eq('id', session.user.id).maybeSingle();
  if (!p || !['setor','gerente','super_admin','analista'].includes(p.role)){ location.replace('./'); return; }
  ME = p;
  $('uNome').textContent = p.nome || p.email;
  $('uPapel').textContent = p.role === 'setor' ? 'Setor · ' + (AREA_ROT[p.setor_area] || 'sem área definida') : ({ gerente:'Gestão do grupo', super_admin:'Administrador', analista:'Coordenação (consulta)' }[p.role]);
  GRUPO = p.empresa_id;
  const { data:g } = await sb.from('empresas_auria').select('id,nome').eq('id', GRUPO).maybeSingle();
  $('hGrupo').textContent = g ? g.nome : '';
  for (const s of ['seguranca','qualidade','its']){
    const r = await sb.rpc('grupo_pode_editar', { p_grupo: GRUPO, p_secao: s });
    PODE[s] = r.data === true;
  }
  if (['gerente','super_admin'].includes(p.role)) $('tabPessoas').style.display = '';
  await carregarPadroes();
  $('load').style.display = 'none'; $('app').style.display = '';
  const qa = new URLSearchParams(location.search).get('aba'); if (qa) ABA = qa;
  aba(ABA);
}
async function carregarPadroes(){
  const { data } = await sb.from('grupo_padrao_auria').select('*').eq('grupo_id', GRUPO);
  (data || []).forEach(r => PADRAO[r.secao] = r);
}
function aba(t){
  ABA = t;
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({ seguranca:telaSeguranca, qualidade:telaQualidade, its:telaITs, pessoas:telaPessoas })[t]();
}
function aviso(pode, quem){ return pode ? '' : '<div class="ro" style="display:block">Somente consulta. Quem edita esta seção: ' + quem + '.</div>'; }
function carimbo(r){ return r && r.atualizado_em ? '<div class="quem">Última alteração: ' + esc(r.atualizado_nome || '') + ' · ' + new Date(r.atualizado_em).toLocaleString('pt-BR') + '</div>' : '<div class="quem">Ainda no padrão Auria (o grupo não salvou o seu).</div>'; }

// ── Segurança ───────────────────────────────────────────────────────────────
function telaSeguranca(){
  const d = Object.assign({}, SEG_PADRAO, (PADRAO.seguranca && PADRAO.seguranca.dados) || {});
  d.bandeja = Object.assign({}, SEG_PADRAO.bandeja, d.bandeja || {});
  d.inspecao_dias = Object.assign({}, SEG_PADRAO.inspecao_dias, d.inspecao_dias || {});
  d.alerta_vencida = Object.assign({}, SEG_PADRAO.alerta_vencida, d.alerta_vencida || {});
  const dis = PODE.seguranca ? '' : ' disabled';
  window._EPIS = (d.epis || []).slice(); window._TIPOS = (d.tipos_extra || []).slice();
  $('corpo').innerHTML = aviso(PODE.seguranca, 'setor de Segurança e gestão do grupo')
    + '<div class="card"><h3>Bandeja de proteção</h3><p class="h">Usada pela sugestão automática do App Obra. A regra exata da bandeja mudou na revisão da NR-18; ajuste ao padrão da construtora.</p>'
    + '<label class="chk"><input type="checkbox" id="bjAtiva"' + (d.bandeja.ativa ? ' checked' : '') + dis + '> Sugerir bandejas nas obras</label>'
    + '<div class="g3"><div><label class="l">Primeira bandeja no pavimento nº</label><input type="number" min="1" id="bjIni" value="' + esc(d.bandeja.a_partir) + '"' + dis + '></div>'
    + '<div><label class="l">Depois, a cada quantas lajes</label><input type="number" min="1" id="bjCada" value="' + esc(d.bandeja.a_cada) + '"' + dis + '></div>'
    + '<div><label class="l">Observação / referência</label><input type="text" id="bjObs" value="' + esc(d.bandeja.obs) + '" placeholder="Ex.: conforme IT-SEG-012"' + dis + '></div></div></div>'
    + '<div class="card"><h3>Inspeção periódica das proteções</h3><p class="h">Prazo padrão entre inspeções, em dias. O técnico pode ajustar por proteção na obra (fica registrado). Vencida, gera alerta de atenção.</p>'
    + '<div class="g3">' + Object.keys(PROT_ROT).map(k => '<div><label class="l">' + PROT_ROT[k] + '</label><input type="number" min="1" max="90" data-insp="' + k + '" value="' + esc(d.inspecao_dias[k]) + '"' + dis + '></div>').join('') + '</div>'
    + '<label class="l" style="margin-top:14px">Alerta de proteção vencida vai para</label>'
    + '<label class="chk"><input type="checkbox" id="avTec"' + (d.alerta_vencida.tecnico ? ' checked' : '') + dis + '> Técnico de segurança</label>'
    + '<label class="chk"><input type="checkbox" id="avEng"' + (d.alerta_vencida.eng_chefe ? ' checked' : '') + dis + '> Engenheiro chefe</label></div>'
    + '<div class="card"><h3>EPIs da lista</h3><p class="h">Aparecem como opção nas zonas de risco e nos alertas.</p><div class="lista-tags" id="epiTags"></div>'
    + (PODE.seguranca ? '<div class="row" style="margin-top:10px"><input type="text" id="epiNovo" placeholder="Novo EPI" style="max-width:280px"><button class="btn sec" onclick="addTag(\'_EPIS\',\'epiNovo\',\'epiTags\')">Adicionar</button></div>' : '') + '</div>'
    + '<div class="card"><h3>Tipos de risco adicionais</h3><p class="h">Somam-se aos tipos da NR (queda, içamento, escavação, elétrico, máquinas, material suspenso, espaço confinado, incêndio).</p><div class="lista-tags" id="tipoTags"></div>'
    + (PODE.seguranca ? '<div class="row" style="margin-top:10px"><input type="text" id="tipoNovo" placeholder="Ex.: Trabalho em fachada (balancim)" style="max-width:320px"><button class="btn sec" onclick="addTag(\'_TIPOS\',\'tipoNovo\',\'tipoTags\')">Adicionar</button></div>' : '') + '</div>'
    + '<div class="card"><h3>Checklists das Permissões de Trabalho</h3><p class="h">Um item por linha. É o que o técnico confere em campo para <b>liberar</b> a PT no App Obra. Em branco = checklist padrão do Auria.</p>'
    + '<div class="g2">' + Object.keys(PT_ROT).map(k => '<div><label class="l">' + PT_ROT[k] + '</label><textarea rows="5" data-ptck="' + k + '"' + dis + ' placeholder="(padrão do Auria)">' + esc(((d.pt_checklists || {})[k] || []).join('\n')) + '</textarea></div>').join('') + '</div></div>'
    + '<div class="card" id="insCard"><h3>Modelos de inspeção de segurança (NR-18)</h3><div id="insCorpo" class="hint">Carregando…</div></div>'
    + '<div class="card"><h3>💡 Dicas do grupo</h3><p class="h">Somam-se às dicas das normas que o App Obra mostra no formulário de cada tipo (zona de risco, PT, proteção coletiva, ocorrência). Uma dica por linha — ex.: o procedimento interno ou a IT do grupo para aquele caso.</p>'
    + '<div class="g2">' + Object.keys(DICA_ROT).map(k => '<div><label class="l">' + DICA_ROT[k] + '</label><textarea rows="3" data-dica="' + k + '"' + dis + ' placeholder="(só as dicas das normas)">' + esc(((d.dicas_extra || {})[k] || []).join('\n')) + '</textarea></div>').join('') + '</div></div>'
    + (PODE.seguranca ? '<div class="row"><button class="btn" id="segSalvar" onclick="salvarSeguranca()">Salvar padrões de segurança</button><span class="msg" id="segMsg"></span></div>' : '')
    + carimbo(PADRAO.seguranca);
  renderTags('_EPIS','epiTags'); renderTags('_TIPOS','tipoTags');
  insCarregar();
}
function renderTags(arr, el){
  $(el).innerHTML = window[arr].map((t,i) => '<span class="tag">' + esc(t) + (PODE.seguranca ? '<button title="Tirar" onclick="window.' + arr + '.splice(' + i + ',1);renderTags(\'' + arr + '\',\'' + el + '\')">×</button>' : '') + '</span>').join('') || '<span class="hint">Nenhum.</span>';
}
function addTag(arr, inp, el){ const v = ($(inp).value || '').trim(); if (!v || window[arr].includes(v)) return; window[arr].push(v); $(inp).value = ''; renderTags(arr, el); }
async function salvarSeguranca(){
  const num = (id, def) => { const n = parseInt($(id).value, 10); return n > 0 ? n : def; };
  const insp = {}; document.querySelectorAll('[data-insp]').forEach(i => { const n = parseInt(i.value, 10); insp[i.dataset.insp] = n > 0 ? n : 7; });
  const dados = {
    bandeja: { ativa: $('bjAtiva').checked, a_partir: num('bjIni', 2), a_cada: num('bjCada', 3), obs: ($('bjObs').value || '').trim() },
    inspecao_dias: insp, epis: window._EPIS, tipos_extra: window._TIPOS,
    alerta_vencida: { tecnico: $('avTec').checked, eng_chefe: $('avEng').checked },
    dicas_extra: (() => { const o = {}; document.querySelectorAll('[data-dica]').forEach(t => { const l = (t.value || '').split('\n').map(x => x.trim()).filter(Boolean); if (l.length) o[t.dataset.dica] = l; }); return o; })(),
    pt_checklists: (() => { const o = {}; document.querySelectorAll('[data-ptck]').forEach(t => { const l = (t.value || '').split('\n').map(s => s.trim()).filter(Boolean); if (l.length) o[t.dataset.ptck] = l; }); return o; })()
  };
  const b = $('segSalvar'); b.disabled = true;
  const { error } = await sb.from('grupo_padrao_auria').upsert({ grupo_id: GRUPO, secao: 'seguranca', dados }, { onConflict: 'grupo_id,secao' });
  b.disabled = false;
  if (error){ $('segMsg').className = 'msg err'; $('segMsg').textContent = 'Não foi possível salvar: ' + error.message; return; }
  await carregarPadroes(); telaSeguranca(); const m = $('segMsg'); if (m){ m.className = 'msg ok'; m.textContent = 'Salvo. Vale para todas as obras do grupo.'; }
}

// Modelos de partida das INSPEÇÕES DE SEGURANÇA (C2) — Auria.
// Item: [o que verificar, referência, dica (paráfrase), gravidade sugerida p/ NC, exige foto]
// Referências NR-18 conferidas 2026-10-07 no texto compilado gov.br 2026 + Portaria MTE 836/2026.
// Usado em padroes_grupo.html (importar) — a Segurança do grupo ajusta ao padrão da construtora.
const SEG_PARTIDA = [
  { codigo:'INS-QUE-01', servico:'Proteção contra quedas — periferia e aberturas', per:7, itens:[
    ['Periferia com proteção desde a concretagem da 1ª laje', 'NR-18 18.9.4', 'Obrigatória a partir do início dos serviços para a 1ª laje.', 'grave_iminente', true],

async function insImportar(){
  if (!confirm('Criar os ' + SEG_PARTIDA.length + ' modelos de partida de inspeção de segurança neste grupo?')) return;

    itens:m.itens.map(([item, norma_ref, dica, gravidade, exige_foto]) => ({ item, norma_ref, dica, gravidade, exige_foto, metodo:'', tolerancia:'', criterio:'' })) }));

function insItens(){
  const dis = PODE.seguranca ? '' : ' disabled';
  $('imItens').innerHTML = _INS_IT.map((t, i) => '<div class="ins-it" data-i="' + i + '">'
    + '<div class="g2"><div><input type="text" data-f="item" value="' + esc(t.item) + '" placeholder="O que verificar"' + dis + '></div>'
    + '<div class="row" style="gap:6px"><input type="text" data-f="norma_ref" value="' + esc(t.norma_ref || '') + '" placeholder="Ex.: NR-18 18.9.4.2"' + dis + '>'
    + '<select data-f="gravidade"' + dis + '>' + Object.keys(GRAV_ROT).map(k => '<option value="' + k + '"' + (k === (t.gravidade || 'grave') ? ' selected' : '') + '>' + GRAV_ROT[k] + '</option>').join('') + '</select>'
    + '<label class="chk" style="margin:0"><input type="checkbox" data-f="exige_foto"' + (t.exige_foto ? ' checked' : '') + dis + '> foto</label>'
    + (PODE.seguranca ? '<button class="btn sec" onclick="insLer();_INS_IT.splice(' + i + ',1);insItens()">×</button>' : '') + '</div></div>'
    + '<input type="text" data-f="dica" value="' + esc(t.dica || '') + '" placeholder="💡 Dica (opcional)"' + dis + '></div>').join('');
}
function insLer(){
  _INS_IT = [...document.querySelectorAll('#imItens .ins-it')].map(d => ({ item:d.querySelector('[data-f=item]').value.trim(), norma_ref:d.querySelector('[data-f=norma_ref]').value.trim(),
    gravidade:d.querySelector('[data-f=gravidade]').value, exige_foto:d.querySelector('[data-f=exige_foto]').checked, dica:d.querySelector('[data-f=dica]').value.trim(), metodo:'', tolerancia:'', criterio:'' }));
}
async function insSalvar(id){
  insLer();
  const msg = t => { $('imMsg').className = 'msg err'; $('imMsg').textContent = t; };
  const itens = _INS_IT.filter(t => t.item);
  const row = { servico:($('imServ').value || '').trim(), periodicidade_dias:parseInt($('imPer').value, 10) || 7, itens };
  if (row.servico.length < 3) return msg('Escreva o nome da inspeção.');
  if (!itens.length) return msg('O modelo precisa de pelo menos um item.');
  $('imOk').disabled = true;
  let r;
  if (id){ row.ativo = $('imAtivo').checked; r = await sb.from('fvs_modelo_auria').update(row).eq('id', id); }
  else {
    const cod = ($('imCod').value || '').trim().toUpperCase();
    if (cod.length < 4){ $('imOk').disabled = false; return msg('Escreva o código.'); }
    r = await sb.from('fvs_modelo_auria').insert(Object.assign(row, { grupo_id:GRUPO, tipo:'seguranca', codigo:cod, etapa:'outro', nivel_local:'pavimento' }));
  }
  if (r.error){ $('imOk').disabled = false; return msg(/duplicate|unique/i.test(r.error.message) ? 'Já existe um modelo com esse código.' : r.error.message); }
  ovFechar(); insCarregar();
}

    + '<div class="g2"><div><label class="l">Revisão</label><input type="text" id="rvNum" value="' + esc(prox) + '" placeholder="Ex.: 03"></div><div><label class="l">Arquivo (PDF)</label><input type="file" id="rvArq" accept="application/pdf"></div></div>'
    + '<label class="l">O que mudou nesta revisão</label><textarea id="rvObs" rows="3"></textarea><div class="msg" id="rvMsg"></div></div>'
    + '<div class="ft"><button class="btn sec" onclick="ovFechar();telaITs()">Cancelar</button><button class="btn" id="rvOk" onclick="revPublicar(\'' + id + '\')">Publicar</button></div>');
}
async function r2Url(action, path, contentType){
  const r = await sb.functions.invoke('cde-r2', { body:{ action, path, contentType } });
  if (r.error){ let m = r.error.message; try { const b = await r.error.context.json(); if (b && b.error) m = b.error; } catch (_){} throw new Error(m); }
  return r.data.url;
}
async function revPublicar(id){
  const msg = (t, ok) => { $('rvMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('rvMsg').textContent = t; };
  const rev = ($('rvNum').value || '').trim(), f = $('rvArq').files[0];
  if (!rev) return msg('Informe a revisão.');
  if (!f) return msg('Escolha o PDF da IT.');
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) return msg('O arquivo precisa ser PDF.');
  $('rvOk').disabled = true; msg('Enviando o arquivo…', true);
  try {
    const nome = f.name.replace(/[^\w.\-]+/g, '_');
    const path = GRUPO + '/_its/' + id + '/' + Date.now() + '_' + nome;
    const url = await r2Url('upload', path, 'application/pdf');
    const up = await fetch(url, { method:'PUT', headers:{ 'content-type':'application/pdf' }, body:f });
    if (!up.ok) throw new Error('Falha no envio (' + up.status + ').');
    const { error } = await sb.rpc('grupo_it_publicar', { p_it:id, p_revisao:rev, p_path:path, p_nome:f.name, p_bytes:f.size, p_obs:($('rvObs').value || '').trim() });
    if (error) throw error;
    await carregarITs(); itDetalhe(id);
  } catch (e){ $('rvOk').disabled = false; msg('Não foi possível publicar: ' + (e.message || e)); }
}
// Abre no visualizador do próprio Auria (auria_pdfview.js), estilo CDE.
function abrirPdf(path){
  let it = null, rv = null;
  ITS.forEach(i => (i.revs || []).forEach(r => { if (r.arquivo_path === path){ it = i; rv = r; } }));
  ovFechar();
  AuriaPDF.abrir({ url: () => r2Url('download', path), codigo: it ? it.codigo + ' · rev. ' + rv.revisao : '',
                   titulo: it ? it.titulo : 'Documento', sub: rv ? (rv.vigente ? 'revisão vigente' : 'revisão anterior (histórico)') : '' });
}

// ── Responsáveis (gestão) ───────────────────────────────────────────────────
async function telaPessoas(){
  $('corpo').innerHTML = '<div class="hint">Carregando…</div>';
  const { data, error } = await sb.from('usuarios_auria').select('id,nome,email,setor_area,pode_aprovar_fvs').eq('role','setor').eq('empresa_id', GRUPO).order('nome');
  $('corpo').innerHTML = '<div class="card"><h3>Área de cada setor</h3><p class="h">A área decide o que a pessoa edita aqui: <b>Segurança</b> edita os padrões de segurança e as ITs; <b>Qualidade</b> edita os padrões de qualidade e as ITs. '
    + '"Pode aprovar FVS" vale quando o módulo de FVS entrar. Só a gestão do grupo muda a área.</p>'
    + (error ? '<div class="ro" style="display:block">' + esc(error.message) + '</div>' : '')
    + ((data || []).length ? '<table><tr><th>Pessoa</th><th>Área</th><th>Pode aprovar FVS</th><th></th></tr>' + data.map(u => '<tr><td><b>' + esc(u.nome || '—') + '</b><div class="hint">' + esc(u.email) + '</div></td>'
        + '<td><select id="ar_' + u.id + '" style="width:auto"><option value="">— sem área —</option>' + Object.keys(AREA_ROT).map(k => '<option value="' + k + '"' + (k === u.setor_area ? ' selected' : '') + '>' + AREA_ROT[k] + '</option>').join('') + '</select></td>'
        + '<td><input type="checkbox" id="fv_' + u.id + '"' + (u.pode_aprovar_fvs ? ' checked' : '') + ' style="width:auto"></td>'
        + '<td style="text-align:right"><button class="btn sec" onclick="salvarArea(\'' + u.id + '\', this)">Salvar</button></td></tr>').join('') + '</table>'
      : '<div class="hint">Nenhum usuário do perfil setor neste grupo. Convide pela tela de Acessos de um empreendimento.</div>') + '</div>';
}
async function salvarArea(id, b){
  b.disabled = true; b.textContent = '…';
  const { error } = await sb.rpc('grupo_definir_area_setor', { p_usuario:id, p_area:$('ar_' + id).value, p_aprova_fvs:$('fv_' + id).checked });
  b.disabled = false; b.textContent = error ? 'Erro' : 'Salvo ✓';
  if (error) alert(error.message);
}

boot().catch(e => { $('load').textContent = 'Erro ao carregar: ' + (e.message || e); });
