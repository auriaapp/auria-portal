<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Auria — Acesso</title>
<link rel="icon" type="image/png" href="logo_symbol.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;color:#1E293B}
  #wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 60%,#1D4ED8 100%)}
  .card{background:#fff;border-radius:20px;padding:44px 40px;width:400px;max-width:94vw;
    box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
  .card img{height:150px;object-fit:contain;margin-bottom:14px}
  .badge{display:inline-block;margin-bottom:16px;font-size:11px;letter-spacing:1px;background:#1E3A5F;
    color:#fff;border-radius:5px;padding:4px 12px;font-weight:700}
  h2{font-size:16px;color:#1A2F4A;margin-bottom:4px;text-align:left}
  .sub{font-size:13px;color:#94A3B8;margin-bottom:22px;text-align:left}
  label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;text-align:left}
  input{width:100%;border:1.5px solid #E2E8F0;border-radius:9px;padding:11px 13px;font-size:14px;
    outline:none;background:#FAFAFA;margin-bottom:14px;transition:border .15s}
  input:focus{border-color:#3B82F6;background:#fff}
  .btn{width:100%;background:#3B82F6;color:#fff;border:none;border-radius:9px;padding:12px;
    font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:2px}
  .btn:hover{background:#1D4ED8}
  .btn[disabled]{opacity:.6;cursor:default}
  .err{background:#FEF2F2;color:#EF4444;border-radius:8px;padding:9px 12px;font-size:13px;
    margin-bottom:12px;display:none;text-align:left}
  .msg{background:#ECFDF5;color:#059669;border-radius:8px;padding:9px 12px;font-size:13px;
    margin-bottom:12px;display:none;text-align:left}
  .linkline{margin-top:18px;font-size:12.5px;color:#64748B}
  .linkline a{color:#2563EB;text-decoration:none;font-weight:600;cursor:pointer}
  .linkline a:hover{text-decoration:underline}
  #loading{color:#fff;font-size:14px;text-align:center}
  .hide{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div class="card" id="card">
    <img src="logo_full.png" alt="Auria">
    <div class="badge">ACESSO</div>

    <!-- LOGIN -->
    <div id="viewLogin">
      <h2 id="loginTitle">Entrar</h2>
      <div class="sub">Acesse com seu e-mail e senha</div>
      <div class="err" id="err"></div>
      <div class="msg" id="msg"></div>
      <label>E-mail</label>
      <input id="email" type="email" placeholder="voce@email.com" autocomplete="email">
      <label>Senha</label>
      <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
      <button class="btn" id="btnEntrar" onclick="entrar()">Entrar &rarr;</button>
      <div class="linkline">É projetista e ainda não tem acesso?
        <a onclick="mostrar('cadastro')">Solicitar cadastro de projetista</a>
      </div>
    </div>

    <!-- CADASTRO (projetista) -->
    <div id="viewCadastro" class="hide">
      <h2>Solicitar cadastro</h2>
      <div class="sub">Para projetistas e fornecedores. Após criar, o analista vincula você aos empreendimentos.</div>
      <div class="err" id="errC"></div>
      <div class="msg" id="msgC"></div>
      <label>Nome completo</label>
      <input id="cNome" placeholder="Ex.: Eng. Carlos Silva" autocomplete="name">
      <label>E-mail</label>
      <input id="cEmail" type="email" placeholder="voce@email.com" autocomplete="email">
      <label>Senha</label>
      <input id="cSenha" type="password" placeholder="Crie uma senha" autocomplete="new-password">
      <button class="btn" id="btnCad" onclick="solicitar()">Solicitar cadastro</button>
      <div class="linkline"><a onclick="mostrar('login')">&larr; Voltar para o login</a></div>
    </div>
  </div>

  <div id="loading" class="hide">Carregando…</div>
</div>

<script>
const SUPA_URL = 'https://sabzccokueowpromwxdg.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

function $(id){ return document.getElementById(id); }
function showErr(el,txt){ el.textContent=txt; el.style.display=txt?'block':'none'; }
function mostrar(v){
  $('viewLogin').classList.toggle('hide', v!=='login');
  $('viewCadastro').classList.toggle('hide', v!=='cadastro');
  showErr($('err'),''); showErr($('msg'),''); showErr($('errC'),''); showErr($('msgC'),'');
}

// Descobre o papel e redireciona para o painel certo.
async function rotear(user){
  $('card').classList.add('hide'); $('loading').classList.remove('hide');
  let role = null;
  try{
    const { data } = await sb.from('usuarios_auria').select('role').eq('id', user.id).maybeSingle();
    role = data && data.role ? data.role : null;
  }catch(e){}
  // CEO tem página exclusiva e sessão isolada: o roteador NÃO mantém sessão de
  // admin. Se for super_admin, desloga daqui e manda para a página do CEO
  // (que exige o próprio login).
  if(role==='super_admin'){ try{ await sb.auth.signOut(); }catch(e){} location.replace('auria_ceo.html'); return; }
  const dest = role==='gerente'    ? 'auria_gerencia.html'
             : role==='analista'   ? 'auria_analista.html'
             : role==='financeiro' ? 'auria_custos.html'
             : 'projetista.html';   // projetista ou sem papel definido
  location.replace(dest);
}

async function entrar(){
  const email=$('email').value.trim(), senha=$('senha').value.trim();
  showErr($('err'),''); showErr($('msg'),'');
  if(!email||!senha){ showErr($('err'),'Preencha e-mail e senha.'); return; }
  $('btnEntrar').disabled=true; $('btnEntrar').textContent='Entrando…';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
    if(error) throw error;
    await rotear(data.user);
  }catch(e){
    const m=(e&&e.message)||'';
    showErr($('err'), m.toLowerCase().includes('invalid') ? 'E-mail ou senha incorretos.' : (m||'Falha ao entrar.'));
    $('btnEntrar').disabled=false; $('btnEntrar').innerHTML='Entrar &rarr;';
  }
}

async function solicitar(){
  const nome=$('cNome').value.trim(), email=$('cEmail').value.trim(), senha=$('cSenha').value.trim();
  showErr($('errC'),''); showErr($('msgC'),'');
  if(!nome||!email||!senha){ showErr($('errC'),'Preencha todos os campos.'); return; }
  if(senha.length<6){ showErr($('errC'),'A senha deve ter ao menos 6 caracteres.'); return; }
  $('btnCad').disabled=true; $('btnCad').textContent='Enviando…';
  try{
    const { data, error } = await sb.auth.signUp({ email, password:senha, options:{ data:{ nome } } });
    if(error) throw error;
    // Supabase devolve identities:[] quando o e-mail JÁ existe (proteção anti-enumeração).
    if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      showErr($('errC'),'Este e-mail já possui cadastro. Volte e faça login.');
      $('btnCad').disabled=false; $('btnCad').textContent='Solicitar cadastro'; return;
    }
    // SEGURANÇA: cadastro NUNCA loga nem roteia automaticamente. Encerra qualquer
    // sessão que o signUp tenha criado — o usuário precisa fazer login depois.
    try{ await sb.auth.signOut(); }catch(e){}
    showErr($('msgC'),'Cadastro solicitado! Faça login para entrar. (Se pedir confirmação, verifique seu e-mail antes.)');
    $('btnCad').disabled=false; $('btnCad').textContent='Solicitar cadastro';
  }catch(e){
    const m=(e&&e.message)||'';
    showErr($('errC'), m.toLowerCase().includes('registered') ? 'Este e-mail já tem cadastro. Volte e faça login.' : (m||'Falha no cadastro.'));
    $('btnCad').disabled=false; $('btnCad').textContent='Solicitar cadastro';
  }
}

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(!$('viewCadastro').classList.contains('hide')) solicitar(); else entrar();
});

// Se já estiver logado, roteia direto (pula o login).
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) rotear(session.user);
  }catch(e){}
})();
</script>
</body>
</html>
