# Backup diário do Auria → Cloudflare R2 (bucket auria-backup)
#
# O que faz, todo dia às 03:00 (Brasília):
#   1. pg_dump completo do banco Supabase (formato custom), cifrado com GPG
#      → auria-backup/banco/diario/AAAA-MM-DD.dump.gpg
#      → no dia 1 também em banco/mensal/AAAA-MM.dump.gpg
#   2. Cópia incremental dos buckets do Supabase Storage (só o novo/alterado)
#      → auria-backup/storage/<bucket>/...
#
# A chave do R2 é só "Object Read & Write" no auria-backup; este script NUNCA
# apaga nada. A retenção (30 dias diários / 12 meses mensais) é feita pela
# regra de ciclo de vida do próprio bucket no painel da Cloudflare.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        URI do Session pooler, com a senha do banco
#   BACKUP_PASSPHRASE      senha da cifra — GUARDAR TAMBÉM NO BITWARDEN,
#                          sem ela o backup não pode ser aberto
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT
#   SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY, SUPABASE_S3_REGION
#     (Supabase → Storage → S3 Configuration → New access key)
#
# Restauração: ver docs/restaurar_backup.md

name: Backup diário

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_SB_TYPE: s3
      RCLONE_CONFIG_SB_PROVIDER: Other
      RCLONE_CONFIG_SB_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SB_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SB_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      RCLONE_CONFIG_SB_ENDPOINT: https://sabzccokueowpromwxdg.storage.supabase.co/storage/v1/s3
      RCLONE_CONFIG_SB_FORCE_PATH_STYLE: 'true'
    steps:
      - name: Instalar pg_dump 17 e rclone
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: Banco → R2 (cifrado)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          DIA=$(TZ=America/Sao_Paulo date +%F)
          # Diagnóstico do endereço SEM expor a senha: só formato, host e tamanho.
          python3 - <<'PY'
          import os, urllib.parse as u
          s = os.environ.get("DB_URL", "")
          print("diag: tamanho do endereco =", len(s), "| espacos/quebras nas pontas =", s != s.strip())
          try:
              p = u.urlsplit(s.strip())
              print("diag: esquema =", p.scheme, "| usuario =", p.username, "| host =", p.hostname, "| porta =", p.port, "| banco =", p.path)
              pw = p.password or ""
              print("diag: senha tem", len(pw), "caracteres | simbolos nao codificados:",
                    sorted({c for c in u.unquote(pw) if not c.isalnum()} & set("@#/?:[] ")) if pw else "SEM SENHA")
          except Exception as e:
              print("diag: endereco invalido ->", type(e).__name__)
          PY
          python3 - <<'PY'
          import os, re, urllib.parse as u
          e = os.environ.get("RCLONE_CONFIG_R2_ENDPOINT", "")
          p = u.urlsplit(e.strip())
          h = p.hostname or ""
          m = re.fullmatch(r"([0-9a-f]+)((?:\.[a-z]+)?)\.r2\.cloudflarestorage\.com", h)
          print("diag R2: esquema =", p.scheme or "FALTA https://", "| termina em .r2.cloudflarestorage.com =", bool(m),
                "| account id com", len(m.group(1)) if m else "?", "caracteres (esperado 32)",
                "| jurisdicao =", (m.group(2) or "default") if m else "?",
                "| caminho depois do .com =", repr(p.path) if p.path not in ("", "/") else "nenhum (ok)",
                "| espacos/quebras =", e != e.strip())
          PY
          export RCLONE_CONFIG_R2_ENDPOINT="$(printf '%s' "$RCLONE_CONFIG_R2_ENDPOINT" | tr -d '\r\n ')"
          export RCLONE_RETRIES=1 RCLONE_LOW_LEVEL_RETRIES=2 RCLONE_CONTIMEOUT=20s
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc -Z 9 --no-owner --no-privileges -f banco.dump 2>&1 \
            | sed -E 's#(postgres(ql)?://[^:]+:)[^@]*@#\1****@#g' || { echo "pg_dump falhou (exit ${PIPESTATUS[0]})"; exit 1; }
          ls -lh banco.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --symmetric --cipher-algo AES256 -o banco.dump.gpg banco.dump
          rclone copyto banco.dump.gpg "r2:auria-backup/banco/diario/$DIA.dump.gpg"
          if [ "$(TZ=America/Sao_Paulo date +%d)" = "01" ]; then
            rclone copyto banco.dump.gpg "r2:auria-backup/banco/mensal/$(TZ=America/Sao_Paulo date +%Y-%m).dump.gpg"
          fi
          echo "$DIA $(stat -c%s banco.dump.gpg)" > ultimo_backup.txt
          rclone copyto ultimo_backup.txt r2:auria-backup/ultimo_backup.txt
          rm -f banco.dump

      - name: Arquivos (Storage) → R2 (incremental)
        run: |
          set -euo pipefail
          for B in Auria apontamentos logos notas-fiscais cde cotacoes; do
            echo "== $B"
            rclone copy "sb:$B" "r2:auria-backup/storage/$B" --transfers 8 --stats-one-line --stats 30s
          done

      # Modelos BIM (IFC + .frag convertidos) vivem SÓ no R2 (auria-cde). Este passo
      # guarda uma cópia no Supabase Storage (bucket privado backup-r2) — outro
      # fornecedor. Chave própria SÓ DE LEITURA no auria-cde (R2CDE_*); sem ela,
      # o passo é pulado sem derrubar o backup do resto.
      - name: Modelos BIM (R2) → Supabase (incremental)
        id: bim
        env:
          RCLONE_CONFIG_R2CDE_TYPE: s3
          RCLONE_CONFIG_R2CDE_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2CDE_ACCESS_KEY_ID: ${{ secrets.R2CDE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2CDE_SECRET_ACCESS_KEY: ${{ secrets.R2CDE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2CDE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2CDE_NO_CHECK_BUCKET: 'true'
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_R2CDE_ACCESS_KEY_ID" ]; then echo "::warning::R2CDE_* não cadastrados — cópia dos modelos BIM pulada"; echo "bim=pulado" >> "$GITHUB_OUTPUT"; exit 0; fi
          export RCLONE_CONFIG_R2CDE_ENDPOINT="$(printf '%s' "$RCLONE_CONFIG_R2CDE_ENDPOINT" | tr -d '\r\n ')"
          # arquivos grandes (IFC até ~800 MB): multipart em pedaços de 64 MB
          rclone copy r2cde:auria-cde sb:backup-r2/auria-cde --transfers 4 --s3-chunk-size 64M --s3-upload-cutoff 64M --stats-one-line --stats 30s
          rclone size r2cde:auria-cde --json > bim_origem.json
          rclone size sb:backup-r2/auria-cde --json > bim_copia.json
          python3 -c 'import json;o=json.load(open("bim_origem.json"));c=json.load(open("bim_copia.json"));print("origem",o,"cópia",c);json.dump({"bim_arquivos":o["count"],"bim_bytes":o["bytes"],"bim_copia_arquivos":c["count"],"bim_copia_bytes":c["bytes"]},open("bim.json","w"))'

      - name: Registrar no painel do CEO
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OK: ${{ job.status == 'success' }}
        run: |
          set +e
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          echo '{}' > tam.json
          for B in Auria apontamentos logos notas-fiscais cde cotacoes; do
            rclone size "sb:$B" --json > s.json 2>/dev/null || echo '{"count":0,"bytes":0}' > s.json
            python3 -c 'import json,sys;t=json.load(open("tam.json"));d=json.load(open("s.json"));t["arquivos"]=t.get("arquivos",0)+d["count"];t["storage_bytes"]=t.get("storage_bytes",0)+d["bytes"];json.dump(t,open("tam.json","w"))'
          done
          DUMP=$(stat -c%s banco.dump.gpg 2>/dev/null || echo 0)
          J=$(python3 -c "import json,os;t=json.load(open('tam.json'));t['dump_bytes']=$DUMP;t.update(json.load(open('bim.json')) if os.path.exists('bim.json') else {});print(json.dumps(t))")
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -q -c "insert into public.ops_status_auria (tipo, ok, dados) values ('backup', $OK, '$J'::jsonb || jsonb_build_object('db_bytes', pg_database_size(current_database())))" \
            && echo "registrado: ok=$OK $J"
