<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auria — Ficha do empreendimento</title>
<link rel="icon" type="image/png" href="logo_symbol.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Mesmos tokens do CDE (cde_obra.html) — a ficha é uma tela do CDE. */
  :root{
    --bg:#EEF2F7; --panel:#FFFFFF; --panel2:#F6F9FC; --line:#E2E8F0;
    --txt:#0F172A; --txt2:#334155; --mut:#64748B;
    --navy:#1E3A5F; --accent:#E8960A; --ok:#1E8449; --warn:#B7791F; --err:#A32D2D;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  body.dark{
    --bg:#0B1220; --panel:#141C2B; --panel2:#1B2536; --line:#26324A;
    --txt:#E8EEF6; --txt2:#C2CFDF; --mut:#8496AC;
    --navy:#7FB3D3; --accent:#F0A72A; --ok:#4ADE80; --warn:#E9B44C; --err:#F87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);
       font-size:14px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}

  /* Cabeçalho: painel claro com acento laranja (padrão do CDE), logo do empreendimento */
  header{position:relative;background:var(--panel);border-bottom:1px solid var(--line);
         padding:16px 20px;display:flex;align-items:center;gap:16px}
  header::after{content:'';position:absolute;left:0;bottom:-1px;width:96px;height:2px;background:var(--accent)}
  .logo-tile{flex:none;width:62px;height:62px;border:1px solid var(--line);border-radius:10px;background:#fff;
         display:flex;align-items:center;justify-content:center;padding:7px}
  .logo-tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .h-tt{flex:1;min-width:0}
  .h-tt .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .h-tt h1{font-size:20px;font-weight:800;color:var(--txt);line-height:1.18;letter-spacing:-.01em}
  .h-tt .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
  .h-tt .sub b{color:var(--txt2);font-weight:600}
  .h-brand{flex:none;display:flex;align-items:center;gap:6px;align-self:flex-start;font-size:10.5px;color:var(--mut)}
  .h-brand img{height:16px;opacity:.85}
  @media(max-width:560px){ header{flex-wrap:wrap} .h-brand{order:3;width:100%} }

  .wrap{max-width:880px;margin:0 auto;padding:20px 18px 46px}
  .sec{margin-bottom:26px}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .sec-h::before{content:'';flex:none;width:4px;height:15px;border-radius:2px;background:var(--accent)}
  .sec-h b{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
  .sec-h .rule{flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
  .car{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s}
  .car:hover{border-color:var(--accent)}
  .car .k{font-size:11px;color:var(--mut);font-weight:600}
  .car .v{font-size:18px;font-weight:800;color:var(--txt);margin-top:3px;line-height:1.2;font-variant-numeric:tabular-nums}
  .car .v small{font-size:11.5px;color:var(--mut);font-weight:500;margin-left:3px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .doc{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--line)}
  .doc:last-child{border-bottom:none}
  .doc .nm{flex:1;min-width:150px;font-size:13.5px;color:var(--txt);font-weight:600}
  .doc .nm .sub{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:2px}
  .badge{font-size:11px;font-weight:700;border-radius:20px;padding:3px 11px;white-space:nowrap}
  .b-sim{background:rgba(30,132,73,.13);color:var(--ok)}
  .b-nao{background:rgba(163,45,45,.13);color:var(--err)}
  .b-proc{background:rgba(183,121,31,.15);color:var(--warn)}
  .b-na{background:var(--panel2);color:var(--mut)}
  .anexo{font-size:11.5px;font-weight:600;color:var(--accent);text-decoration:none;
         background:rgba(232,150,10,.12);border-radius:7px;padding:3px 9px;white-space:nowrap}
  .anexo:hover{background:rgba(232,150,10,.2)}

  .msg{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:34px 26px;text-align:center;color:var(--mut)}
  .msg .big{font-size:16px;color:var(--txt2);font-weight:700;margin-bottom:5px}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
        animation:g .8s linear infinite;margin:0 auto 13px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo-tile" id="logoTile">
    <img id="empLogo" alt="" onerror="document.getElementById('logoTile').style.display='none'">
  </div>
  <div class="h-tt">
    <div class="eyebrow">Empreendimento</div>
    <h1 id="empNome">—</h1>
    <div class="sub" id="empSub">carregando…</div>
  </div>
  <div class="h-brand"><img src="logo_symbol.png" alt="Auria" onerror="this.style.display='none'"><span>Auria CDE</span></div>
</header>
<div class="wrap" id="wrap">
  <div class="msg"><div class="spin"></div>Carregando a ficha…</div>
</div>
<script>
// Segue o tema do CDE/App: ?theme=dark|light (passado pelo abridor) ou o do SO.
(function(){ try{
  const t=new URLSearchParams(location.search).get('theme');
  if(t==='dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches))
    document.body.classList.add('dark');
}catch(_){} })();

const sb = window.supabase.createClient(
  'https://sabzccokueowpromwxdg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE');
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qp(k){ return new URLSearchParams(location.search).get(k); }

function statusBadge(op, st){
  if(st==='sim')      return '<span class="badge b-sim">Sim</span>';
  if(st==='nao')      return '<span class="badge b-nao">Não</span>';
  if(st==='processo') return '<span class="badge b-proc">Em processo</span>';
  return '<span class="badge b-na">—</span>';
}
function subLabel(v){ return v==='sim'?'Sim':v==='nao'?'Não':v==='adefinir'?'A definir':'—'; }

function render(nome, logoUrl, config){
  $('empNome').textContent = nome || 'Empreendimento';
  // Logo do EMPREENDIMENTO (cadastrada no painel da gestão). Sem logo → esconde a placa.
  if(logoUrl){ $('empLogo').src = logoUrl; $('empLogo').alt = nome||''; }
  else { $('logoTile').style.display='none'; }
  const b = (config&&config.briefing) || null;
  const linha = [config&&config.tipo_empreendimento, config&&config.tipologia].filter(Boolean);
  $('empSub').innerHTML = linha.length ? linha.map(x=>`<b>${esc(x)}</b>`).join(' · ') : 'Ficha do empreendimento';
  if(!b || ((!b.carac||!b.carac.length) && (!b.docs||!b.docs.length))){
    $('wrap').innerHTML = '<div class="msg"><div class="big">Ficha ainda não preenchida</div>Este empreendimento não tem características ou viabilidades cadastradas.</div>';
    return;
  }
  let html='';
  const carac = (b.carac||[]).filter(c=>(c.valor||'').toString().trim());
  if(carac.length){
    html += '<div class="sec"><div class="sec-h"><b>Características gerais</b><span class="rule"></span></div><div class="grid">'
      + carac.map(c=>`<div class="car"><div class="k">${esc(c.rotulo)}</div><div class="v">${esc(c.valor)}${c.unidade?` <small>${esc(c.unidade)}</small>`:''}</div></div>`).join('')
      + '</div></div>';
  }
  const docs = (b.docs||[]).filter(d=>d.status);
  if(docs.length){
    html += '<div class="sec"><div class="sec-h"><b>Viabilidades &amp; documentação</b><span class="rule"></span></div><div class="panel">'
      + docs.map(d=>{
        let sub='';
        if(d.cond && (d.cond.quando||[]).includes(d.status)){
          if(d.cond.tipo==='status3' && d.sub) sub = `<span class="sub">${esc(d.cond.rotulo)}: ${esc(subLabel(d.sub))}</span>`;
          else if(d.cond.tipo==='texto' && (d.texto||'').trim()) sub = `<span class="sub">${esc(d.cond.rotulo)}: ${esc(d.texto)}</span>`;
        }
        let anexo='';
        if(d.anexo && d.anexo.documento_id){
          anexo = d.anexo.qr_token
            ? `<a class="anexo" href="v.html?p=${esc(d.anexo.qr_token)}" target="_blank" rel="noopener">🔗 ${esc(d.anexo.codigo||'ver PDF')}</a>`
            : `<span class="anexo" style="color:var(--mut);background:var(--panel2)">🔗 ${esc(d.anexo.codigo||'')}</span>`;
        }
        return `<div class="doc"><div class="nm">${esc(d.rotulo)}${sub}</div>${anexo}${statusBadge(d.op,d.status)}</div>`;
      }).join('')
      + '</div></div>';
  }
  if(!html) html='<div class="msg"><div class="big">Ficha ainda não preenchida</div>Este empreendimento não tem características ou viabilidades cadastradas.</div>';
  $('wrap').innerHTML = html;
}

(async function(){
  const emp = qp('emp');
  if(!emp){ $('wrap').innerHTML='<div class="msg">Link inválido (sem empreendimento).</div>'; return; }
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data&&r.data.session; }catch(e){}
  if(!session){ location.replace('./'); return; }  // sem sessão → login único
  try{
    const { data, error } = await sb.rpc('cde_ficha_empreendimento', { p_emp: emp });
    if(error) throw error;
    const row = data && data[0];
    if(!row){ $('wrap').innerHTML='<div class="msg">Você não tem acesso a este empreendimento, ou ele não existe.</div>'; $('empSub').textContent=''; return; }
    render(row.nome, row.logo_url, row.config);
  }catch(e){
    $('wrap').innerHTML='<div class="msg">Erro ao carregar a ficha: '+esc(e.message||e)+'</div>';
    $('empSub').textContent='';
  }
})();
</script>
</body>
</html>
