<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auria — Ficha do empreendimento</title>
<link rel="icon" type="image/png" href="logo_symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3F1EC; --panel:#FFFFFF; --line:#E4E0D6; --line2:#EEEBE3;
    --ink:#19212F; --ink2:#3C4557; --mut:#8B93A3;
    --navy:#121A2B; --navy2:#1E2941;
    --gold:#B0812C; --gold-soft:#C9A24B; --gold-line:#D8C79A;
    --ok:#2E7A54; --ok-l:#EAF4EE; --ok-b:#BFDECC;
    --err:#A23A2B; --err-l:#F8EDEB; --err-b:#E6C6BE;
    --warn:#A9781F; --warn-l:#F8F1E2; --warn-b:#E7D3A6;
    --blue:#2C5A8C;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
       font-size:14px;line-height:1.58;min-height:100vh;-webkit-font-smoothing:antialiased;
       background-image:radial-gradient(circle at 1px 1px, rgba(18,26,43,.035) 1px, transparent 0);
       background-size:22px 22px}

  /* ── Cabeçalho (hero) ── */
  header{position:relative;background:linear-gradient(135deg,#0C1322 0%,#141E33 60%,#1C2A45 100%);color:#fff;
         padding:26px 30px 24px;overflow:hidden}
  header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
         background:linear-gradient(90deg,var(--gold) 0%,#E4C877 45%,transparent 80%)}
  header::before{content:'';position:absolute;top:-40%;right:-6%;width:340px;height:340px;
         background:radial-gradient(circle,rgba(184,129,44,.16),transparent 68%);pointer-events:none}
  .head-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:20px;position:relative;z-index:1}
  .logo-plate{flex:none;background:#fff;border-radius:12px;padding:11px 14px;min-width:78px;min-height:78px;
         display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .logo-plate img{max-height:64px;max-width:150px;object-fit:contain;display:block}
  .head-tt{flex:1;min-width:0}
  .head-tt .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
         color:var(--gold-line);color:#D8C79A;margin-bottom:5px}
  .head-tt h1{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.1;
         letter-spacing:-.01em;color:#fff;margin:0 0 6px}
  .head-tt .sub{font-size:12.5px;color:#9FB0C8;font-weight:500;letter-spacing:.02em}
  .head-tt .sub b{color:#C9D6E8;font-weight:600}
  .brand{flex:none;display:flex;align-items:center;gap:7px;align-self:flex-start;
         font-size:10.5px;color:#7F91AC;letter-spacing:.04em}
  .brand img{height:19px;opacity:.9}
  @media(max-width:640px){ .head-in{flex-wrap:wrap;gap:14px} .brand{order:3;width:100%;justify-content:flex-start;margin-top:2px} .head-tt h1{font-size:24px} }

  /* ── Corpo ── */
  .wrap{max-width:860px;margin:0 auto;padding:26px 22px 56px}
  .sec{margin-bottom:30px}
  .sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-h .tick{flex:none;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);
         box-shadow:0 0 0 4px rgba(176,129,44,.14)}
  .sec-h .lbl{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy2);white-space:nowrap}
  .sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),var(--line) 60%,transparent)}

  /* Características → grade de especificações */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .car{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:11px;
       padding:13px 15px 14px;transition:box-shadow .16s,border-color .16s}
  .car::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:3px;
       background:var(--gold-line);opacity:.85}
  .car:hover{border-color:#D8C79A;box-shadow:0 6px 18px rgba(18,26,43,.06)}
  .car .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-left:7px}
  .car .v{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);margin-top:4px;
       padding-left:7px;line-height:1.15;font-variant-numeric:tabular-nums}
  .car .v small{font-family:var(--sans);font-size:11.5px;color:var(--mut);font-weight:500;margin-left:4px;letter-spacing:0}

  /* Viabilidades & documentação → linhas editoriais */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
       box-shadow:0 1px 0 rgba(18,26,43,.02)}
  .doc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 17px;border-bottom:1px solid var(--line2)}
  .doc:last-child{border-bottom:none}
  .doc:nth-child(even){background:#FCFBF8}
  .doc .nm{flex:1;min-width:160px;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .doc .nm .sub{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:2px;font-style:italic}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;
       padding:3px 12px 3px 10px;border:1px solid;white-space:nowrap}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .b-sim{color:var(--ok);border-color:var(--ok-b);background:var(--ok-l)}
  .b-nao{color:var(--err);border-color:var(--err-b);background:var(--err-l)}
  .b-proc{color:var(--warn);border-color:var(--warn-b);background:var(--warn-l)}
  .b-na{color:var(--mut);border-color:var(--line);background:#F5F4F0}
  .anexo{font-size:11.5px;font-weight:600;color:var(--blue);text-decoration:none;background:#EDF3FA;
       border:1px solid #DBE7F3;border-radius:8px;padding:3px 10px;white-space:nowrap;transition:background .15s}
  .anexo:hover{background:#E2EDF8}

  .msg{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:40px 28px;
       text-align:center;color:var(--mut);font-size:13.5px}
  .msg .big{font-family:var(--serif);font-size:19px;color:var(--ink2);font-weight:500;margin-bottom:6px}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;
       animation:g .8s linear infinite;margin:0 auto 14px}
  @keyframes g{to{transform:rotate(360deg)}}

  .foot{max-width:860px;margin:0 auto;padding:0 22px 40px;display:flex;align-items:center;gap:8px;
       color:var(--mut);font-size:11px;letter-spacing:.03em}
  .foot::before{content:'';flex:1;height:1px;background:var(--line)}
  .foot img{height:15px;opacity:.6}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo-plate" id="logoPlate">
      <img id="empLogo" alt="" onerror="document.getElementById('logoPlate').style.display='none'">
    </div>
    <div class="head-tt">
      <div class="eyebrow" id="empEyebrow">Ficha do empreendimento</div>
      <h1 id="empNome">Empreendimento</h1>
      <div class="sub" id="empSub">carregando…</div>
    </div>
    <div class="brand"><img src="logo_symbol.png" alt="Auria" onerror="this.style.display='none'"><span>por Auria</span></div>
  </div>
</header>
<div class="wrap" id="wrap">
  <div class="msg"><div class="spin"></div>Carregando a ficha…</div>
</div>
<div class="foot" id="foot" style="display:none"><img src="logo_symbol.png" alt="" onerror="this.style.display='none'"><span>Ficha gerada pelo Auria CDE</span></div>
<script>
const sb = window.supabase.createClient(
  'https://sabzccokueowpromwxdg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhYnpjY29rdWVvd3Byb213eGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MjIxMTcsImV4cCI6MjA5MDQ5ODExN30.2sjY0auOwEEjkaXF7jaE_fRB8FG5H2r18BQqp-5HOcE');
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qp(k){ return new URLSearchParams(location.search).get(k); }

function statusBadge(op, st){
  if(st==='sim')      return '<span class="badge b-sim">Sim</span>';
  if(st==='nao')      return '<span class="badge b-nao">Não</span>';
  if(st==='processo') return '<span class="badge b-proc">Em processo</span>';
  return '<span class="badge b-na">—</span>';
}
function subLabel(v){ return v==='sim'?'Sim':v==='nao'?'Não':v==='adefinir'?'A definir':'—'; }

function render(nome, logoUrl, config){
  $('empNome').textContent = nome || 'Empreendimento';
  // Logo do EMPREENDIMENTO (cadastrada no painel da gestão). Sem logo → esconde a placa.
  if(logoUrl){ $('empLogo').src = logoUrl; $('empLogo').alt = nome||''; }
  else { $('logoPlate').style.display='none'; }
  const b = (config&&config.briefing) || null;
  const linha = [config&&config.tipo_empreendimento, config&&config.tipologia].filter(Boolean);
  $('empSub').innerHTML = linha.length ? linha.map(x=>`<b>${esc(x)}</b>`).join(' · ') : 'Ficha do empreendimento';
  $('foot').style.display='flex';
  if(!b || ((!b.carac||!b.carac.length) && (!b.docs||!b.docs.length))){
    $('wrap').innerHTML = '<div class="msg"><div class="big">Ficha ainda não preenchida</div>Este empreendimento não tem características ou viabilidades cadastradas.</div>';
    return;
  }
  let html='';
  // Características (só as com valor)
  const carac = (b.carac||[]).filter(c=>(c.valor||'').toString().trim());
  if(carac.length){
    html += '<div class="sec"><div class="sec-h"><span class="tick"></span><span class="lbl">Características gerais</span><span class="rule"></span></div><div class="grid">'
      + carac.map(c=>`<div class="car"><div class="k">${esc(c.rotulo)}</div><div class="v">${esc(c.valor)}${c.unidade?` <small>${esc(c.unidade)}</small>`:''}</div></div>`).join('')
      + '</div></div>';
  }
  // Viabilidades & documentação (só as com status definido)
  const docs = (b.docs||[]).filter(d=>d.status);
  if(docs.length){
    html += '<div class="sec"><div class="sec-h"><span class="tick"></span><span class="lbl">Viabilidades &amp; documentação</span><span class="rule"></span></div><div class="panel">'
      + docs.map(d=>{
        let sub='';
        if(d.cond && (d.cond.quando||[]).includes(d.status)){
          if(d.cond.tipo==='status3' && d.sub) sub = `<span class="sub">${esc(d.cond.rotulo)}: ${esc(subLabel(d.sub))}</span>`;
          else if(d.cond.tipo==='texto' && (d.texto||'').trim()) sub = `<span class="sub">${esc(d.cond.rotulo)}: ${esc(d.texto)}</span>`;
        }
        let anexo='';
        if(d.anexo && d.anexo.documento_id){
          anexo = d.anexo.qr_token
            ? `<a class="anexo" href="v.html?p=${esc(d.anexo.qr_token)}" target="_blank" rel="noopener">🔗 ${esc(d.anexo.codigo||'ver PDF')}</a>`
            : `<span class="anexo" style="color:var(--mut);background:#F1F0EC;border-color:var(--line)">🔗 ${esc(d.anexo.codigo||'')}</span>`;
        }
        return `<div class="doc"><div class="nm">${esc(d.rotulo)}${sub}</div>${anexo}${statusBadge(d.op,d.status)}</div>`;
      }).join('')
      + '</div></div>';
  }
  if(!html) html='<div class="msg"><div class="big">Ficha ainda não preenchida</div>Este empreendimento não tem características ou viabilidades cadastradas.</div>';
  $('wrap').innerHTML = html;
}

(async function(){
  const emp = qp('emp');
  if(!emp){ $('wrap').innerHTML='<div class="msg">Link inválido (sem empreendimento).</div>'; return; }
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data&&r.data.session; }catch(e){}
  if(!session){ location.replace('./'); return; }  // sem sessão → login único
  try{
    const { data, error } = await sb.rpc('cde_ficha_empreendimento', { p_emp: emp });
    if(error) throw error;
    const row = data && data[0];
    if(!row){ $('wrap').innerHTML='<div class="msg">Você não tem acesso a este empreendimento, ou ele não existe.</div>'; $('empSub').textContent=''; return; }
    render(row.nome, row.logo_url, row.config);
  }catch(e){
    $('wrap').innerHTML='<div class="msg">Erro ao carregar a ficha: '+esc(e.message||e)+'</div>';
    $('empSub').textContent='';
  }
})();
</script>
</body>
</html>
