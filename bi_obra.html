<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI · Obra</title><link rel="icon" href="logo.ico"><style>
:root{--bg:#EEF2F7;--panel:#FFFFFF;--panel2:#F6F9FC;--line:#E2E8F0;--txt:#0F172A;--txt2:#334155;--mut:#64748B;
  --navy:#1E3A5F;--accent:#E8960A;--ok:#1E8449;--warn:#B7791F;--err:#A32D2D;--info:#2563A8;--rep:#7C3AED;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace}
body.dark{--bg:#0B1220;--panel:#141C2B;--panel2:#1B2536;--line:#26324A;--txt:#E8EEF6;--txt2:#C2CFDF;--mut:#8496AC;
  --navy:#7FB3D3;--accent:#F0A72A;--ok:#4ADE80;--warn:#E9B44C;--err:#F87171;--info:#60A5FA;--rep:#A78BFA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:var(--bg);color:var(--txt);line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
svg.ci{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex-shrink:0}
.mono{font-family:var(--mono)}

/* Barra (padrão CDE) */
header{background:linear-gradient(90deg,#0B1220,#152036);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:20px;min-height:58px;flex-shrink:0}
header .lg{height:22px;display:block}
header .tt{border-left:2px solid #E8960A;padding-left:12px}
header .tt b{display:block;font-size:11.5px;color:rgba(255,255,255,.78);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
header .tt span{display:block;font-size:10.5px;color:#8FA6C0;margin-top:2px}
header .sp{flex:1}
/* Logos da construtora e do empreendimento — mesmo slot .elogo do CDE */
header .elogo{width:60px;height:46px;flex-shrink:0;border-radius:8px;background:#fff;border:1.5px solid #E8960A;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-left:-8px}
header .elogo img{max-width:100%;max-height:100%;object-fit:contain;padding:3px;display:block}
header .elogo.ph{border:1.5px dashed #3A4A66;background:rgba(255,255,255,.06);font-family:var(--mono);font-weight:800;font-size:11px;color:#8FA6C0}
.hbtn{background:#1B2942;border:1px solid #2A3850;color:#C9D6E4;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.hbtn:hover{background:#243452}

/* Subbarra: abas + ações */
.sub{background:var(--panel);border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:22px;flex-shrink:0}
.tab{padding:11px 2px 9px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;user-select:none;white-space:nowrap}
.tab.on{color:var(--txt);border-bottom-color:var(--accent)}
.sub .acts{margin-left:auto;display:flex;gap:6px;padding:6px 0}
.abtn{border:1px solid var(--line);background:var(--panel2);color:var(--txt2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-family:inherit;white-space:nowrap}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.abtn:disabled{opacity:.5;cursor:wait}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1440px;margin:0 auto;padding:16px 18px 48px}

/* Recortes */
.segs{display:flex;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg span{padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;border-right:1px solid var(--line);display:flex;gap:6px;align-items:center;user-select:none}
.seg span:last-child{border-right:none}
.seg span.on{background:var(--accent);color:#fff}
.seg span .c{font-family:var(--mono);font-size:11px;opacity:.75;font-style:normal}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:700}

/* Filtros */
.fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;color:var(--mut)}
.srch input{border:none;background:transparent;color:var(--txt);padding:6px 0;font-size:12px;width:230px;outline:none;font-family:inherit}
.ms{position:relative;display:inline-block}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--txt2);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.act{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.clr{border-style:dashed}
.ms-pop{display:none;position:absolute;top:112%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:200px;max-height:300px;overflow:auto;z-index:60;box-shadow:0 12px 32px rgba(15,23,42,.18)}
.ms-pop.on{display:block}
.ms-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--txt);cursor:pointer;white-space:nowrap}
.ms-opt:hover{background:var(--panel2)}
.ms-opt input{accent-color:var(--accent)}
.ms-pop .dlbl{font-size:10px;color:var(--mut);margin:4px 2px 3px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.ms-pop .dinp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit}
.fbar .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-family:var(--mono)}

/* Resumo (cartões com tendência + barra de composição) */
.G{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.G .row{display:grid;grid-template-columns:repeat(5,1fr)}
.G .c{padding:14px 18px 12px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr auto;column-gap:10px;min-width:0}
.G .c:last-child{border-right:none}
.G .c .l{grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:700}
.G .c .v{font-family:var(--mono);font-size:28px;font-weight:800;line-height:1.15}
.G .c svg{width:72px;height:30px;align-self:end}
.G .c .d{grid-column:1/-1;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--err);font-family:var(--mono);font-weight:700}.dn{color:var(--ok);font-family:var(--mono);font-weight:700}.eq{color:var(--mut);font-family:var(--mono);font-weight:700}
.G .gb{padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.G .gbar{display:flex;gap:2px}
.G .gseg{min-width:0}
.G .gseg .k{display:flex;align-items:baseline;gap:6px;white-space:nowrap;padding-bottom:5px;overflow:hidden}
.G .gseg .k b{font-family:var(--mono);font-size:18px;font-weight:800}
.G .gseg .k span{font-size:11.5px;color:var(--txt2)}
.G .gseg i{display:block;height:12px}
.G .gseg:first-child i{border-radius:3px 0 0 3px}.G .gseg:last-child i{border-radius:0 3px 3px 0}
.G .gseg .p{font-family:var(--mono);font-size:10.5px;color:var(--mut);padding-top:4px}
.ticks{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.ticks span{font-size:11.5px;color:var(--mut)} .ticks b{font-family:var(--mono);color:var(--txt)}

/* Seções */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column}
.sh{display:flex;align-items:baseline;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.sh h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--txt2)}
.sh .k{font-family:var(--mono);font-size:11px;color:var(--navy);font-weight:700}
.sh .sp{flex:1}
.sh .mini{font-size:11px;color:var(--mut);text-align:right}
.sb{padding:12px 16px 14px}
.c5{grid-column:span 5}.c7{grid-column:span 7}.c12{grid-column:span 12}
.vazio{color:var(--mut);font-size:12px;padding:18px 0;text-align:center}

/* Tipo × status */
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) 34% 30px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.trow:last-child{border-bottom:none}
.trow:hover .tn,.trow.sel .tn{color:var(--accent)}
.trow .tk{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--navy);text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 0}
.trow .tn{font-size:12.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tn .q{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--err);margin-left:6px;vertical-align:2px}
.trow .bar{display:flex;height:10px;background:var(--panel2);border-radius:2px;overflow:hidden}
.trow .bar i{display:block;height:100%;border-right:1px solid var(--panel)}
.trow .n{font-family:var(--mono);font-weight:800;text-align:right}
.trow.zero .tn,.trow.zero .n{color:var(--mut);opacity:.6}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);flex-wrap:wrap;padding-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Visibilidade ISO 19650 */
.rail{display:flex;gap:10px}
.rlc{display:block;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.06em;line-height:1.3;min-height:26px}
.rail:not(.rv){align-items:flex-end}
.rail>div{min-width:0}
.rl{line-height:1.25;padding-right:4px}
.rl .code{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.08em}
.track{display:flex;gap:3px;height:10px;margin:4px 0 10px}
.track i{display:block;border-radius:3px}
.rv>div{padding-right:6px}
.rv b{display:block;font-family:var(--mono);font-size:24px;font-weight:800;line-height:1.1}
.rv em{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}
.crit{margin-top:16px}
.cr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.cr:last-child{border-bottom:none}
.cr .sv{font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;color:#fff;min-width:24px;text-align:center}
.cr .dots{display:inline-flex;gap:3px;flex-wrap:wrap;margin-left:8px;vertical-align:-1px}
.cr .dots i{width:9px;height:9px;border-radius:2px;display:block}
.cr .n{font-family:var(--mono);font-weight:800}

/* Tabelas */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--txt2)}
tbody tr:last-child td{border-bottom:none}
.hm td.h{text-align:center;font-family:var(--mono);font-weight:700;padding:4px}
.hm td.h span{display:block;border-radius:6px;padding:6px 0}
.hm tbody tr{cursor:pointer}
.hm tbody tr:hover td:first-child{color:var(--accent)}
.cod{font-family:var(--mono);font-weight:700;color:var(--navy);white-space:nowrap}
.rsp td{padding:7px 8px}.rsp .r{text-align:right;font-family:var(--mono);font-weight:700}
.rb{display:flex;align-items:center;gap:8px}.rb .tr{flex:1;height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;min-width:60px}.rb .tr i{display:block;height:100%}
.rb b{font-family:var(--mono);font-size:12px;width:36px;text-align:right}
.lv{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.06em;white-space:nowrap}

/* Gráficos de linha do tempo */
.ev svg.ch{width:100%;display:block}
.ev .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:4px}
.ev .sum{display:flex;gap:18px;margin-top:10px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.ev .sum b{font-family:var(--mono);color:var(--txt);font-size:14px;display:block}

/* Pendências */
.pend td:first-child{padding-left:16px}
.pend tbody tr:hover td{background:var(--panel2)}
.pend .tt{color:var(--txt);font-weight:600}
.pend .tp{font-size:11px;color:var(--mut);display:block;margin-top:1px}
.sv3,.sv2,.sv1{font-family:var(--mono);font-size:9.5px;font-weight:800;color:#fff;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.sv3{background:var(--err)}.sv2{background:var(--warn)}.sv1{background:var(--info)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.p-ab{color:var(--err)}.p-an{color:var(--warn)}.p-re{color:var(--ok)}.p-rp{color:var(--rep)}
.dim{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--txt2);white-space:nowrap}
.dim.d3{color:var(--info);border-color:var(--info)}
.org{font-size:11.5px;color:var(--mut)} .org.ext{color:var(--accent);font-weight:700}
.fx{font-size:11px;font-weight:600;white-space:nowrap}
.fx::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
.fx.wip::before{background:var(--warn)}.fx.sh_::before{background:var(--info)}.fx.pub::before{background:var(--ok)}
.late{color:var(--err);font-weight:700;font-family:var(--mono)}
.mais{display:block;width:100%;padding:9px;border:none;border-top:1px solid var(--line);background:var(--panel2);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:0 0 12px 12px}
.mais:hover{color:var(--accent)}

/* Avaliação */
.aval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.aval-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;cursor:pointer}
.aval-card:hover{border-color:var(--accent)}
.aval-disc{font-size:14px;font-weight:700;margin-bottom:2px;padding-right:56px}
.aval-cls{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.08em;margin-bottom:10px}
.aval-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.aval-row:last-of-type{border:none}
.aval-label{color:var(--mut)}
.aval-val{font-weight:700;font-family:var(--mono)}
.score-num{font-family:var(--mono);font-size:26px;font-weight:800;position:absolute;top:12px;right:16px}
.score-bar{height:6px;background:var(--panel2);border-radius:3px;margin-top:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px}
.empty-aval{text-align:center;color:var(--mut);padding:60px;font-size:14px;grid-column:1/-1}

/* Modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:880px;max-width:96vw;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:1}
.modal-h h3{font-size:15px}
.modal-x{background:transparent;border:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
.det-tbl td,.det-tbl th{padding:7px 10px}

body.embed header{display:none}

@media (max-width:1000px){
  .G .row{grid-template-columns:repeat(2,1fr)}.G .c{border-bottom:1px solid var(--line)}
  .c5,.c7{grid-column:span 12}
  header .tt span{display:none}
}
@media (max-width:640px){
  body{height:100dvh}
  header .elogo{width:40px;height:32px}
  input,select{font-size:16px!important}
  header{gap:10px;padding:10px 12px}
  .sub{overflow-x:auto;gap:16px;padding:0 12px}
  .sub .acts .abtn span{display:none}
  .wrap{padding:12px 12px 40px}
  .srch input{width:140px}
  .pend th:nth-child(4),.pend td:nth-child(4),.pend th:nth-child(5),.pend td:nth-child(5){display:none}
  .sec .sb{overflow-x:auto}
  .ms-pop{max-width:calc(100vw - 24px)}
  .modal-ov{padding:0;align-items:stretch}
  .modal{width:100%;max-width:none;max-height:none;border-radius:0;min-height:100dvh}
}
</style><style>
.nota{border:1px dashed var(--line);padding:7px 12px;font-size:12px;color:var(--txt2);margin-bottom:14px;border-radius:6px}
.selo{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.14em;color:#231703;background:#E8960A;border-radius:4px;padding:3px 8px}
.G .c .v small{font-size:14px;color:var(--mut);margin-left:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:10px;color:var(--mut);text-align:center;font-weight:700}
.cal .dd{height:34px;border-radius:5px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;padding:3px 5px;position:relative;color:var(--txt2)}
.cal .dd em{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:11px}
.cal .dd.fut{opacity:.35}
.rv .rlc{min-height:16px}
<style>
.fin{display:flex;flex-direction:column;gap:12px}
.fin .fl{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;font-size:12px}
.fin .fl .tr{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fin .fl .tr i{display:block;height:100%}
.fin .fl b{font-family:var(--mono);text-align:right}
.tabv{display:none}.tabv.on{display:contents}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;display:none;z-index:300}
.load{padding:60px;text-align:center;color:var(--mut)}
</style></head><body><header>
  <img class="lg" src="logo_auria_branco.png" alt="Auria">
  <div class="tt"><b>BI · Obra</b><span id="hSub">carregando…</span></div>
  <div class="elogo ph" id="lgCon" style="display:none"></div><div class="elogo ph" id="lgEmp" style="display:none"></div>
  <div class="sp"></div>
  <span class="selo">OBRA</span>
  <button class="hbtn" onclick="toggleTheme()" title="Tema"><svg class="ci" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</header>
<div class="sub" id="tabs">
  <div class="tab on" data-v="all">Visão geral</div><div class="tab" data-v="crono">Cronograma</div><div class="tab" data-v="fvs">Qualidade (FVS)</div><div class="tab" data-v="seg">Segurança</div><div class="tab" data-v="rdo">Diário</div><div class="tab" data-v="conc">Concretagem</div><div class="tab" data-v="obr">Obra → Projetos</div>
  <div class="acts"><button class="abtn" id="bXls" onclick="exportarExcel()" title="Exportar Excel (.xlsx)"><svg class="ci" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg><span>Excel</span></button><button class="abtn" id="bPdf" onclick="exportarPDF()" title="Exportar PDF"><svg class="ci" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg><span>PDF</span></button></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// BI da Obra (App Obra). Só leitura. Fontes:
//  cronograma → obra_crono_tarefa_auria (progresso, custos) + obra_crono_base_auria (LB ativa) + obra_crono_medicao_auria (histórico)

// leitura paginada (o cronograma do Diagonal tem 11 mil tarefas; o servidor entrega 1000 por vez)
// 1ª página traz o total; as demais vão em paralelo.
async function tudo(tab,sel,ord,f){
  const pg=(de,cnt)=>{ let q=sb.from(tab).select(sel,cnt?{count:'exact'}:undefined).eq('empreendimento_id',EMP_ID).order(ord||'id').range(de,de+999); return f?f(q):q; };
  const r0=await pg(0,true); if(r0.error){ console.warn(tab,r0.error.message); return []; }
  const tot=r0.count||0, rs=[]; for(let de=1000;de<tot;de+=1000) rs.push(pg(de));
  const out=(r0.data||[]).slice(); (await Promise.all(rs)).forEach(r=>{ if(r.error) throw new Error(tab+': '+r.error.message); out.push(...(r.data||[])); }); return out; }

async function carregar(){

    tudo('obra_crono_tarefa_auria','uid,wbs,nome,nivel,tipo,pavimento,inicio,fim,progresso,custo_orcado,custo_realizado','ordem'),
    sb.from('obra_crono_base_auria').select('nome,tarefas').eq('empreendimento_id',EMP_ID).eq('ativa',true).maybeSingle(),
    tudo('obra_crono_medicao_auria','tarefa_uid,data,percentual,lancado_em'),
    tudo('fvs_inspecao_auria','codigo,servico,modelo_codigo,pavimento_id,local_txt,situacao,tipo,rodada,aberta_em,enviado_em,aprovado_em,reprovado_em'),

    tudo('cde_rdo_auria','data,clima_manha,clima_tarde,efetivo,ocorrencias,fechado_em'),
    tudo('conc_concretagem_auria','id,codigo,descricao,pavimento_id,data_prevista,data_realizada,volume_previsto,fck_mpa,situacao'),
    tudo('conc_cp_auria','concretagem_id,romper_em,rompido_em,resultado_mpa'),
    sb.from('cde_pavimento_auria').select('id,codigo,nome').eq('empreendimento_id',EMP_ID),
    sb.from('apontamentos').select('id,titulo,tipo,disciplina,status,data_criacao,atualizado_em,criado_por_nome,criado_por_papel,mensagens,log_json').eq('empreendimento_id',EMP_ID).or('criado_por_papel.eq.obra,id.like.OBR-*')]);

}

// ══════════════ cálculo ══════════════
function calcCrono(){
  const L=RAW.T, bm={}; ((RAW.BASE&&RAW.BASE.tarefas)||[]).forEach(x=>bm[x.uid]=x);
  const T=L.map((r,i)=>({uid:r.uid,wbs:r.wbs,nome:r.nome,nivel:+r.nivel||0,ini:D(r.inicio),fim:D(r.fim),prog:+r.progresso||0,orc:+r.custo_orcado||0,rea:+r.custo_realizado||0,
    bini:bm[r.uid]?D(bm[r.uid].inicio):null,bfim:bm[r.uid]?D(bm[r.uid].fim):null,fase:i+1<L.length&&(+L[i+1].nivel||0)>(+r.nivel||0)}));
  const fol=T.filter(t=>!t.fase&&t.ini!=null&&t.fim!=null);
  const usaCusto=fol.some(t=>t.orc>0);
  fol.forEach(t=>{ t.w=usaCusto?t.orc:Math.max(1,t.fim-t.ini+1); });
  const prevEm=(t,n)=>{ const a=t.bini!=null?t.bini:t.ini, z=t.bfim!=null?t.bfim:t.fim; if(n<a) return 0; if(n>=z) return 100; return (n-a+1)/(z-a+1)*100; };
  const W=fol.reduce((s,t)=>s+t.w,0)||1;
  const pond=(lst,f)=>{ let a=0,b=0; lst.forEach(t=>{ a+=t.w*f(t); b+=t.w; }); return b?a/b:0; };
  const real=pond(fol,t=>t.prog), prev=pond(fol,t=>prevEm(t,HOJE));
  // histórico do realizado: medição vigente por tarefa em cada data; sem medição usa 0 antes de hoje
  const medU={}; RAW.MEDS.forEach(m=>{ (medU[m.tarefa_uid]=medU[m.tarefa_uid]||[]).push([D(m.data),+m.percentual]); });
  Object.values(medU).forEach(a=>a.sort((x,y)=>x[0]-y[0]));
  const realEm=(t,n)=>{ const a=medU[t.uid]; if(!a) return 0; let v=0; for(const [d,p] of a){ if(d>n) break; v=p; } return v; };
  const ini=fol.length?Math.min(...fol.map(t=>t.bini!=null?Math.min(t.bini,t.ini):t.ini)):HOJE, fim=fol.length?Math.max(...fol.map(t=>t.bfim!=null?Math.max(t.bfim,t.fim):t.fim)):HOJE;
  const np=60, pts=[...Array(np+1)].map((_,k)=>Math.round(ini+(fim-ini)*k/np));
  const curvaP=pts.map(d=>pond(fol,t=>prevEm(t,d)));
  const curvaR=RAW.MEDS.length?pts.filter(d=>d<HOJE).map(d=>pond(fol,t=>realEm(t,d))):[];
  // etapas: fases do nível 1 (ou 0, se não houver), com a média das folhas abaixo
  const nivF=T.some(t=>t.fase&&t.nivel===1)?1:0, etapas=[];
  T.forEach((t,i)=>{ if(!t.fase||t.nivel!==nivF) return; const sub=[]; for(let k=i+1;k<T.length&&T[k].nivel>t.nivel;k++) if(!T[k].fase&&T[k].w!=null) sub.push(T[k]);
    if(!sub.length) return; const p=pond(sub,u=>prevEm(u,HOJE)), r=pond(sub,u=>u.prog); etapas.push({wbs:t.wbs,nome:t.nome,prev:p,real:r,desv:r-p}); });
  const atrasadas=fol.filter(t=>t.prog<100&&((t.bfim!=null?t.bfim:t.fim)<HOJE||prevEm(t,HOJE)-t.prog>10));
  const orc=fol.reduce((s,t)=>s+t.orc,0), rea=fol.reduce((s,t)=>s+t.rea,0);
  const va=fol.reduce((s,t)=>s+t.orc*t.prog/100,0), vp=fol.reduce((s,t)=>s+t.orc*prevEm(t,HOJE)/100,0);
  return {n:T.length,nFol:fol.length,usaCusto,real,prev,desv:real-prev,ini,fim,pts,curvaP,curvaR,etapas:etapas.filter(e=>e.desv<-0.05).sort((a,b)=>a.desv-b.desv),
    etapasTodas:etapas,atrasadas,orc,rea,va,vp,base:RAW.BASE&&RAW.BASE.nome,temMed:RAW.MEDS.length>0};
}
function noPer(s){ const d=D(s); if(d==null) return false; return PER===0||d>HOJE-PER; }
function pavCod(id){ const p=RAW.PAV[id]; return p?(p.codigo||p.nome):'—'; }
function calcular(){

  const F=RAW.FVS.filter(x=>noPer(x.aberta_em)), st={aprovada:0,enviada:0,aberta:0,reprovada:0};
  const grp=x=>x.situacao==='aprovada'?'aprovada':x.situacao==='reprovada'?'reprovada':x.situacao==='aguardando'||x.situacao==='em_verificacao'?'enviada':'aberta';
  F.forEach(x=>st[grp(x)]++);
  const serv={}; F.forEach(x=>{ const k=x.servico||x.modelo_codigo||'—'; (serv[k]=serv[k]||{n:k,cod:x.modelo_codigo||'',v:{aprovada:0,enviada:0,aberta:0,reprovada:0}}).v[grp(x)]++; });
  const pav={}; F.filter(x=>grp(x)!=='aprovada').forEach(x=>{ const k=pavCod(x.pavimento_id); const o=pav[k]=pav[k]||{p:k,ab:0,env:0,v7:0}; if(grp(x)==='enviada') o.env++; else o.ab++; if(D(x.aberta_em)<HOJE-7) o.v7++; });
  const apr=F.filter(x=>x.situacao==='aprovada'), apr1=apr.filter(x=>(+x.rodada||1)<=1).length;
  const tAp=apr.map(x=>D(x.aprovado_em)-D(x.aberta_em)).filter(v=>v!=null&&v>=0);
  const pend7=F.filter(x=>grp(x)!=='aprovada'&&D(x.aberta_em)<HOJE-7).length;
  // segurança
  const AL=RAW.AL.filter(x=>x.situacao==='ativo'||noPer(x.emitido_em)), alN={};
  ['interdicao','atencao','informativo'].forEach(k=>alN[k]={at:AL.filter(x=>x.nivel===k&&x.situacao==='ativo').length,enc:AL.filter(x=>x.nivel===k&&x.situacao!=='ativo').length});
  const OC=RAW.OC.filter(x=>noPer(x.ocorreu_em));
  const ocN={ca:OC.filter(x=>x.tipo==='acidente'&&x.com_afastamento).length,sa:OC.filter(x=>x.tipo==='acidente'&&!x.com_afastamento).length,qa:OC.filter(x=>x.tipo==='quase_acidente').length,

  const caD=RAW.OC.filter(x=>x.tipo==='acidente'&&x.com_afastamento).map(x=>D(x.ocorreu_em)).filter(v=>v!=null).sort((a,b)=>b-a);
  const semAc=caD.length?{d:HOJE-caD[0],tx:'desde '+BR(caD[0])}:(C.nFol?{d:Math.max(0,HOJE-C.ini),tx:'nenhum registrado · desde o início da obra'}:{d:null,tx:'nenhum registrado'});
  // diário
  const RD=RAW.RDO.filter(x=>noPer(x.data)), efe=r=>(Array.isArray(r.efetivo)?r.efetivo:[]).reduce((s,e)=>s+(+e.qtd||0),0);
  const chuva=r=>/chuv/i.test((r.clima_manha||'')+' '+(r.clima_tarde||''));
  const efs=RD.map(efe).filter(v=>v>0);
  const rdo={n:RD.length,fech:RD.filter(r=>r.fechado_em).length,efm:efs.length?Math.round(efs.reduce((a,b)=>a+b,0)/efs.length):0,pico:efs.length?Math.max(...efs):0,
    chuva:RD.filter(chuva).length,oc:RD.reduce((s,r)=>s+(Array.isArray(r.ocorrencias)?r.ocorrencias.length:0),0),porDia:{}};
  RAW.RDO.forEach(r=>rdo.porDia[r.data]={ef:efe(r),ch:chuva(r)});
  // concretagem
  const CO=RAW.CONC.filter(x=>x.situacao!=='cancelada'&&(noPer(x.data_realizada)||noPer(x.data_prevista)));
  const coR=CO.filter(x=>x.situacao==='concluida'), fck={}; RAW.CONC.forEach(c=>fck[c.id]=+c.fck_mpa||0);
  const rompidos=RAW.CP.filter(c=>c.resultado_mpa!=null), baixos=rompidos.filter(c=>fck[c.concretagem_id]&&+c.resultado_mpa<fck[c.concretagem_id]);
  const conc={n:CO.length,real:coR.length,vol:coR.reduce((s,x)=>s+(+x.volume_previsto||0),0),volP:CO.reduce((s,x)=>s+(+x.volume_previsto||0),0),
    rompidos:rompidos.length,baixos:baixos.length,semana:RAW.CP.filter(c=>c.resultado_mpa==null&&D(c.romper_em)>=HOJE&&D(c.romper_em)<HOJE+7).length,
    atras:RAW.CP.filter(c=>c.resultado_mpa==null&&D(c.romper_em)<HOJE).length};
  // obra → projetos (mesma regra do bi.html)
  const pd=s=>D(String(s||'').trim().slice(0,10))??(()=>{ const m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m?Date.UTC(+m[3],+m[2]-1,+m[1])/864e5:null; })();
  const resp1=i=>{ const ds=[]; (Array.isArray(i.mensagens)?i.mensagens:[]).forEach(m=>{ if(m&&m.de&&m.de!=='obra'){ const x=pd(m.data); if(x!=null) ds.push(x); } });
    (Array.isArray(i.log_json)?i.log_json:[]).forEach(l=>{ if(l&&l.tipo!=='sistema'&&l.autor&&l.autor!==i.criado_por_nome){ const x=pd(l.data); if(x!=null) ds.push(x); } }); return ds.length?Math.min(...ds):null; };

  const tR=[]; AP.forEach(i=>{ const c=pd(i.data_criacao), r=resp1(i); if(c!=null&&r!=null&&r>=c) tR.push(r-c); });

    t:tR.length?tR.reduce((a,b)=>a+b,0)/tR.length:null,fila:AP.filter(i=>i.status!=='Resolvido').sort((a,b)=>(pd(a.data_criacao)||0)-(pd(b.data_criacao)||0)).map(i=>({...i,dias:pd(i.data_criacao)!=null?HOJE-pd(i.data_criacao):null}))};

function desenhaCurva(){ const C=R.C, svg=$('curvaS'); if(!svg) return;
  const X=d=>10+(d-C.ini)/Math.max(1,C.fim-C.ini)*380, Y=v=>148-v*1.36; let g='';
  for(let k=0;k<=4;k++) g+='<line x1="0" x2="400" y1="'+Y(k*25)+'" y2="'+Y(k*25)+'" style="stroke:var(--line)"/>';
  if(HOJE>=C.ini&&HOJE<=C.fim) g+='<line x1="'+X(HOJE)+'" x2="'+X(HOJE)+'" y1="8" y2="148" style="stroke:var(--mut)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/><text x="'+(X(HOJE)+3)+'" y="16" font-size="9" font-family="ui-monospace,Consolas,monospace" style="fill:var(--mut)">HOJE</text>';
  g+='<polyline points="'+C.pts.map((d,k)=>X(d)+','+Y(C.curvaP[k])).join(' ')+'" style="fill:none;stroke:var(--navy)" stroke-width="2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>';
  const rp=C.curvaR.map((v,k)=>[C.pts[k],v]); rp.push([Math.min(HOJE,C.fim),C.real]);
  if(rp.length>1){ g+='<polygon points="'+rp.map(p=>X(p[0])+','+Y(p[1])).join(' ')+' '+X(rp[rp.length-1][0])+',148 '+X(rp[0][0])+',148" style="fill:var(--accent);opacity:.12"/>'
    +'<polyline points="'+rp.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'" style="fill:none;stroke:var(--accent)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>'; }
  const u=rp[rp.length-1]; g+='<circle cx="'+X(u[0])+'" cy="'+Y(u[1])+'" r="3.2" style="fill:var(--accent)" vector-effect="non-scaling-stroke"/>';
  svg.innerHTML=g;
  $('curvaAx').innerHTML=[...Array(7)].map((_,k)=>'<span>'+BR(Math.round(C.ini+(C.fim-C.ini)*k/6))+'</span>').join('');
}

async function _imgPDF(src,maxW){ try{

  const c0=document.createElement('canvas'); c0.width=w0; c0.height=h0; const g0=c0.getContext('2d'); g0.fillStyle='#fff'; g0.fillRect(0,0,w0,h0); g0.drawImage(im,0,0,w0,h0);

  for(let y=0;y<h0;y++) for(let x=0;x<w0;x++){ const p=(y*w0+x)*4; if(px[p]<235||px[p+1]<235||px[p+2]<235){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0){ x0=0;y0=0;x1=w0-1;y1=h0-1; }

  topo();
  const C=R.C, kp=[['AVANÇO FÍSICO',n1(C.real)+'%','previsto '+n1(C.prev)+'% · '+pp(C.desv)],['AVANÇO FINANCEIRO',pct(C.rea,C.orc)+'%',brl(C.rea)+' de '+brl(C.orc)],['TAREFAS ATRASADAS',String(C.atrasadas.length),'de '+C.nFol],['ALERTAS ATIVOS',String(R.alAt),R.alN.interdicao.at+' interdição'],['DIAS SEM ACIDENTE',R.semAc.d==null?'—':String(R.semAc.d),'com afastamento']];
  const cw=(W-2*M)/kp.length, ky=26; doc.setDrawColor(226,232,240); doc.setLineWidth(.3); doc.roundedRect(M,ky,W-2*M,22,2,2);
  kp.forEach((k,j)=>{ const x=M+j*cw; if(j) doc.line(x,ky,x,ky+22); doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...MUT); doc.text(k[0],x+4,ky+5);
    doc.setFont('courier','bold'); doc.setFontSize(18); doc.setTextColor(15,23,42); doc.text(k[1],x+4,ky+13); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...MUT); doc.text(k[2],x+4,ky+18); });
  const tb=(head,body,y,o)=>{ doc.autoTable(Object.assign({startY:y,head:[head],body,margin:{left:M,right:M,top:26},theme:'grid',styles:{fontSize:7.5,cellPadding:1.6,lineColor:[226,232,240],lineWidth:.2,textColor:[51,65,85]},
    headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[246,249,252]},didDrawPage:()=>{ if(doc.internal.getCurrentPageInfo().pageNumber>1) topo(); }},o||{})); return doc.lastAutoTable.finalY; };
  const sec=(t,y)=>{ if(y>175){ doc.addPage(); topo(); y=28; } doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...NAVY); doc.text(t.toUpperCase(),M,y); return y+2; };
  let y=sec('Resumo',56); y=tb(['Indicador','Valor','Detalhe'],_resumo().map(r=>r.map(String)),y,{columnStyles:{0:{cellWidth:90}}})+8;
  y=sec('Etapas em atraso',y); y=tb(['EAP','Etapa','Previsto','Real','Desvio'],C.etapas.slice(0,25).map(e=>[e.wbs,e.nome,n1(e.prev)+'%',n1(e.real)+'%',pp(e.desv)]),y,{columnStyles:{1:{cellWidth:120}}})+8;
  if(R.serv.length){ y=sec('FVS por serviço',y); y=tb(['Serviço','Aprovadas','Enviadas','Abertas','Reprovadas','Total'],R.serv.map(s=>[s.n,s.v.aprovada,s.v.enviada,s.v.aberta,s.v.reprovada,sum(s.v)]),y)+8; }
  if(R.obr.fila.length){ y=sec('Obra → Projetos (pendentes)',y); tb(['Código','Título','Status','Aberto há'],R.obr.fila.map(i=>[i.id,i.titulo||'',i.status||'',i.dias==null?'—':i.dias+' d']),y,{columnStyles:{1:{cellWidth:120}}}); }
  const np=doc.internal.getNumberOfPages(); for(let k=1;k<=np;k++){ doc.setPage(k); doc.setFontSize(7); doc.setTextColor(...MUT); doc.text('Auria · auria.solutions',M,doc.internal.pageSize.getHeight()-6); doc.text(k+' / '+np,W-M,doc.internal.pageSize.getHeight()-6,{align:'right'}); }
  doc.save(_arq('pdf'));
}); }

// ══════════════ tema / boot ══════════════
function applyTheme(){ document.body.classList.toggle('dark',(localStorage.getItem('auria_theme')||'light')==='dark'); }
function toggleTheme(){ localStorage.setItem('auria_theme',(localStorage.getItem('auria_theme')||'light')==='light'?'dark':'light'); applyTheme(); }
window.addEventListener('message',ev=>{ const d=ev.data||{}; if(d.auria_tema){ localStorage.setItem('auria_theme',d.auria_tema); applyTheme(); } });
async function boot(){
  applyTheme();
  const {data:s}=await sb.auth.getSession(); if(!s||!s.session){ location.replace('./'); return; }
  if(!EMP_ID){ $('wrap').innerHTML='<div class="load">Abra o BI da Obra pelo App Obra, dentro do empreendimento.<br><br><a class="abtn" href="app_obra.html">Ir para o App Obra</a></div>'; $('hSub').textContent=''; return; }
  const {data:e}=await sb.from('empreendimentos_auria').select('nome,codigo,logo_url,construtora_id').eq('id',EMP_ID).maybeSingle(); EMP=e||{};
  const slot=(id,url,sig,tit)=>{ const el=$(id); el.style.display='flex'; if(url){ el.className='elogo'; el.innerHTML='<img src="'+esc(url)+'" alt="">'; } else { el.className='elogo ph'; el.textContent=sig||'?'; } el.title=tit||''; };
  if(EMP.construtora_id){ const {data:c}=await sb.from('construtoras_auria').select('nome,logo_url').eq('id',EMP.construtora_id).maybeSingle();
    if(c){ CON={nome:c.nome,logo:c.logo_url}; slot('lgCon',c.logo_url,(c.nome||'').slice(0,3).toUpperCase(),c.nome); }
    else { const r=await sb.rpc('emp_logos',{p_emp:EMP_ID}); const x=((r.data)||[])[0]||{}; const u=x.empresa_logo||x.grupo_logo; if(u){ CON={logo:u}; slot('lgCon',u,'',''); } } }   // obra não lê construtoras_auria (RLS)
  if(EMP.nome) slot('lgEmp',EMP.logo_url,EMP.codigo,EMP.nome);
  try{ await carregar(); }catch(err){ console.error(err); $('wrap').innerHTML='<div class="load">Não foi possível ler os indicadores: '+esc(err.message||err)+'</div>'; }
  $('hSub').textContent=(EMP.nome||'')+' · atualizado '+new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}
document.addEventListener('DOMContentLoaded',boot);
</script>
