<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auria BIM</title>
  <link rel="icon" href="/logo_symbol.png" type="image/png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #fff; min-height: 100vh; }

    header {
      background: #1a1d27;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2d3a;
    }
    header h1 { font-size: 20px; font-weight: 600; color: #e2e8f0; }
    header span { font-size: 12px; color: #64748b; margin-top: 2px; display: block; }

    .logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }

    main { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .project-card:hover {
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    .project-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .project-card p { font-size: 13px; color: #64748b; }

    .floors-list {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .floor-tag {
      background: #0f172a;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      background: #1e3a5f;
      color: #60a5fa;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 32px;
      color: #334155;
    }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #475569; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="/logo_symbol.png" alt="Auria" /></div>
    <div>
      <h1>Auria BIM</h1>
      <span>Plataforma de Auditoria de Projetos</span>
    </div>
  </header>

  <main>
    <p class="section-title">Projetos ativos</p>
    <div class="projects-grid" id="projectsGrid">
      <div class="empty-state">
        <h2>Nenhum projeto carregado</h2>
        <p>Use o aplicativo Windows para importar um modelo IFC.</p>
      </div>
    </div>
  </main>

  <script type="module" src="/src/projects.js"></script>
</body>
</html>
