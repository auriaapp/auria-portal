<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auria BIM</title>
  <link rel="icon" href="/logo_symbol.png" type="image/png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    /* ── Header ── */
    header {
      background: #1a1d27;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2d3a;
    }
    header h1 { font-size: 20px; font-weight: 600; color: #e2e8f0; }
    header span { font-size: 12px; color: #64748b; margin-top: 2px; display: block; }
    .logo { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Main ── */
    main { padding: 32px; max-width: 760px; margin: 0 auto; }

    .section-title {
      font-size: 13px; font-weight: 600; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px;
    }

    /* ── Building section ── */
    .building-section { margin-bottom: 32px; }

    .building-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700; color: #e2e8f0;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 1px solid #2a2d3a;
    }
    .building-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #f97316; flex-shrink: 0;
    }

    /* ── Discipline card ── */
    .disciplines-list { display: flex; flex-direction: column; gap: 6px; }

    .disc-card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .disc-card:hover { border-color: #3b4460; }
    .disc-card.open  { border-color: #3b82f6; }

    .disc-header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .disc-header:hover { background: rgba(59,130,246,0.05); }

    .disc-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .disc-label {
      font-size: 14px; font-weight: 600; color: #e2e8f0; flex: 1;
    }
    .disc-full-link {
      font-size: 11px; color: #38bdf8; text-decoration: none;
      padding: 3px 8px; border: 1px solid #1e3a5f; border-radius: 5px;
      white-space: nowrap; transition: background 0.15s, color 0.15s;
    }
    .disc-full-link:hover { background: #1e3a5f; color: #fff; }

    .disc-chevron {
      color: #475569; font-size: 18px; font-weight: 300;
      transition: transform 0.2s; line-height: 1;
      transform: rotate(0deg);
    }
    .disc-card.open .disc-chevron { transform: rotate(90deg); }

    /* ── Body (floors list) ── */
    .disc-body {
      display: none;
      border-top: 1px solid #2a2d3a;
    }
    .disc-card.open .disc-body { display: block; }

    .floor-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 16px 11px 34px;
      font-size: 13px; color: #94a3b8;
      text-decoration: none;
      border-bottom: 1px solid #1a1d27;
      transition: background 0.12s, color 0.12s;
    }
    .floor-row:last-child { border-bottom: none; }
    .floor-row:hover { background: #0f1117; color: #e2e8f0; }
    .floor-arrow { color: #3b82f6; font-size: 13px; }

    .no-floors { padding: 12px 16px 12px 34px; font-size: 12px; color: #475569; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 80px 32px; color: #334155; }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #475569; }
    .empty-state p { font-size: 14px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      main { padding: 20px 16px; }
      header { padding: 14px 16px; }
      .building-title { font-size: 16px; }
    }
  </style>
  <script type="module" crossorigin src="/assets/main-CRyFkGlE.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index-DnZfQelR.js">
</head>
<body>
  <header>
    <div class="logo"><img src="/logo_symbol.png" alt="Auria" /></div>
    <div>
      <h1>Auria BIM</h1>
      <span>Plataforma de Auditoria de Projetos</span>
    </div>
  </header>

  <main>
    <p class="section-title">Projetos ativos</p>
    <div id="projectsGrid">
      <div class="empty-state">
        <h2>Nenhum projeto carregado</h2>
        <p>Use o aplicativo Windows para importar um modelo IFC.</p>
      </div>
    </div>
  </main>

</body>
</html>
